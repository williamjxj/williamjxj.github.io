<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AgenticAP 系统架构、发票摄取与自校验、Chat RAG 查询路径的交互式动态图集。">
  <title>AgenticAP · 动态架构图集</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="../css/docs-shell.css">
  <style>
    :root{color-scheme:light;--paper:#f5f5f5;--surface:#fff;--ink:#252a35;--muted:#586174;--line:rgba(45,49,66,.16);--accent:#087e8b;--shadow:0 12px 34px rgba(36,48,66,.08);font-family:Inter,"Noto Sans SC","PingFang SC",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink)}
    main{width:min(100%,1560px);margin:0 auto;padding:32px clamp(16px,4vw,56px) 42px}
    .eyebrow{margin:0 0 8px;color:var(--accent);font:600 11px/1.4 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-.035em}
    .intro{max-width:780px;margin:12px 0 22px;color:var(--muted);font-size:14px;line-height:1.7}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;padding:0;border-bottom:1px solid var(--line)}
    .tab{position:relative;min-height:46px;padding:11px 16px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;line-height:1.35;cursor:pointer}
    .tab:hover{background:rgba(255,255,255,.65);color:var(--ink)}
    .tab[aria-selected="true"]{border-color:var(--line);background:var(--surface);color:var(--ink);box-shadow:0 -2px 0 var(--accent) inset}
    .tab:focus-visible{outline:3px solid rgba(8,126,139,.35);outline-offset:2px}
    .panel{overflow:hidden;border:1px solid var(--line);border-radius:0 10px 10px 10px;background:var(--surface);box-shadow:var(--shadow)}
    .panel[hidden]{display:none}
    .panel iframe{display:block;width:100%;height:min(79vh,1050px);min-height:690px;border:0;background:#fff}
    .hint{margin:12px 2px 0;color:var(--muted);font-size:12px;line-height:1.6}
    @media(max-width:700px){main{padding-top:24px}.tabs{gap:4px}.tab{flex:1 1 44%;padding:10px 8px;font-size:12px}.panel iframe{height:76vh;min-height:620px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">AgenticAP · Architecture diagrams</p>
    <h1>AgenticAP 动态架构图集</h1>
    <p class="intro">按标签切换系统总览、发票处理和 Chat 检索路径。每张图保留 Archify 的交互控件，可在图内开启动画、播放引导章节并探索节点。</p>

    <div class="tabs" role="tablist" aria-label="AgenticAP 架构图">
      <button class="tab" id="tab-system" type="button" role="tab" aria-selected="true" aria-controls="panel-system" tabindex="0">系统架构总览</button>
      <button class="tab" id="tab-ingestion" type="button" role="tab" aria-selected="false" aria-controls="panel-ingestion" tabindex="-1">发票摄取与自校验</button>
      <button class="tab" id="tab-rag" type="button" role="tab" aria-selected="false" aria-controls="panel-rag" tabindex="-1">Chat · RAG 查询路径</button>
    </div>

    <section class="panel" id="panel-system" role="tabpanel" aria-labelledby="tab-system">
      <iframe title="AgenticAP 系统架构总览" src="agenticap-diagrams/agenticap-architecture.html" loading="eager" allow="fullscreen"></iframe>
    </section>
    <section class="panel" id="panel-ingestion" role="tabpanel" aria-labelledby="tab-ingestion" hidden>
      <iframe title="AgenticAP 发票摄取与自校验流程" src="agenticap-diagrams/agenticap-ingestion.html" loading="lazy" allow="fullscreen"></iframe>
    </section>
    <section class="panel" id="panel-rag" role="tabpanel" aria-labelledby="tab-rag" hidden>
      <iframe title="AgenticAP Chat RAG 查询路径" src="agenticap-diagrams/agenticap-rag.html" loading="lazy" allow="fullscreen"></iframe>
    </section>
    <p class="hint">提示：可以使用图表右上角的“动态 / 演示”控件，也可以选择图表顶部的引导章节来追踪各条处理路径。</p>
  </main>
  <script src="../js/docs-shell.js"></script>
  <script>
    (()=>{
      const tabs=[...document.querySelectorAll('[role="tab"]')];
      const panels=tabs.map(tab=>document.getElementById(tab.getAttribute('aria-controls')));
      function activate(index,moveFocus=false){
        tabs.forEach((tab,i)=>{
          const selected=i===index;
          tab.setAttribute('aria-selected',String(selected));
          tab.tabIndex=selected?0:-1;
          panels[i].hidden=!selected;
        });
        if(moveFocus) tabs[index].focus();
      }
      tabs.forEach((tab,index)=>{
        tab.addEventListener('click',()=>activate(index));
        tab.addEventListener('keydown',event=>{
          let next=index;
          if(event.key==='ArrowRight'||event.key==='ArrowDown') next=(index+1)%tabs.length;
          else if(event.key==='ArrowLeft'||event.key==='ArrowUp') next=(index+tabs.length-1)%tabs.length;
          else if(event.key==='Home') next=0;
          else if(event.key==='End') next=tabs.length-1;
          else return;
          event.preventDefault();
          activate(next,true);
        });
      });
    })();
  </script>
</body>
</html>
