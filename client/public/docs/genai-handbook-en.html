<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GenAI Engineering · North America</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
body{margin:0}
/* Layout concept: sticky top bar (menu, search, theme) + collapsible chapter sidebar + single reading column.
   Chapter colors cycle through six hues by chapter number. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eaeef4;
  --fg: #17202c;
  --muted: #566274;
  --line: #d9dfe8;
  --accent: #1d5c8f;
  --code-bg: #edf0f5;
  --code-fg: #17202c;
  --mark: #ffe08a;
  --c0: #566274;
  --c1: #0b7285;
  --c2: #a8660f;
  --c3: #6d3fb2;
  --c4: #2b7a4b;
  --c5: #b0344f;
  --c6: #3d5fb8;
  --bar-bg: #f4f6f9;
  --bar-h: 56px;
  --sans: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", "Noto Sans SC", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #171e27; --surface-2: #1f2833; --fg: #e3e8ef; --muted: #9aa6b8;
    --line: #2a3441; --accent: #7db7ee; --code-bg: #0c1117; --code-fg: #dbe3ee; --mark: #6b5a14;
    --c0: #9aa6b8; --c1: #4fc3d6; --c2: #e3ab4f; --c3: #b99af0; --c4: #5fd197; --c5: #f08aa3; --c6: #8fa8f0; --bar-bg: #10151c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #171e27; --surface-2: #1f2833; --fg: #e3e8ef; --muted: #9aa6b8;
  --line: #2a3441; --accent: #7db7ee; --code-bg: #0c1117; --code-fg: #dbe3ee; --mark: #6b5a14;
  --c0: #9aa6b8; --c1: #4fc3d6; --c2: #e3ab4f; --c3: #b99af0; --c4: #5fd197; --c5: #f08aa3; --c6: #8fa8f0; --bar-bg: #10151c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body {
  background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  overflow-wrap: break-word;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar-bg); }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* top bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--bar-h);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  background: var(--bar-bg); border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 1280px; margin: 0 auto; height: 100%; display: flex; align-items: center; gap: 12px; position: relative; }
.brand { font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.btn {
  font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer; line-height: 1.2; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.menu-btn { display: none; }
.search { flex: 1; min-width: 0; max-width: 520px; margin-left: auto; position: relative; }
.search input {
  width: 100%; font: inherit; font-size: 14px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 36px 7px 12px;
}
.search kbd {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 12px var(--mono); color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; pointer-events: none; background: var(--bg);
}
.results {
  position: absolute; top: calc(100% + 6px); right: 0; width: min(640px, calc(100vw - 32px)); max-height: min(70vh, 560px);
  overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 12px 32px rgba(10, 20, 35, .18); z-index: 40;
}
.results[hidden] { display: none; }
.res { display: block; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; }
.res:last-child { border-bottom: 0; }
.res:hover, .res.sel { background: var(--surface-2); }
.res-t { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.res-ch { font-size: 11.5px; font-weight: 500; color: var(--chc, var(--muted)); border: 1px solid currentColor; border-radius: 10px; padding: 0 7px; line-height: 1.6; }
.res-s { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-top: 3px; }
.res-empty, .res-count { padding: 12px 14px; font-size: 13px; color: var(--muted); }
.res-count { border-bottom: 1px solid var(--line); padding: 8px 14px; font-size: 12px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

/* shell */
.shell { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 276px minmax(0, 1fr); gap: 44px; padding-top: 24px; }
.side {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 20px);
  align-self: start; max-height: calc(100vh - var(--bar-h) - env(safe-area-inset-top, 0px) - 36px);
  overflow-y: auto; padding-right: 8px; font-size: 13.5px; line-height: 1.45; scrollbar-width: thin;
}
.nav-label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.grp { margin: 0 0 4px; }
.grp > summary, .grp-plain {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 6px;
  font-weight: 600; color: var(--fg); text-decoration: none;
}
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary::before, .grp-plain::before {
  content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--chc, var(--c0)); flex: none;
}
.grp > summary:hover, .grp-plain:hover { background: var(--surface-2); }
.grp > summary a { color: inherit; text-decoration: none; flex: 1; min-width: 0; }
.grp ul { list-style: none; margin: 2px 0 8px 14px; padding: 0 0 0 10px; border-left: 1px solid var(--line); }
.grp li a { display: block; padding: 3px 8px; color: var(--muted); text-decoration: none; border-radius: 4px; }
.grp li a:hover { color: var(--fg); background: var(--surface-2); }
.grp li a.on { color: var(--fg); background: var(--surface-2); font-weight: 500; box-shadow: inset 2px 0 0 var(--chc, var(--accent)); }

/* hero */
.hero { padding: 8px 0 28px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.hero h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.25; margin: 0 0 12px; letter-spacing: -.01em; text-wrap: balance; }
.hero blockquote { margin: 0 0 18px; padding: 0; border: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.hero blockquote p { margin: 0 0 4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.card { display: block; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--chc); text-decoration: none; color: var(--fg); border-radius: 4px; }
.card:hover { border-color: var(--chc); }
.card b { display: block; font-size: 14.5px; color: var(--chc); }
.card span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 3px; }

/* content */
.content { min-width: 0; }
.content h1, .content h2, .content h3, .content h4 { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 14px); line-height: 1.35; text-wrap: balance; }
.content h1 { font-size: 28px; margin: 56px 0 16px; padding-top: 18px; border-top: 4px solid var(--chc, var(--c0)); }
.content h2 { font-size: 21px; margin: 44px 0 12px; padding-top: 16px; border-top: 1px solid var(--line); }
.content h3 { font-size: 16.5px; margin: 28px 0 8px; color: var(--fg); }
.content h4 { font-size: 14.5px; margin: 20px 0 6px; color: var(--muted); }
.content p { margin: 0 0 12px; max-width: 78ch; }
.content ul, .content ol { margin: 0 0 14px; padding-left: 1.4em; max-width: 78ch; }
.content li { margin: 3px 0; }
.content hr { border: 0; border-top: 1px solid var(--line); margin: 36px 0 0; }
.content blockquote { margin: 0 0 16px; padding: 8px 14px; background: var(--surface); border-left: 3px solid var(--chc, var(--c0)); color: var(--muted); max-width: 78ch; }
.content blockquote p { margin: 0 0 4px; }
.content code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.codewrap { position: relative; margin: 0 0 16px; }
.content pre { margin: 0; padding: 14px 16px; background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; tab-size: 2; }
.content pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; white-space: pre; }
.copy { position: absolute; top: 6px; right: 6px; font: 11.5px var(--sans); padding: 2px 8px; opacity: 0; transition: opacity .15s; }
.codewrap:hover .copy, .copy:focus-visible { opacity: 1; }
@media (hover: none) { .copy { opacity: 1; } }
.tablewrap { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.content table { border-collapse: collapse; width: 100%; font-size: 13.5px; line-height: 1.55; }
.content th, .content td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); min-width: 90px; }
.content th { background: var(--surface-2); font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
.content tr:last-child td { border-bottom: 0; }
.content td code { font-size: .85em; }
.content input[type="checkbox"] { margin-right: 6px; }
.content li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.2em; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--mark); } to { background: transparent; } }
.foot { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
.scrim { display: none; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .menu-btn { display: inline-block; }
  .side {
    position: fixed; z-index: 25; left: 0; bottom: 0; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h));
    width: min(86vw, 340px); max-height: none; background: var(--bg); border-right: 1px solid var(--line);
    padding: 16px 12px 24px max(16px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .2s ease; visibility: hidden;
  }
  .side.open { transform: none; visibility: visible; }
  .scrim.open { display: block; position: fixed; inset: 0; z-index: 22; background: rgba(8, 14, 22, .45); }
}
@media (max-width: 640px) {
  .brand { display: none; }
  .search { max-width: none; margin-left: 0; }
  .search kbd { display: none; }
  .content h1 { font-size: 24px; }
  .content h2 { font-size: 19px; }
}
@media print { .bar,.side,.cards,.copy,.scrim {display:none!important} .shell {display:block} body {background:white;color:black;padding:0} .content {max-width:none} .tablewrap,pre {break-inside:avoid} }
</style>

</head>
<body>

<div class="bar"><div class="bar-in">
  <button class="btn menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">Contents</button>
  <span class="brand">GenAI Engineering · North America</span>
  <div class="search">
    <input id="q" type="search" placeholder="Search: Claude, Codex, voice, RAG, Remotion…" autocomplete="off" aria-label="Search handbook">
    <kbd id="kbd">/</kbd>
    <div class="results" id="results" hidden role="listbox"></div>
  </div>
  <button class="btn" id="themeBtn" aria-label="Toggle light and dark theme">Theme</button>
</div></div>

<div class="shell">
  <nav class="side" id="side" aria-label="Chapter navigation"><p class="nav-label">Chapters</p><div id="nav"></div></nav>
  <main class="content" id="content"><noscript>This handbook needs JavaScript enabled to render its embedded content.</noscript>
    <header class="hero" id="hero">
      <p><a href="genai-handbook.html">Chinese edition</a> · English edition · Updated November 20, 2026</p><div class="cards" id="cards"></div>
    </header>
  </main>
</div>

(function () {
  var MD = "# GenAI Multimedia Engineering Handbook\n\n> **North American technology stack · English edition · Verified November 20, 2026.** Build applications that combine text, speech, audio, images, video, animation, and agent tools. Adapted from the Chinese handbook, retaining its 14-chapter progression while replacing region-specific defaults with OpenAI, Anthropic, xAI, Google, and the wider North American developer ecosystem.\n>\n> **How to read this edition:** model releases below are a dated snapshot from linked official sources. Architecture choices, suggested workflows, budgets, and evaluation targets are engineering recommendations, not vendor benchmarks. Product access, API access, region support, and preview status can differ. Verify the linked catalog before deployment; no model is declared universally best.\n\n# 0. Overview and learning path\n\n## 0.1 What you are building\n\nA multimedia application is a coordinated system of specialized components. An LLM researches and plans; a speech model transcribes or narrates; image and video models produce assets; a renderer assembles exact typography, charts, subtitles, and branding. A durable workflow tracks the work, costs, and approvals.\n\nExamples include a technical explainer, interview-practice voice assistant, narrated knowledge base, illustrated story, or product marketing studio. The most useful architectural boundary is between **creative generation** and **deterministic composition**: generate atmosphere and footage, then calculate facts, timing, captions, and layout with code.\n\n## 0.2 Capability map\n\n| Layer | Suggested starting point | Alternative or expansion |\n|---|---|---|\n| Reasoning and planning | OpenAI GPT-6.2 Sol/Astra; Claude Opus 5.5 | Claude Fable 5.2 for harder tasks; Grok 4.7; Gemini 4 Carbon |\n| Coding assistance | Codex or Claude Code | Evaluate IDE agents against your actual repository |\n| Grounded research | Retrieval plus explicit web/search tools | Grok with X Search for relevant public social context |\n| Speech recognition | OpenAI speech APIs or ElevenLabs Scribe | Whisper-family local inference |\n| Narration | ElevenLabs or OpenAI speech | Local models when licensing and quality fit |\n| Images and editing | GPT Image; FLUX | Google image offerings; specialist vector tools |\n| Video | Runway Gen-4.5; Google video offerings | xAI video; FLUX video; benchmark per shot |\n| Exact animation | Remotion, Manim, Blender | Motion Canvas, three.js, Rive |\n| Orchestration | Typed application code and a job queue | Temporal for durable jobs; LangGraph for agent state |\n| Application | Next.js/React + TypeScript; FastAPI/Python | PostgreSQL, object storage, container workers |\n\nThe current model names are sourced in Chapter 2 and Appendix B. Tool suggestions elsewhere are design options, not a claim that every platform supports every listed integration.\n\n## 0.3 Seven engineering principles\n\n1. Define a structured project and scene contract before generating assets.\n2. Keep factual claims attached to evidence throughout the pipeline.\n3. Make costly steps asynchronous, resumable, and individually retryable.\n4. Treat timing, accessibility, and media quality as testable outputs.\n5. Start with one provider per modality; add fallbacks only when evaluation justifies them.\n6. Track the cost of accepted output, including rejected generations and review.\n7. Version prompts, inputs, dependencies, models, and user decisions.\n\n## 0.4 Cloud versus local\n\nUse hosted APIs when frontier quality, low operations overhead, or rapid iteration matters. Use local inference for offline workflows, controlled data handling, or predictable high-volume work where your hardware is adequate. A local model still needs secure storage and dependency management.\n\nFor an Apple Silicon laptop, start with local transcription and rendering previews, while using cloud services for demanding image/video generation. Run representative workloads before assuming a model fits unified memory. ComfyUI, llama.cpp, Ollama, and MLX-based projects are candidates to evaluate; support varies by model and runtime.\n\n## 0.5 Four learning stages\n\n**Stage 1:** script → narration → captions → static-image video. **Stage 2:** introduce retrieval, image editing, and reusable templates. **Stage 3:** add generated clips, asynchronous workers, cost tracking, and automated quality checks. **Stage 4:** add realtime voice or agent-selected tools only when the product needs them.\n\n# 1. Reference architecture and data model\n\n## 1.1 System boundaries\n\n| Component | Responsibility | Durable record |\n|---|---|---|\n| Web application | Briefs, uploads, previews, review | Project and user preferences |\n| API/control plane | Authentication, validation, job creation | Job, policy, budget |\n| Planner | Source-grounded script and scene plan | Versioned scene manifest |\n| Provider adapters | Translate normalized requests to vendor APIs | Request, response, provider task ID |\n| Workers | Transcribe, generate, render, inspect | Step status and artifacts |\n| Storage | Media files, thumbnails, source documents | Object key, checksum, retention |\n| Event stream | Progress and completion notifications | Persisted event sequence |\n\nKeep API keys on the server. Give the browser scoped upload/download URLs. Stream progress over SSE or WebSocket, while storing authoritative job state in the database.\n\n## 1.2 Scene JSON as an intermediate representation\n\nA scene manifest separates editorial decisions from a particular model API. Use integer frames or milliseconds for timing, explicit units, and references to versioned assets.\n\n```json\n{\n  \"schema_version\": \"1.0\",\n  \"project_id\": \"explainer-001\",\n  \"locale\": \"en-CA\",\n  \"fps\": 30,\n  \"canvas\": {\"width\": 1920, \"height\": 1080},\n  \"budget\": {\"currency\": \"USD\", \"max_generation_cost\": 20},\n  \"scenes\": [{\n    \"id\": \"scene-01\",\n    \"duration_frames\": 180,\n    \"narration\": \"A retrieval system finds evidence before drafting an answer.\",\n    \"source_ids\": [\"doc-01#page-3\"],\n    \"visual\": {\"kind\": \"remotion\", \"template\": \"retrieval-flow\"},\n    \"assets\": [],\n    \"status\": \"planned\"\n  }]\n}\n```\n\nThe budget above is illustrative. Add tenant ownership, source licenses, voice consent references, pronunciation hints, caption tracks, and render settings as your product requires. Validate model-produced JSON against Pydantic or Zod before dispatching any tool.\n\n## 1.3 Job state and reliability\n\nUse a state machine: queued, running, waiting_for_review, succeeded, failed, cancelled. Persist each completed step. A cancellation request should stop pending work and attempt provider cancellation where available; it cannot undo already billed work.\n\nDerive cache keys from normalized input, provider/model, prompt version, reference-asset hashes, and output settings. Use database uniqueness to prevent duplicate dispatch. External calls can still succeed before your worker crashes: reconcile provider task IDs before retrying. Do not promise exactly-once billing across third-party APIs.\n\n## 1.4 Asset provenance and consistency\n\nStore original uploads, approved reference images, generated media, and final exports separately. Record a checksum, MIME type, dimensions, duration, model ID, prompt revision, license reference, and approval status. Download temporary provider outputs before URLs expire.\n\nCreate a character/style bible: approved reference sheets, palette, wardrobe, camera conventions, and prohibited changes. Reuse references across shots. A repeated seed alone does not guarantee identity or reproducibility across model revisions.\n\n## 1.5 Two implementation stacks\n\n**Lean prototype:** Next.js + TypeScript, FastAPI for Python media tasks, PostgreSQL, S3-compatible storage, one queue, FFmpeg, Remotion, and hosted model APIs. **Production expansion:** dedicated container workers, Temporal when long-running workflow requirements justify it, GPU workers only for selected local models, OpenTelemetry traces, and a model/provider registry.\n\nAvoid running long video rendering jobs inside short-lived request handlers. The API should return a job identifier promptly.\n\n# 2. Text, reasoning, coding, and grounding\n\n## 2.1 Current frontier snapshot\n\n| Provider | Verified release/catalog snapshot | How to evaluate it |\n|---|---|---|\n| OpenAI | GPT-6.2 Astra and Sol released November 17; Responses and Chat Completions support, with tool calling on Responses [1] | Compare Sol for routine work and Astra for difficult reasoning/coding |\n| Anthropic | Opus, Sonnet, and Haiku 5.5 are daily-work options; Fable 5.2 announced November 9; Mythos has verified-access requirements [2] | Begin with a daily-work model; reserve more expensive reasoning for measured gains |\n| xAI | Grok 4.7 appears in the current API catalog; live information requires enabled search tools [3] | Test research and tool workflows, including source quality |\n| Google | Gemini 4 Carbon is listed in the current catalog with multimodal inputs [4] | Test long documents, media understanding, and retrieval tasks |\n\nThese are catalog facts, not independently reproduced performance rankings. Confirm account access and exact model identifiers before wiring an application. Restricted research models are not default public production choices.\n\n## 2.2 ChatGPT, Codex, Claude Code, and Grok Bot\n\n**ChatGPT** is an end-user application; **OpenAI API models** are programmable services; **Codex** is a coding-agent product. Similarly, **Claude**, **Claude Code**, and the **Claude API** occupy different product surfaces. Grok Bot and Grok's consumer interface should not be treated as interchangeable with an API endpoint.\n\nUse Codex or Claude Code to implement, inspect, and test the repository. Use server-side model APIs inside your product. Check plan entitlements, API credentials, billing, and organization policy for each surface instead of assuming a subscription transfers all capabilities to your application.\n\nA practical coding-agent loop is: explain the task and acceptance criteria, inspect existing conventions, implement a bounded change, run relevant checks, review the diff, and require an explicit deployment decision when your team process calls for it. Store project guidance in repository instructions and keep secrets outside agent-readable project context.\n\n## 2.3 Script and storyboard workflow\n\nResearch → claim/evidence table → outline → narration → scene plan → review → generation. Ask the planner to produce separate fields for narration, on-screen copy, source IDs, visual intent, and unresolved questions. This prevents generated visual prompts from becoming factual evidence.\n\n```text\nRole: multimedia technical editor.\nAudience: North American software engineers.\nTask: produce a six-scene explainer from the supplied evidence.\nConstraints: preserve exact product names; label uncertainty;\nuse en-CA spelling; distinguish observed facts from suggestions.\nOutput: JSON conforming to the supplied schema.\nFor each scene: narration, visual intent, source_ids,\non_screen_text, estimated duration, verification_needed.\nIf evidence is missing, return an unresolved question.\n```\n\nTreat structured-output support as a formatting aid. Validate schema, references, content, and cross-field constraints in application code. Retry a malformed scene rather than regenerate an entire approved project.\n\n## 2.4 Context engineering and RAG\n\nIngest documents with stable IDs, revision dates, page references, and tenant permissions. Parse headings and tables, chunk around meaningful boundaries, and combine lexical search with embeddings when useful. Rerank a small candidate set, then send only relevant evidence to the model.\n\nFor a first implementation, PostgreSQL with pgvector plus full-text search is a reasonable option. Evaluate a dedicated search engine when scale, filtering, or retrieval quality demands it. Use retrieval-time access controls; filtering an answer after generation is too late to protect restricted documents.\n\nLong context is helpful for coherent documents but does not replace retrieval, permissions, or source freshness. Distinguish explicit user preferences, conversation state, retrieved facts, and speculative model summaries in memory. Give users a way to correct or delete stored preferences.\n\n## 2.5 Model routing, prompting, and evaluation\n\nRoute by task: low-cost extraction, harder planning, vision inspection, and search-grounded research. Use a small labeled evaluation set to compare factuality, schema validity, tool correctness, latency, and cost. Keep the baseline when an upgrade is more novel but less reliable.\n\nDo not send identical parameters to every vendor. Reasoning controls, caching, tool schemas, streaming events, and output limits differ. A provider adapter should declare capabilities and reject unsupported combinations rather than silently discard fields. Fine-tuning becomes useful only after an error analysis shows that retrieval, prompts, and workflow changes cannot address a repeated behavior problem.\n\n# 3. Speech recognition: ASR / STT\n\n## 3.1 A complete recognition pipeline\n\nPreserve the original recording → inspect channels and sample rate → create an ASR derivative → detect speech where helpful → transcribe → diarize/align → review → export transcript and captions. Use the provider's expected format; 16 kHz mono PCM is a useful derivative for some systems, not a universal requirement.\n\n| Approach | Good fit | Main tradeoff |\n|---|---|---|\n| OpenAI speech APIs | A consolidated hosted stack | Confirm transcription-specific features and limits |\n| ElevenLabs Scribe v3 / v3 Live [5] | Recorded or streaming transcription | Evaluate names, accents, timestamps, and diarization |\n| Whisper-family local tools | Offline files and controlled processing | Local setup, memory, throughput, and alignment work |\n| Specialist streaming services | Telephony or low-latency assistants | Compare endpointing and real-world noisy audio |\n\n## 3.2 Normalization and segmentation\n\n```bash\nffprobe -v error -show_format -show_streams -of json input.mp4\nffmpeg -i input.mp4 -vn -ac 1 -ar 16000 -c:a pcm_s16le asr.wav\n```\n\nAvoid aggressive denoising that erases consonants. For stereo interviews recorded on separate channels, preserve the channel mapping instead of mixing speakers together. VAD saves silence-processing time but can clip short words; keep padding around speech boundaries.\n\n## 3.3 Diarization, alignment, and cleanup\n\nDiarization estimates who spoke when; recognition estimates what was said; forced alignment places known words on the audio timeline. These are distinct tasks. Store speaker IDs separately from human-readable names and require review before identifying a person.\n\nLLM cleanup should preserve the raw transcript and annotate corrections. Never silently invent a technical term or remove a negation. Generate captions from reliable timestamps, then check overlaps, reading speed, and line breaks. Use vocabulary hints where the selected service supports them.\n\n## 3.4 Realtime and evaluation\n\nFor live recognition, handle partial transcripts, final segments, reconnections, and duplicate events. Measure word error rate, named-entity accuracy, timestamp error, speaker attribution, and end-of-turn latency. Use recordings with Canadian and US accents, noisy rooms, code-switching, and product vocabulary relevant to the application.\n\n# 4. Speech synthesis and realtime voice\n\n## 4.1 Model selection\n\nElevenLabs currently lists Eleven v4 and v4 Turbo for synthesis, alongside earlier model families [5]. OpenAI and xAI offer speech/voice interfaces [3, 6]. Treat their exact voice controls, output formats, streaming behavior, and deployment regions as provider-specific.\n\nChoose narration by pronunciation and long-form consistency; choose conversational synthesis by time to first audio, interruption handling, and sustained streaming stability. A highly expressive narration voice may be less suitable for a fast support assistant.\n\n## 4.2 Text preparation and generation\n\nNormalize dates, abbreviations, currency, and technical symbols. Write “one hundred twenty Canadian dollars” when the spoken interpretation must be unambiguous. Maintain a pronunciation dictionary for names and acronyms. Keep normalized speech text separate from display text.\n\nGenerate paragraph-sized narration chunks with stable voice settings, listen to joins, and regenerate only failed chunks. Determine actual duration from the output audio before locking scene lengths. Avoid assuming a word count predicts exact speech timing.\n\n## 4.3 Two voice architectures\n\n**Cascaded:** STT → text model/tools → TTS. This offers inspectable intermediate text and independent provider choices. **Native speech-to-speech:** a realtime model handles audio directly; this can simplify conversational timing but changes how transcripts, moderation, and tool execution are coordinated.\n\nUse WebRTC or a media transport suited to your client. LiveKit is one implementation candidate for a realtime media layer. Keep credentials short-lived, tool execution server-side, and audio playback cancellable.\n\n## 4.4 Barge-in and testing\n\nOn an interruption, stop playback, cancel or truncate the pending response as supported, and reconcile what the user actually heard with the conversation state. Otherwise the model may assume it delivered an instruction that was never played.\n\nMeasure the interval from the end of user speech to audible response, not just model token latency. Track task completion, interruptions, pronunciation errors, tool failures, and user corrections. Obtain explicit consent for cloned voices and retain the permission record with voice assets.\n\n# 5. Audio restoration, music, sound effects, and mixing\n\n## 5.1 Separate the tasks\n\nNoise reduction, dereverberation, source separation, speech synthesis, music generation, and mastering solve different problems. Preserve originals and compare processed output at matched loudness. Better-sounding audio can still be worse for transcription.\n\nUse FFmpeg for repeatable conversions and filters; consider dedicated restoration tools for difficult recordings. Demucs-family separation can be evaluated for stems, but extraction artifacts are common and separation does not grant rights to reuse a recording.\n\n## 5.2 Music and sound design\n\nUse licensed music libraries when predictable reuse rights matter. If evaluating generated music or sound effects, check the service's current commercial terms, API availability, content restrictions, and the rights attached to your inputs. A consumer creation tool is not automatically an automation API.\n\nDescribe a sound effect by event, material, distance, duration, and acoustic space. Keep generated music and effects as separate stems so narration can remain intelligible and edits stay reversible.\n\n## 5.3 Mix and loudness\n\nSet voice level first, then introduce background music at a lower level. Duck music while narration is present; avoid pumping at every syllable. Use a limiter to prevent overs and inspect the final encoded file for true-peak issues.\n\n```bash\n# Illustrative single-pass target; use measured two-pass normalization for delivery.\nffmpeg -i narration.wav -af loudnorm=I=-16:TP=-1.5:LRA=11 narration-preview.wav\n```\n\nA target such as −16 LUFS is an editorial starting point, not a universal platform standard. Choose loudness and peak requirements for the actual destination. Confirm intelligibility on a phone speaker, headphones, and at low playback volume.\n\n# 6. Image generation and editing\n\n## 6.1 Current choices\n\n| Family | Verified snapshot | Practical role |\n|---|---|---|\n| OpenAI GPT Image | GPT-Image-2.6 Sunburst and Flare appear in current documentation [7] | Evaluate detailed assets versus faster iterations |\n| Black Forest Labs FLUX | Current catalog lists FLUX 3 image/video and an open-weight Image Klein variant [8] | Evaluate editing, reference workflows, and local options |\n| Google image models | Consult the live Gemini model catalog [4] | Evaluate reference editing and integration with your Google stack |\n| Specialist design services | Compare official vector/typography offerings | Use actual SVG/text validation for brand assets |\n\nBlack Forest Labs is included as a global ecosystem component useful to North American teams; the scope concerns deployment choices, not a requirement that every supplier be headquartered in North America.\n\n## 6.2 Production workflow\n\nWrite an asset brief → generate low-cost candidates → approve composition → refine with reference images → inspect details → export required sizes. Record which image is the approved source for downstream video. Regenerating it later can break character consistency.\n\nSpecify subject, action, setting, camera, composition, light, palette, aspect ratio, and required empty space. Keep logos, exact UI copy, QR codes, and dense technical labels in deterministic overlays when accuracy matters. Image models can create convincing but incorrect interfaces and diagrams.\n\n## 6.3 Controls, references, and LoRA\n\nReference images provide identity/style cues; masks constrain an edit region; structural controls guide pose or layout where supported. Classic diffusion controls such as CFG, denoising strength, ControlNet, or IP-Adapter do not transfer directly to every proprietary API.\n\nLoRA is an adaptation technique for compatible models. It requires a suitable base model, curated data, training capacity, and a license review for both weights and data. Try references and templates first; training is worthwhile when it fixes a measured recurring failure.\n\n## 6.4 Quality gate\n\nInspect identity, hand/object interactions, typography, brand fidelity, composition, alpha channels, and unintended personal information. Use a vision model to prioritize review, then have a human approve customer-facing hero assets. Validate required transparency from the actual file, not from a checkerboard drawn into the image.\n\n# 7. Video generation\n\n## 7.1 Current choices and access boundaries\n\nRunway's current developer documentation lists Gen-4.5 and Aleph 2.0 [9]. Google's current consumer/help pages describe Gemini Omni video offerings alongside Veo variants [10]. xAI lists video generation services [3], and FLUX's current catalog includes video models [8].\n\nThese product catalogs do not prove equivalent API features. Confirm whether a specific model is available through an API, a consumer app, an aggregator, or a preview. In particular, do not infer API access from a consumer video feature announcement.\n\n## 7.2 Start with approved images\n\nFor controlled storytelling, approve a still frame, animate it into a short shot, inspect motion, then assemble clips. Text-to-video can be useful for exploratory footage. Reference-to-video, keyframes, extensions, editing, and native audio depend on the selected model.\n\nWrite prompts around subject motion, camera motion, environment changes, and what must remain fixed. Avoid combining too many actions in one short clip. Plan edit points early so a usable fragment can survive even when the whole generation fails.\n\n## 7.3 Duration and native audio\n\nDo not assume the generated clip matches your narration length or that native speech is suitable for precise product explanations. Where editorial control matters, replace or mix the soundtrack in postproduction. Avoid severe retiming of visible dialogue, which can break lip synchronization.\n\nGenerated video is unsuitable as evidence that an event occurred. Label synthetic scenes appropriately and keep source footage distinct from generated footage in the asset manifest.\n\n## 7.4 Cost and quality\n\nBudget by accepted shot: number of attempts × generation cost, plus inspection, storage, and editing. Generate previews before high-resolution finals. Stop retrying when a deterministic animation or licensed clip communicates the same idea more effectively.\n\nReview temporal consistency, identity drift, camera stability, physical plausibility, brand/logo changes, and abrupt endings. Sampled frames can miss short defects; review the moving clip as well.\n\n# 8. Animation, simulation, and avatars\n\n## 8.1 Choose the right renderer\n\n| Requirement | Tool candidate | Why |\n|---|---|---|\n| Parameterized marketing or explainer video | Remotion | React components driven by JSON and frames |\n| Mathematics and algorithms | Manim | Programmatic geometry and exact relationships |\n| 3D scenes and physical simulation | Blender | Explicit scene, camera, lighting, and simulation |\n| Interactive product animation | Rive, Lottie, Canvas, three.js | Runtime interaction rather than offline generation |\n| Code-driven motion graphics | Motion Canvas | Editable procedural sequences |\n| Speaking avatar | Evaluate dedicated avatar APIs | Consent, lip sync, quality, and API terms matter |\n\nUse calculated data for scientific plots and simulations. An LLM can help write the renderer, but validate the equations, units, and results independently.\n\n## 8.2 Remotion as a scene compiler\n\nPass validated scene JSON into a component library. Use a fixed frame rate, bundled fonts, local versioned assets, and explicit durations. Separate templates from project content so a single template supports multiple topics and languages.\n\n```tsx\nimport {AbsoluteFill, interpolate, useCurrentFrame} from 'remotion';\nexport const TitleScene = ({title}: {title: string}) => {\n  const frame = useCurrentFrame();\n  const opacity = interpolate(frame, [0, 15], [0, 1], {\n    extrapolateLeft: 'clamp', extrapolateRight: 'clamp'\n  });\n  return <AbsoluteFill style={{background: '#10151c',\n    color: 'white', justifyContent: 'center', padding: 96}}>\n    <h1 style={{fontSize: 72, opacity}}>{title}<\/h1>\n  <\/AbsoluteFill>;\n};\n```\n\nThis component belongs inside a configured Remotion project with an entry point and Composition. It is illustrative, not a complete runnable project. Review Remotion's current company and automation licensing before commercial rollout [11].\n\n## 8.3 Audio-driven timing and avatars\n\nAlign highlighted words and mouth cues to actual audio timestamps. Use phonemes or visemes where the avatar system provides them. Word timestamps alone do not describe mouth shapes accurately.\n\nFor identity-based avatars, verify the speaker's permission, document allowed use, and support revocation. For technical explainers, a schematic presenter or simple animated mascot can be easier to maintain than a photorealistic avatar.\n\n# 9. Composition, subtitles, and export\n\n## 9.1 Audio determines the timeline\n\nGenerate approved narration before finalizing scene duration. At 30 fps, a six-second scene contains 180 frames. Derive subtitle and visual events from a shared timeline; avoid separately accumulating floating-point durations in multiple tools.\n\nAccount for transitions: a half-second overlap changes total running time. Pad a short scene with a hold, animation, or additional useful visual rather than truncating narration. Keep captions readable inside safe areas for each aspect ratio.\n\n## 9.2 Reproducible media recipes\n\n```bash\n# Inspect the actual artifact.\nffprobe -v error -show_format -show_streams -of json final.mp4\n\n# Produce a broadly compatible web delivery file.\nffmpeg -i master.mov -c:v libx264 -crf 20 -pix_fmt yuv420p \\\n  -c:a aac -movflags +faststart web.mp4\n\n# Fit into a 1080p canvas without stretching.\nffmpeg -i input.mp4 -vf \\\n  \"scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1\" \\\n  -c:v libx264 -pix_fmt yuv420p -c:a aac fitted.mp4\n\n# Burn captions; requires an FFmpeg build with the subtitles filter.\nffmpeg -i web.mp4 -vf \"subtitles=captions.srt\" -c:a copy captioned.mp4\n```\n\nPaths and escaping vary by shell. Re-encode consistently before concatenating clips; stream-copy concatenation is appropriate only when formats and timestamps are compatible. See the FFmpeg filter documentation [14].\n\n## 9.3 Captions and QA\n\nProvide SRT or WebVTT separately where the player supports selectable captions. Keep a burned-in version for social distribution when needed. Check sentence boundaries, punctuation, contrast, timing, and overlap with important visuals. Translated captions need their own timing and line-length review.\n\nAutomatically check codec, resolution, audio presence, duration, missing assets, black/silent intervals, and caption bounds. Render representative frames and listen to transitions. Maintain a high-quality master plus destination-specific derivatives.\n\n# 10. Workflows, agents, Skills, and MCP\n\n## 10.1 Assign responsibility deliberately\n\n| Mechanism | Purpose | Boundary |\n|---|---|---|\n| Workflow | Known steps, retries, scheduling | Owns durable progress |\n| Agent | Chooses next action under uncertainty | Owns bounded decisions |\n| Skill | Reusable instructions, templates, scripts | Teaches a repeatable practice |\n| Function/tool call | Invokes a typed operation | Validated and authorized by the application |\n| MCP | Connects AI clients to tools/resources | Interoperability, not an authorization replacement |\n\nMCP defines a client/server architecture for context and tools [12]. It does not make a tool trustworthy or guarantee interoperability for every optional feature. Audit server permissions, origin, credentials, and returned content.\n\n## 10.2 Durable execution\n\nStart with explicit functions and a queue for simple pipelines. Evaluate Temporal for workflows that must survive long waits and process restarts. LangGraph provides persistence concepts for agent state, including checkpointers and stores [13]. A graph checkpoint and a durable external job ledger solve related but different problems.\n\nKeep side effects idempotent, bound retries, and reconcile provider tasks on recovery. Do not retry an expensive generation just because a progress event was lost.\n\n## 10.3 Tool contracts and budgets\n\nExpose narrow operations such as create_storyboard, synthesize_narration, inspect_asset, and render_project. Accept typed inputs, return task IDs or artifact references, and enforce tenant access. Do not expose an unrestricted shell to an untrusted planner.\n\n```text\nwhile job is active:\n  load checkpoint and remaining budget\n  choose an allowed next operation\n  validate arguments and permissions\n  reserve estimated cost before dispatch\n  execute or attach to an existing provider task\n  store result and reconcile actual cost\n  stop at the iteration limit, review gate, or terminal state\n```\n\nThis is pseudocode. A real implementation needs atomic budget reservations so concurrent workers cannot all spend the same remaining allowance. Treat instructions embedded in retrieved documents and tool outputs as untrusted data.\n\n## 10.4 Reusable multimedia Skills\n\nUseful packages include source research, storyboard drafting, brand compliance, pronunciation normalization, caption QA, Remotion scene generation, and export inspection. Each should specify inputs, outputs, dependencies, verification, and failure behavior. Version these packages with the code and review scripts before execution.\n\n# 11. End-to-end application blueprints\n\n## 11.1 Technical explainer\n\nInput a topic and approved sources. Retrieve evidence, draft a script, review claims, generate narration, render diagrams with Manim or Remotion, add limited generated footage, align captions, and export. Accept only if every factual scene has traceable evidence and every technical diagram matches the intended relationships.\n\nA good first project is a 60–90 second explanation of a RAG pipeline. It exercises the whole stack while keeping the footage and review budget manageable.\n\n## 11.2 AI podcast and interview practice\n\nBuild an outline from source material or an approved question bank. For a recorded program, synthesize separate speaker tracks, introduce deliberate pauses, mix, and produce a transcript. For live interview practice, use a realtime voice pipeline and store feedback separately from the conversation.\n\nEvaluate technical accuracy, question relevance, speaking-turn balance, pronunciation, and corrections. Keep synthetic presenters distinct from a person's real endorsement or participation.\n\n## 11.3 Illustrated story or short comic\n\nApprove a character bible, create a scene outline, generate consistent reference images, lay out panels with exact text, add narration, and optionally animate selected panels. Reuse approved assets. Review visual continuity and age-appropriate content at each scene boundary.\n\n## 11.4 Product marketing studio\n\nInput verified product facts, a brand kit, approved screenshots, and a call to action. Produce platform-specific scripts and shots, generate background assets, capture actual UI behavior, compose exact overlays, and export landscape/vertical variants. Verify URLs, QR codes, product claims, and readable mobile layouts before approval.\n\n## 11.5 Recording-to-knowledge-base\n\nTranscribe with speaker labels, retain timestamps, segment by topic, link summaries to transcript passages, and index with source permissions. Answers should cite the recording and timestamp. Distinguish decisions, proposals, and unresolved questions; a polished summary must not upgrade a suggestion into a decision.\n\n## 11.6 Realtime voice assistant\n\nUse microphone transport, turn detection, speech understanding, server-side tools, speech output, and interruption handling. Begin with read-only knowledge retrieval. Add transactions only with explicit confirmation where appropriate, duplicate-action protection, and a clear user-visible result. Test packet loss, background speech, tool timeouts, and transfers to a human.\n\n# 12. Deployment, economics, and observability\n\n## 12.1 Deployment options\n\nVercel can host a Next.js application; deploy media and GPU workloads on suitable dedicated compute. AWS, Google Cloud, and Microsoft cloud platforms are procurement options when their specific model offerings and regional commitments fit. Choose direct versus cloud-hosted provider access based on availability, contract, networking, and operations needs.\n\nUse containerized workers with pinned dependencies, bounded concurrency, scratch-disk limits, and cleanup. CPU rendering, GPU generation, and network-bound provider calls need different scaling policies. Do not buy a GPU fleet before profiling utilization.\n\n## 12.2 Cost model\n\n**Accepted-output cost = model calls + failed/rejected attempts + rendering compute + storage + egress + human review.** Track billing currency explicitly; convert to CAD for reporting with a dated exchange-rate source when needed. Keep prices in configuration and attach a price-table revision to estimates.\n\nSeparate an estimate from a hard spend limit. Provider usage reconciliation may lag completion. Reserve cost before dispatch, cap per-scene attempts, and expose cancellation and remaining budget in the product.\n\n## 12.3 Observability\n\nAttach a trace ID to project, workflow, provider call, asset, and render. Record latency, retries, provider errors, token/audio/video usage, cache hits, and QA outcomes. Track p50/p95 end-to-end latency and cost per accepted minute.\n\nUse structured logs and OpenTelemetry-compatible tracing where suitable. Redact credentials, transcripts, and personal information before exporting telemetry. Storing complete prompts in an observability platform may duplicate sensitive documents into another system.\n\n## 12.4 Release and recovery\n\nPin SDKs and renderer versions; record exact model IDs when available. Store prompts and evaluation fixtures in version control. Run a representative evaluation suite before model changes, then canary the upgrade and keep a rollback configuration. Stochastic generation and vendor infrastructure can still prevent bit-identical reproduction.\n\nBack up metadata and important assets. Test restoring a project and resuming a failed workflow. A backup that has never been restored is an unverified recovery plan.\n\n# 13. Evaluation, trust, and release readiness\n\n## 13.1 Evaluation matrix\n\n| Area | Measure | Review focus |\n|---|---|---|\n| Text | Factual support, schema validity | Unsupported claims and citation mismatch |\n| Retrieval | Recall and answer support | Relevant evidence missed or unauthorized |\n| STT | WER, entities, timestamps | Names, negations, technical terms |\n| TTS | Pronunciation, joins, listener ratings | Meaning changed by speech rendering |\n| Images | Brief adherence and visual defects | Identity, layout, text, branding |\n| Video | Continuity and accepted-shot rate | Temporal defects and misleading realism |\n| Agents | Task completion, tool correctness, cost | Repeated actions and scope violations |\n| Final media | Timing, loudness, captions, playback | Accessibility and destination compatibility |\n\nUse a stable test set with ordinary, difficult, and adversarial examples. Human reviewers should calibrate any model-based evaluator. Keep evaluation sources separate from generated answers to avoid circular grading.\n\n## 13.2 Rights, privacy, and transparency\n\nRecord rights and consent for source documents, music, faces, voices, fonts, templates, and model weights. Open weights do not automatically imply unrestricted commercial use. Keep the exact license revision attached to important dependencies and assets.\n\nFor Canadian and US customers, map where uploads, inference, logs, backups, and subprocessors handle data. A North American supplier name does not establish Canadian data residency. Obtain current contractual and region-specific commitments for the actual deployment; this handbook does not make a legal compliance determination.\n\nDisclose synthetic media where the context or platform requires it. Preserve provenance metadata and content credentials where supported, without treating them as proof that every claim is true. Make retention, deletion, access controls, and export capabilities part of the product design.\n\n## 13.3 Release checklist\n\n- [ ] Approved sources, licenses, and identity/voice permissions are recorded.\n- [ ] Model/API access and deployment region have been checked.\n- [ ] Inputs, tool calls, and generated scene manifests are validated.\n- [ ] Retries, cancellation, budget limits, and duplicate-job handling work.\n- [ ] Relevant evaluation cases pass and a human has reviewed final media.\n- [ ] Captions, audio, mobile playback, and download links are usable.\n- [ ] Logs are redacted; retention and deletion behavior is documented.\n- [ ] Recovery and rollback procedures have been exercised.\n\n# Appendix A. Quick command reference\n\n```bash\n# Extract one frame per second for visual inspection.\nffmpeg -i input.mp4 -vf fps=1 frames-%04d.jpg\n\n# Trim and re-encode a five-second clip.\nffmpeg -ss 00:00:03 -i input.mp4 -t 5 \\\n  -c:v libx264 -pix_fmt yuv420p -c:a aac clip.mp4\n\n# Render configured animation projects.\nmanim -ql scene.py MyScene\nnpx remotion render src/index.ts MyComposition out/video.mp4\n```\n\nUse a separate working directory for each render, validate filenames, and inspect the output with ffprobe. Commands assume installed dependencies and valid input files; they are recipes rather than a complete application.\n\n# Appendix B. Official sources and freshness ledger\n\nThe following official pages were checked on **November 20, 2026**. Model names in this edition are a snapshot; linked pages can change. No third-party benchmark or unverified blog is used as the basis for the release table.\n\n| Ref | Official source | Supports |\n|---|---|---|\n| [1] | [OpenAI API changelog](https://developers.openai.com/api/docs/changelog) | GPT-6.2 release and API/tool boundaries |\n| [2] | [Anthropic: Fable and Mythos 5.2](https://www.anthropic.com/claude-fable-and-mythos-5-2) | November release, daily-work alternatives, restricted-access distinction |\n| [3] | [xAI model catalog](https://docs.x.ai/developers/models) | Grok 4.7, search requirement, voice and media services |\n| [4] | [Google Gemini model catalog](https://aistudio.google.com/docs/models) | Gemini 4 Carbon and current multimodal catalog |\n| [5] | [ElevenLabs model documentation](https://elevenlabs.io/docs/overview/models) | Eleven v4/Turbo and Scribe v3/Live |\n| [6] | [OpenAI audio and speech](https://developers.openai.com/api/docs/guides/audio) | Further reading for speech API selection |\n| [7] | [OpenAI image generation](https://developers.openai.com/api/docs/guides/image-generation) | GPT Image model families and image workflows |\n| [8] | [Black Forest Labs models](https://bfl.ai/models) | FLUX catalog and open-weight option |\n| [9] | [Runway developer model catalog](https://docs.dev.runwayml.com/guides/models/) | Gen-4.5 and Aleph 2.0 API listing |\n| [10] | [Google Flow models and supported features](https://support.google.com/flow/answer/16352836?hl=en) | Consumer video availability; does not establish API parity |\n| [11] | [Remotion licensing](https://www.remotion.dev/docs/license/pricing) | License eligibility and commercial-use review |\n| [12] | [MCP architecture](https://modelcontextprotocol.io/docs/learn/architecture) | Protocol scope and client/server model |\n| [13] | [LangGraph persistence](https://docs.langchain.com/oss/python/langgraph/persistence) | Checkpointers, stores, agent persistence |\n| [14] | [FFmpeg filter documentation](https://ffmpeg.org/ffmpeg-filters.html) | Further reading for normalization, scaling, subtitles, and filters |\n\n**Maintenance procedure:** revisit official catalogs and deprecations before each release; update model configuration and this ledger; rerun your evaluation fixtures; record the deployment date and approved replacements. Keep descriptive product names separate from exact API model IDs.\n\n# Appendix C. Glossary\n\n| Term | Meaning |\n|---|---|\n| ASR / STT | Automatic speech recognition / speech to text |\n| TTS | Text to speech |\n| VAD | Voice activity detection |\n| Diarization | Estimating speaker turns in a recording |\n| WER | Word error rate |\n| Barge-in | Interrupting an assistant while it speaks |\n| RAG | Retrieval-augmented generation |\n| IR / scene manifest | Structured intermediate representation shared by pipeline stages |\n| LoRA | Low-rank adaptation of a compatible model |\n| MCP | Model Context Protocol |\n| Idempotency | Repeating a request without duplicating its intended side effect |\n| LUFS / dBTP | Perceived loudness / true-peak level units |\n| C2PA | Standards for media provenance and content credentials |\n| Open weights | Downloadable parameters; use remains subject to their license |\n";

  var firstGrp = nav.querySelector('details'); if (firstGrp) firstGrp.open = true;

  /* scroll spy */
  var spyEls = heads.filter(function (h) { return h.tagName === 'H1' || h.tagName === 'H2'; });
  var activeLink = null;
  function setActive(h) {
    var ch = h._ch; if (!ch) return;
    if (activeLink) activeLink.classList.remove('on');
    var link = null;
    ch.items.forEach(function (it) { if (it.id === h.id) link = it.el; });
    if (link) { link.classList.add('on'); activeLink = link; }
    if (ch.el && ch.el.tagName === 'DETAILS' && !ch.el.open) {
      Array.prototype.forEach.call(nav.querySelectorAll('details.grp'), function (d) { if (d !== ch.el) d.open = false; });
      ch.el.open = true;
    }
    if (link && !document.getElementById('side').classList.contains('open')) {
      var side = document.getElementById('side'), r = link.getBoundingClientRect(), sr = side.getBoundingClientRect();
      if (r.top < sr.top + 20 || r.bottom > sr.bottom - 20) side.scrollTop += r.top - sr.top - sr.height / 2;
    }
  }
  if ('IntersectionObserver' in window) {
    var visible = {};
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { visible[e.target.id] = e.isIntersecting; });
      for (var i = 0; i < spyEls.length; i++) { if (visible[spyEls[i].id]) { setActive(spyEls[i]); return; } }
    }, { rootMargin: '-70px 0px -72% 0px' });
    spyEls.forEach(function (h) { io.observe(h); });
  }

  /* mobile drawer */
  var side = document.getElementById('side'), menuBtn = document.getElementById('menuBtn');
  var scrim = document.createElement('div'); scrim.className = 'scrim'; document.body.appendChild(scrim);
  function drawer(open) { side.classList.toggle('open', open); scrim.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  menuBtn.addEventListener('click', function () { drawer(!side.classList.contains('open')); });
  scrim.addEventListener('click', function () { drawer(false); });
  nav.addEventListener('click', function (e) { if (e.target.closest('a')) drawer(false); });

  /* search index */
  var sections = [];
  heads.forEach(function (h) {
    if (h.tagName === 'H4') return;
    var parts = [], n = h.nextElementSibling;
    while (n && !/^H[1-3]$/.test(n.tagName)) { parts.push(n.textContent); n = n.nextElementSibling; }
    sections.push({ id: h.id, title: h.textContent.trim(), text: parts.join(' ').replace(/\s+/g, ' '), ch: h._ch ? h._ch.title.replace(/^(\d+)\.\s*/, '$1 · ').replace(/^Appendix\s*/, 'Appendix ') : '', color: h._ch ? h._ch.color : 'var(--c0)' });
  });
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  var input = document.getElementById('q'), box = document.getElementById('results'), kbd = document.getElementById('kbd');
  var sel = -1, hits = [];
  function run() {
    var raw = input.value.trim().toLowerCase();
    if (!raw) { box.hidden = true; box.innerHTML = ''; hits = []; return; }
    var terms = raw.split(/\s+/).filter(Boolean);
    hits = [];
    sections.forEach(function (s) {
      var t = s.title.toLowerCase(), x = s.text.toLowerCase(), score = 0, ok = true;
      terms.forEach(function (w) {
        var inT = t.indexOf(w) >= 0, inX = x.indexOf(w) >= 0;
        if (!inT && !inX) { ok = false; return; }
        if (inT) score += 20;
        if (inX) { var c = 0, i = -1; while ((i = x.indexOf(w, i + 1)) >= 0 && c < 20) c++; score += c; }
      });
      if (ok) hits.push({ s: s, score: score });
    });
    hits.sort(function (a, b) { return b.score - a.score; });
    var shown = hits.slice(0, 30), re = new RegExp('(' + terms.map(function (w) { return reEsc(esc(w)); }).join('|') + ')', 'gi');
    var out = '<div class="res-count">' + hits.length + ' matching sections' + (hits.length > 30 ? '; showing the first 30' : '') + '</div>';
    if (!shown.length) out = '<div class="res-empty">No matches. Try a shorter keyword.</div>';
    shown.forEach(function (h, idx) {
      var s = h.s, lowx = s.text.toLowerCase(), pos = -1;
      terms.forEach(function (w) { var p = lowx.indexOf(w); if (p >= 0 && (pos < 0 || p < pos)) pos = p; });
      var snip = pos >= 0 ? s.text.substr(Math.max(0, pos - 40), 150) : s.text.substr(0, 150);
      out += '<a class="res" href="#' + s.id + '" data-i="' + idx + '"><div class="res-t"><span>' + esc(s.title).replace(re, '<mark>$1</mark>') +
        '</span><span class="res-ch" style="--chc:' + s.color + '">' + esc(s.ch) + '</span></div><div class="res-s">' +
        (pos > 40 ? '…' : '') + esc(snip).replace(re, '<mark>$1</mark>') + '…</div></a>';
    });
    box.innerHTML = out; box.hidden = false; sel = -1; hits = shown;
  }
  function go(id) {
    box.hidden = true; drawer(false);
    var el = document.getElementById(id); if (!el) return;
    history.replaceState(null, '', '#' + id);
    el.scrollIntoView(); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  function highlight(i) {
    var rs = box.querySelectorAll('.res'); rs.forEach(function (r) { r.classList.remove('sel'); });
    if (rs[i]) { rs[i].classList.add('sel'); rs[i].scrollIntoView({ block: 'nearest' }); }
  }
  input.addEventListener('input', run);
  input.addEventListener('focus', function () { if (input.value.trim()) run(); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, hits.length - 1); highlight(sel); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); highlight(sel); }
    else if (e.key === 'Enter' && hits.length) { e.preventDefault(); go(hits[Math.max(sel, 0)].s.id); }
    else if (e.key === 'Escape') { input.value = ''; run(); input.blur(); }
  });
  box.addEventListener('click', function (e) {
    var a = e.target.closest('.res'); if (!a) return; e.preventDefault(); go(a.getAttribute('href').slice(1));
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.search')) box.hidden = true; });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); input.focus(); input.select(); }
  });
  input.addEventListener('focus', function () { kbd.style.display = 'none'; });
  input.addEventListener('blur', function () { kbd.style.display = ''; });

  /* deep link */
  if (location.hash.length > 1) {
    var t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (t) setTimeout(function () { t.scrollIntoView(); }, 50);
  }
})();
</script>
