  if (!window.marked) {
    var warn = document.createElement('p');
    warn.textContent = '渲染库未能加载（需要访问 cdnjs.cloudflare.com）。请刷新页面，或改用同时提供的 Markdown 文件。';
    content.appendChild(warn); return;
  }

  /* render */
  var tmp = document.createElement('div');
  tmp.innerHTML = marked.parse(MD, { gfm: true });
  var titleH1 = tmp.querySelector('h1');
  var lead = titleH1 && titleH1.nextElementSibling && titleH1.nextElementSibling.tagName === 'BLOCKQUOTE' ? titleH1.nextElementSibling : null;
  if (titleH1) { titleH1.removeAttribute('id'); hero.insertBefore(titleH1, hero.firstChild); }
  if (lead) { hero.insertBefore(lead, hero.querySelector('.cards')); }
  while (tmp.firstChild) content.appendChild(tmp.firstChild);

  /* ids, chapters */
  var used = {}, fallback = 0;
  function mkId(text) {
    var m = text.match(/^(\d+(?:\.\d+)*)\.?\s/), id;
    if (m) id = 's' + m[1].replace(/\./g, '-');
    else { var a = text.match(/^附录\s*([A-Z])/); id = a ? 'app-' + a[1].toLowerCase() : 'x' + (++fallback); }
    while (used[id]) id += 'b';
    used[id] = 1; return id;
  }
  var heads = Array.prototype.slice.call(content.querySelectorAll('h1,h2,h3,h4')).filter(function (h) { return h !== titleH1; });
  var chapters = [], cur = null;
  heads.forEach(function (h) {
    var txt = h.textContent.trim();
    h.id = mkId(txt);
    var lvl = +h.tagName.charAt(1);
    if (lvl === 1 || (lvl === 2 && !cur)) {
      var n = (txt.match(/^(\d+)/) || [])[1];
      cur = { id: h.id, title: txt, num: n, color: n && +n >= 1 ? 'var(--c' + (((+n - 1) % 6) + 1) + ')' : 'var(--c0)', items: [] };
      chapters.push(cur);
    } else if (lvl === 2 && cur) { cur.items.push({ id: h.id, title: txt }); }
    h._ch = cur;
    if (cur) h.style.setProperty('--chc', cur.color);
  });
  var curTop = null;
  Array.prototype.forEach.call(content.querySelectorAll('blockquote'), function (b) {
    var p = b, prev = null;
    while (p && p !== content) { p = p.previousElementSibling || p.parentElement; if (p && /^H[1-4]$/.test(p.tagName) && p._ch) { prev = p; break; } }
    if (prev) b.style.setProperty('--chc', prev._ch.color);
  });

  /* wrap tables and code */
  Array.prototype.forEach.call(content.querySelectorAll('table'), function (t) {
    var w = document.createElement('div'); w.className = 'tablewrap'; t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  Array.prototype.forEach.call(content.querySelectorAll('pre'), function (pre) {
    var w = document.createElement('div'); w.className = 'codewrap'; pre.parentNode.insertBefore(w, pre); w.appendChild(pre);
    var b = document.createElement('button'); b.className = 'btn copy'; b.type = 'button'; b.textContent = '复制'; w.appendChild(b);
    b.addEventListener('click', function () {
      var text = pre.innerText;
      function done(ok) { b.textContent = ok ? '已复制' : '请手动复制'; setTimeout(function () { b.textContent = '复制'; }, 1400); }
      function fallbackSel() {
        var r = document.createRange(); r.selectNodeContents(pre.firstElementChild || pre);
        var s = getSelection(); s.removeAllRanges(); s.addRange(r); done(false);
      }
      try { navigator.clipboard.writeText(text).then(function () { done(true); }, fallbackSel); } catch (e) { fallbackSel(); }
    });
  });
  Array.prototype.forEach.call(content.querySelectorAll('a[href^="http"]'), function (a) { a.target = '_blank'; a.rel = 'noopener noreferrer'; });

  var foot = document.createElement('div'); foot.className = 'foot';
  foot.textContent = '模型名、许可证与速度来自 2026-11 的第三方资料，落地前请核对官方模型卡与许可证，并用自己的评估集验证。生成日期 2026-11-19。';
  content.appendChild(foot);


  /* hero cards from chapters */
  var BLURB = {
    0: '能力地图、设计原则、学习路线', 1: '分层架构、Scene JSON、异步任务、一致性', 2: '脚本、分镜、结构化输出、提示词',
    3: 'VAD、转写、说话人分离、WER/CER', 4: '规范化、模型选型、克隆、流式', 5: '降噪、分离、音乐、混音、响度',
    6: '模型、参数、ControlNet、LoRA、一致性', 7: 'I2V 工作流、提示词、后处理、成本', 8: 'Manim、Remotion、仿真、口型驱动',
    9: '时间线、ffmpeg、字幕、导出、QA', 10: '工作流、Agent、Skills、MCP', 11: '讲解、播客、绘本、营销、知识库、语音助手',
    12: '部署、成本模型、可观测、版本', 13: '评估、内容安全、授权、披露'
  };
  var cardBox = document.getElementById('cards');
  chapters.forEach(function (c) {
    if (c.num === undefined) return;
    var a = document.createElement('a'); a.className = 'card'; a.href = '#' + c.id; a.style.setProperty('--chc', c.color);
    var b = document.createElement('b'); b.textContent = c.title.replace(/^(\d+)\.\s*/, '$1 · ');
    var s = document.createElement('span'); s.textContent = BLURB[c.num] || '';
    a.appendChild(b); a.appendChild(s); cardBox.appendChild(a);
  });

  /* nav */
  var nav = document.getElementById('nav');
  chapters.forEach(function (c) {
    var el;
    if (!c.items.length) {
      el = document.createElement('a'); el.className = 'grp-plain'; el.href = '#' + c.id; el.textContent = c.title; el.style.setProperty('--chc', c.color);
      el.dataset.chapter = c.id; nav.appendChild(el); c.el = el; return;
    }
    el = document.createElement('details'); el.className = 'grp'; el.style.setProperty('--chc', c.color);
    var s = document.createElement('summary'), a = document.createElement('a');
    a.href = '#' + c.id; a.textContent = c.title; s.appendChild(a); el.appendChild(s);
    var ul = document.createElement('ul');
    c.items.forEach(function (it) {
      var li = document.createElement('li'), l = document.createElement('a');
      l.href = '#' + it.id; l.textContent = it.title; l.dataset.target = it.id; li.appendChild(l); ul.appendChild(li); it.el = l;
    });
    el.appendChild(ul); nav.appendChild(el); c.el = el;
  });
  var firstGrp = nav.querySelector('details'); if (firstGrp) firstGrp.open = true;

  /* scroll spy */
  var spyEls = heads.filter(function (h) { return h.tagName === 'H1' || h.tagName === 'H2'; });
  var activeLink = null;
  function setActive(h) {
    var ch = h._ch; if (!ch) return;
    if (activeLink) activeLink.classList.remove('on');
    var link = null;
    ch.items.forEach(function (it) { if (it.id === h.id) link = it.el; });
    if (link) { link.classList.add('on'); activeLink = link; }
    if (ch.el && ch.el.tagName === 'DETAILS' && !ch.el.open) {
      Array.prototype.forEach.call(nav.querySelectorAll('details.grp'), function (d) { if (d !== ch.el) d.open = false; });
      ch.el.open = true;
    }
    if (link && !document.getElementById('side').classList.contains('open')) {
      var side = document.getElementById('side'), r = link.getBoundingClientRect(), sr = side.getBoundingClientRect();
      if (r.top < sr.top + 20 || r.bottom > sr.bottom - 20) side.scrollTop += r.top - sr.top - sr.height / 2;
    }
  }
  if ('IntersectionObserver' in window) {
    var visible = {};
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { visible[e.target.id] = e.isIntersecting; });
      for (var i = 0; i < spyEls.length; i++) { if (visible[spyEls[i].id]) { setActive(spyEls[i]); return; } }
    }, { rootMargin: '-70px 0px -72% 0px' });
    spyEls.forEach(function (h) { io.observe(h); });
  }

  /* mobile drawer */
  var side = document.getElementById('side'), menuBtn = document.getElementById('menuBtn');
  var scrim = document.createElement('div'); scrim.className = 'scrim'; document.body.appendChild(scrim);
  function drawer(open) { side.classList.toggle('open', open); scrim.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  menuBtn.addEventListener('click', function () { drawer(!side.classList.contains('open')); });
  scrim.addEventListener('click', function () { drawer(false); });
  nav.addEventListener('click', function (e) { if (e.target.closest('a')) drawer(false); });

  /* search index */
  var sections = [];
  heads.forEach(function (h) {
    if (h.tagName === 'H4') return;
    var parts = [], n = h.nextElementSibling;
    while (n && !/^H[1-3]$/.test(n.tagName)) { parts.push(n.textContent); n = n.nextElementSibling; }
    sections.push({ id: h.id, title: h.textContent.trim(), text: parts.join(' ').replace(/\s+/g, ' '), ch: h._ch ? h._ch.title.replace(/^(\d+)\.\s*/, '$1 · ').replace(/^附录\s*/, '附录 ') : '', color: h._ch ? h._ch.color : 'var(--c0)' });
  });
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  var input = document.getElementById('q'), box = document.getElementById('results'), kbd = document.getElementById('kbd');
  var sel = -1, hits = [];
  function run() {
    var raw = input.value.trim().toLowerCase();
    if (!raw) { box.hidden = true; box.innerHTML = ''; hits = []; return; }
    var terms = raw.split(/\s+/).filter(Boolean);
    hits = [];
    sections.forEach(function (s) {
      var t = s.title.toLowerCase(), x = s.text.toLowerCase(), score = 0, ok = true;
      terms.forEach(function (w) {
        var inT = t.indexOf(w) >= 0, inX = x.indexOf(w) >= 0;
        if (!inT && !inX) { ok = false; return; }
        if (inT) score += 20;
        if (inX) { var c = 0, i = -1; while ((i = x.indexOf(w, i + 1)) >= 0 && c < 20) c++; score += c; }
      });
      if (ok) hits.push({ s: s, score: score });
    });
    hits.sort(function (a, b) { return b.score - a.score; });
    var shown = hits.slice(0, 30), re = new RegExp('(' + terms.map(function (w) { return reEsc(esc(w)); }).join('|') + ')', 'gi');
    var out = '<div class="res-count">' + hits.length + ' 个匹配小节' + (hits.length > 30 ? '，显示前 30 个' : '') + '</div>';
    if (!shown.length) out = '<div class="res-empty">没有匹配。试试更短的关键词，或英文术语。</div>';
    shown.forEach(function (h, idx) {
      var s = h.s, lowx = s.text.toLowerCase(), pos = -1;
      terms.forEach(function (w) { var p = lowx.indexOf(w); if (p >= 0 && (pos < 0 || p < pos)) pos = p; });
      var snip = pos >= 0 ? s.text.substr(Math.max(0, pos - 40), 150) : s.text.substr(0, 150);
      out += '<a class="res" href="#' + s.id + '" data-i="' + idx + '"><div class="res-t"><span>' + esc(s.title).replace(re, '<mark>$1</mark>') +
        '</span><span class="res-ch" style="--chc:' + s.color + '">' + esc(s.ch) + '</span></div><div class="res-s">' +
        (pos > 40 ? '…' : '') + esc(snip).replace(re, '<mark>$1</mark>') + '…</div></a>';
    });
    box.innerHTML = out; box.hidden = false; sel = -1; hits = shown;
  }
  function go(id) {
    box.hidden = true; drawer(false);
    var el = document.getElementById(id); if (!el) return;
    history.replaceState(null, '', '#' + id);
    el.scrollIntoView(); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  function highlight(i) {
    var rs = box.querySelectorAll('.res'); rs.forEach(function (r) { r.classList.remove('sel'); });
    if (rs[i]) { rs[i].classList.add('sel'); rs[i].scrollIntoView({ block: 'nearest' }); }
  }
  input.addEventListener('input', run);
  input.addEventListener('focus', function () { if (input.value.trim()) run(); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, hits.length - 1); highlight(sel); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); highlight(sel); }
    else if (e.key === 'Enter' && hits.length) { e.preventDefault(); go(hits[Math.max(sel, 0)].s.id); }
    else if (e.key === 'Escape') { input.value = ''; run(); input.blur(); }
  });
  box.addEventListener('click', function (e) {
    var a = e.target.closest('.res'); if (!a) return; e.preventDefault(); go(a.getAttribute('href').slice(1));
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.search')) box.hidden = true; });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); input.focus(); input.select(); }
  });
  input.addEventListener('focus', function () { kbd.style.display = 'none'; });
  input.addEventListener('blur', function () { kbd.style.display = ''; });

  /* deep link */
  if (location.hash.length > 1) {
    var t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (t) setTimeout(function () { t.scrollIntoView(); }, 50);
  }
})();
</script>

</body>
