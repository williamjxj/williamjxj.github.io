<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>GenAI 多媒体手册</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
/* Layout concept: sticky top bar (menu, search, theme) + collapsible chapter sidebar + single reading column.
   Chapter colors cycle through six hues by chapter number. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eaeef4;
  --fg: #17202c;
  --muted: #566274;
  --line: #d9dfe8;
  --accent: #1d5c8f;
  --code-bg: #edf0f5;
  --code-fg: #17202c;
  --mark: #ffe08a;
  --c0: #566274;
  --c1: #0b7285;
  --c2: #a8660f;
  --c3: #6d3fb2;
  --c4: #2b7a4b;
  --c5: #b0344f;
  --c6: #3d5fb8;
  --bar-bg: #f4f6f9;
  --bar-h: 56px;
  --sans: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", "Noto Sans SC", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #171e27; --surface-2: #1f2833; --fg: #e3e8ef; --muted: #9aa6b8;
    --line: #2a3441; --accent: #7db7ee; --code-bg: #0c1117; --code-fg: #dbe3ee; --mark: #6b5a14;
    --c0: #9aa6b8; --c1: #4fc3d6; --c2: #e3ab4f; --c3: #b99af0; --c4: #5fd197; --c5: #f08aa3; --c6: #8fa8f0; --bar-bg: #10151c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #171e27; --surface-2: #1f2833; --fg: #e3e8ef; --muted: #9aa6b8;
  --line: #2a3441; --accent: #7db7ee; --code-bg: #0c1117; --code-fg: #dbe3ee; --mark: #6b5a14;
  --c0: #9aa6b8; --c1: #4fc3d6; --c2: #e3ab4f; --c3: #b99af0; --c4: #5fd197; --c5: #f08aa3; --c6: #8fa8f0; --bar-bg: #10151c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body {
  background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  overflow-wrap: break-word;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar-bg); }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* top bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--bar-h);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  background: var(--bar-bg); border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 1280px; margin: 0 auto; height: 100%; display: flex; align-items: center; gap: 12px; position: relative; }
.brand { font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.btn {
  font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer; line-height: 1.2; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.menu-btn { display: none; }
.search { flex: 1; min-width: 0; max-width: 520px; margin-left: auto; position: relative; }
.search input {
  width: 100%; font: inherit; font-size: 14px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 36px 7px 12px;
}
.search kbd {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 12px var(--mono); color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; pointer-events: none; background: var(--bg);
}
.results {
  position: absolute; top: calc(100% + 6px); right: 0; width: min(640px, calc(100vw - 32px)); max-height: min(70vh, 560px);
  overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 12px 32px rgba(10, 20, 35, .18); z-index: 40;
}
.results[hidden] { display: none; }
.res { display: block; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; }
.res:last-child { border-bottom: 0; }
.res:hover, .res.sel { background: var(--surface-2); }
.res-t { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.res-ch { font-size: 11.5px; font-weight: 500; color: var(--chc, var(--muted)); border: 1px solid currentColor; border-radius: 10px; padding: 0 7px; line-height: 1.6; }
.res-s { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-top: 3px; }
.res-empty, .res-count { padding: 12px 14px; font-size: 13px; color: var(--muted); }
.res-count { border-bottom: 1px solid var(--line); padding: 8px 14px; font-size: 12px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

/* shell */
.shell { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 276px minmax(0, 1fr); gap: 44px; padding-top: 24px; }
.side {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 20px);
  align-self: start; max-height: calc(100vh - var(--bar-h) - env(safe-area-inset-top, 0px) - 36px);
  overflow-y: auto; padding-right: 8px; font-size: 13.5px; line-height: 1.45; scrollbar-width: thin;
}
.nav-label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.grp { margin: 0 0 4px; }
.grp > summary, .grp-plain {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 6px;
  font-weight: 600; color: var(--fg); text-decoration: none;
}
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary::before, .grp-plain::before {
  content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--chc, var(--c0)); flex: none;
}
.grp > summary:hover, .grp-plain:hover { background: var(--surface-2); }
.grp > summary a { color: inherit; text-decoration: none; flex: 1; min-width: 0; }
.grp ul { list-style: none; margin: 2px 0 8px 14px; padding: 0 0 0 10px; border-left: 1px solid var(--line); }
.grp li a { display: block; padding: 3px 8px; color: var(--muted); text-decoration: none; border-radius: 4px; }
.grp li a:hover { color: var(--fg); background: var(--surface-2); }
.grp li a.on { color: var(--fg); background: var(--surface-2); font-weight: 500; box-shadow: inset 2px 0 0 var(--chc, var(--accent)); }

/* hero */
.hero { padding: 8px 0 28px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.hero h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.25; margin: 0 0 12px; letter-spacing: -.01em; text-wrap: balance; }
.hero blockquote { margin: 0 0 18px; padding: 0; border: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.hero blockquote p { margin: 0 0 4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.card { display: block; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--chc); text-decoration: none; color: var(--fg); border-radius: 4px; }
.card:hover { border-color: var(--chc); }
.card b { display: block; font-size: 14.5px; color: var(--chc); }
.card span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 3px; }

/* content */
.content { min-width: 0; }
.content h1, .content h2, .content h3, .content h4 { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 14px); line-height: 1.35; text-wrap: balance; }
.content h1 { font-size: 28px; margin: 56px 0 16px; padding-top: 18px; border-top: 4px solid var(--chc, var(--c0)); }
.content h2 { font-size: 21px; margin: 44px 0 12px; padding-top: 16px; border-top: 1px solid var(--line); }
.content h3 { font-size: 16.5px; margin: 28px 0 8px; color: var(--fg); }
.content h4 { font-size: 14.5px; margin: 20px 0 6px; color: var(--muted); }
.content p { margin: 0 0 12px; max-width: 78ch; }
.content ul, .content ol { margin: 0 0 14px; padding-left: 1.4em; max-width: 78ch; }
.content li { margin: 3px 0; }
.content hr { border: 0; border-top: 1px solid var(--line); margin: 36px 0 0; }
.content blockquote { margin: 0 0 16px; padding: 8px 14px; background: var(--surface); border-left: 3px solid var(--chc, var(--c0)); color: var(--muted); max-width: 78ch; }
.content blockquote p { margin: 0 0 4px; }
.content code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.codewrap { position: relative; margin: 0 0 16px; }
.content pre { margin: 0; padding: 14px 16px; background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; tab-size: 2; }
.content pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; white-space: pre; }
.copy { position: absolute; top: 6px; right: 6px; font: 11.5px var(--sans); padding: 2px 8px; opacity: 0; transition: opacity .15s; }
.codewrap:hover .copy, .copy:focus-visible { opacity: 1; }
@media (hover: none) { .copy { opacity: 1; } }
.tablewrap { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.content table { border-collapse: collapse; width: 100%; font-size: 13.5px; line-height: 1.55; }
.content th, .content td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); min-width: 90px; }
.content th { background: var(--surface-2); font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
.content tr:last-child td { border-bottom: 0; }
.content td code { font-size: .85em; }
.content input[type="checkbox"] { margin-right: 6px; }
.content li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.2em; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--mark); } to { background: transparent; } }
.foot { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
.scrim { display: none; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .menu-btn { display: inline-block; }
  .side {
    position: fixed; z-index: 25; left: 0; bottom: 0; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h));
    width: min(86vw, 340px); max-height: none; background: var(--bg); border-right: 1px solid var(--line);
    padding: 16px 12px 24px max(16px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .2s ease; visibility: hidden;
  }
  .side.open { transform: none; visibility: visible; }
  .scrim.open { display: block; position: fixed; inset: 0; z-index: 22; background: rgba(8, 14, 22, .45); }
}
@media (max-width: 640px) {
  .brand { display: none; }
  .search { max-width: none; margin-left: 0; }
  .search kbd { display: none; }
  .content h1 { font-size: 24px; }
  .content h2 { font-size: 19px; }
}
</style>

<div class="bar"><div class="bar-in">
  <button class="btn menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">目录</button>
  <span class="brand">GenAI 多媒体手册</span>
  <div class="search">
    <input id="q" type="search" placeholder="搜索全文，如 VAD、LoRA、Manim、ducking" autocomplete="off" aria-label="搜索手册">
    <kbd id="kbd">/</kbd>
    <div class="results" id="results" hidden role="listbox"></div>
  </div>
  <button class="btn" id="themeBtn" aria-label="切换明暗主题">主题</button>
</div></div>

<div class="shell">
  <nav class="side" id="side" aria-label="章节目录"><p class="nav-label">章节</p><div id="nav"></div></nav>
  <main class="content" id="content">
    <header class="hero" id="hero">
      <div class="cards" id="cards"></div>
    </header>
  </main>
</div>

<script>
(function () {
  var MD = "# GenAI 多媒体应用构建手册：文本 · 声音 · 图像 · 视频 · 动画 · Skills\n\n> 目标：作为通用知识库，说明如何把 **文本、语音、音频、图像、视频、动画/仿真** 组合成一个完整的 GenAI 多媒体应用，并用 **Skills / MCP / 工作流引擎** 把它们编排起来。\n> 结构：先给参考架构和数据模型（第 0–2 章），再逐个模态（第 3–8 章），然后是合成、编排、端到端蓝图、部署与合规（第 9–13 章），最后是附录速查。\n> 时效声明：模型与价格每月都在变。表中的模型名、许可证、速度取自 2026-11 的网页检索与模型卡，**落地前必须核对官方模型卡与许可证**；标\"待核实\"的是单一来源数据。命令与参数名随版本会变，以 `--help` 和官方文档为准。\n> 与《LLM 工作流手册》的关系：那份管文本侧（RAG、LoRA、SFT/RL、LLM-Wiki），本份管多模态生成与应用集成。\n\n# 0. 总览与学习路线\n\n## 0.1 什么是多媒体 GenAI 应用\n\n由多个生成模型和确定性工具串成的**流水线**，输入是一个意图（主题、文章、录音、产品信息），输出是可发布的媒体成品（视频、播客、绘本、课程、语音助手的实时回复）。\n\n核心特征：\n1. **多模型**：LLM + ASR + TTS + 图像 + 视频 + 音乐等，各自独立迭代。\n2. **多工具**：ffmpeg、渲染引擎（Remotion/Manim/Blender）、对象存储、队列。\n3. **长耗时**：生成一条视频要分钟到小时，必须异步、可恢复、可缓存。\n4. **一致性难**：同一角色、同一风格、同一声音要跨镜头保持。\n5. **可控性与合规**：授权、水印、内容审核是产品的一部分。\n\n## 0.2 能力地图\n\n| 模态 | 典型任务 | 代表技术 | 章节 |\n|---|---|---|---|\n| 文本 | 脚本、分镜、提示词、摘要、翻译、代码生成 | LLM、结构化输出、RAG、Agent | 第 2 章 |\n| 语音转文字（ASR/STT） | 转写、字幕、会议纪要 | Whisper 系、Parakeet、Qwen3-ASR | 第 3 章 |\n| 文字转语音（TTS） | 旁白、播客、语音助手、克隆 | Kokoro、Qwen3-TTS、Chatterbox 等 | 第 4 章 |\n| 其他音频 | 降噪、人声分离、音乐、音效、混音 | Demucs、MusicGen、ffmpeg | 第 5 章 |\n| 图像 | 文生图、改图、风格/角色 LoRA、放大 | 扩散/流匹配模型、ComfyUI | 第 6 章 |\n| 视频 | 文生视频、图生视频、首尾帧、延长 | Wan、LTX、Hunyuan、云端闭源服务 | 第 7 章 |\n| 动画与仿真 | 讲解动画、数据/算法/物理仿真、口型驱动角色 | Manim、Remotion、Blender、Matter.js、three.js | 第 8 章 |\n| 合成与后期 | 时间线、字幕、混音、多比例导出 | ffmpeg、MoviePy、Remotion | 第 9 章 |\n| 编排 | 工作流、Agent、Skills、MCP | Temporal/Prefect、LangGraph、Skills | 第 10 章 |\n\n## 0.3 七条设计原则\n\n1. **文本是通用接口**：ASR 把声音变文本，VLM 把图像变文本，LLM 在文本层推理，各生成模型再把文本变回媒体。环节之间只靠文本和 ID 通信，便于替换与评估。\n2. **结构化中间表示（IR）**：用一份 `Project / Scene / Shot / Asset` JSON 贯穿全流程（见 §1.2），所有步骤读写它，而不是互相传文件路径。\n3. **分层解耦**：生成层（模型）、合成层（时间线/渲染）、编排层（工作流）、产品层（API/UI）互不渗透。\n4. **先草稿后精修**：低分辨率、少步数、便宜模型先过一遍分镜与节奏，确认后再用高质量参数生成终稿。\n5. **一致性是一等公民**：角色卡、风格指南、固定 seed、参考图、声音 ID、LoRA 都写进数据模型。\n6. **确定性优先**：能用代码做的（排版、图表、公式、动画）就别让像素模型\"画\"。代码生成的画面可复现、可编辑、没有乱码文字。\n7. **人在回路**：在脚本、分镜、首帧三个关键点设审批；越往后重做成本越高。\n\n## 0.4 技术选型总决策：云 API 还是本地模型\n\n| 场景 | 本地 | 云 API |\n|---|---|---|\n| 隐私敏感素材（私人录音、内部资料） | 首选 | 需确认条款 |\n| 需要业界最高画质/声音质量（尤其视频） | 差距大 | 首选 |\n| 学习原理、可调参、可 LoRA | 首选 | 用作对照基线 |\n| 批量大、成本敏感 | GPU 已有则划算 | 按量计费，需估算 |\n| 实时语音交互 | 小模型可行 | 延迟低、省资源 |\n| 冷启动/弹性峰值 | 不适合 | 适合（或云 GPU 按需） |\n\n建议路径：**先用云 API 搭通整条流水线（明确\"最好能做到什么\"），再逐环节换成本地/自托管模型（可控、省钱、隐私）**。每次替换都用同一评估集回归。\n\n## 0.5 学习路线（通用，4 个阶段）\n\n| 阶段 | 内容 | 可交付物 |\n|---|---|---|\n| L1 单模态入门（2–3 周） | ffmpeg 基础；ASR 转写；TTS 朗读；文生图；文生视频（云）| 每个模态各一个脚本，输出样例 + 参数记录 |\n| L2 单模态进阶（3–4 周） | VAD/说话人分离；声音克隆；ControlNet/LoRA；I2V；Manim/Remotion 动画 | 每个模态一个带评估的小项目（CER、MOS、CLIP/人评） |\n| L3 组合流水线（3–4 周） | Scene JSON、异步任务、字幕与混音合成、多比例导出 | 一条端到端流水线：主题 → 成品视频 |\n| L4 编排与生产化（3–4 周） | Skills/MCP、工作流引擎、成本与可观测、合规检查 | 可复用的 Skill 集 + 部署 + 评估看板 |\n\n学习原则：每步先做最小可运行版本，再加评估，再优化；没有评估数据的\"感觉更好\"不算进步。\n\n---\n\n# 1. 参考架构与数据模型\n\n## 1.1 分层架构\n\n```\n┌──────────────────────────── 产品层 ────────────────────────────┐\n│ Web/App UI · REST/WebSocket API · 鉴权 · 计费 · 审核与审批台       │\n├──────────────────────────── 编排层 ────────────────────────────┤\n│ 工作流引擎(DAG) · Agent · Skills/MCP · 任务队列 · 重试/幂等/缓存   │\n├──────────────────────────── 生成层 ────────────────────────────┤\n│ LLM │ ASR │ TTS │ 音乐/音效 │ 图像 │ 视频 │ 动画渲染(Manim/Remotion)│\n├──────────────────────────── 合成层 ────────────────────────────┤\n│ 时间线 · ffmpeg/MoviePy · 字幕 · 混音 · 放大/插帧 · 导出            │\n├──────────────────────────── 基础设施 ───────────────────────────┤\n│ 对象存储 · 元数据库 · GPU/CPU 池 · 密钥 · 日志/追踪 · CDN           │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n## 1.2 核心数据模型（IR）\n\n所有步骤围绕同一份 `Project`：\n\n```json\n{\n  \"project_id\": \"p_20261119_001\",\n  \"brief\": {\"topic\": \"什么是 RAG\", \"audience\": \"开发者\", \"duration_s\": 90, \"lang\": \"zh-CN\", \"aspect\": \"16:9\"},\n  \"style\": {\"visual\": \"flat vector, blue palette\", \"voice_id\": \"v_zh_female_01\", \"music_mood\": \"calm tech\"},\n  \"characters\": [{\"id\": \"c1\", \"name\": \"小智\", \"ref_images\": [\"asset:img_0007\"], \"lora\": null, \"seed\": 1234}],\n  \"scenes\": [\n    {\n      \"id\": \"s1\", \"narration\": \"检索增强生成，让模型先查资料再回答。\",\n      \"shots\": [\n        {\"id\": \"s1_1\", \"duration_s\": 4.2, \"kind\": \"animation|image|video\",\n         \"visual_prompt\": \"...\", \"negative_prompt\": \"...\", \"camera\": \"slow push-in\",\n         \"assets\": {\"image\": \"asset:img_0011\", \"clip\": null, \"audio_tts\": \"asset:aud_0003\"},\n         \"on_screen_text\": \"RAG = Retrieval + Generation\"}\n      ]\n    }\n  ],\n  \"timeline\": {\"tracks\": [{\"type\": \"video\", \"items\": []}, {\"type\": \"voice\", \"items\": []}, {\"type\": \"music\", \"items\": []}, {\"type\": \"subtitle\", \"items\": []}]},\n  \"assets\": {\"img_0011\": {\"uri\": \"s3://bucket/p_001/img_0011.png\", \"sha256\": \"...\", \"model\": \"flux-x\", \"params\": {\"seed\": 42, \"steps\": 28}, \"created_at\": \"...\"}},\n  \"status\": {\"stage\": \"assets\", \"approvals\": {\"script\": true, \"storyboard\": false}}\n}\n```\n\n要点：\n- `assets` 存**指针 + 来源元数据**（模型、版本、参数、seed、哈希），不是二进制本身。\n- `duration_s` 以 **TTS 音频真实时长**为准回填，视频镜头再按它裁剪/变速（§9.3）。\n- 版本化：每次改动存新版本，可回滚、可复现。\n\n## 1.3 标准流水线阶段\n\n```\n Brief ─► Script ─► Storyboard ─► [审批①] ─► Asset 生成(并行) ─► [审批②] ─► 合成 ─► QA ─► 导出/发布\n 意图      脚本       分镜 JSON               TTS/图像/视频/动画/音乐            时间线/字幕/混音  自动+人工\n```\n\n| 阶段 | 输入 → 输出 | 主要工具 | 可并行 |\n|---|---|---|---|\n| Brief | 用户输入 → 结构化需求 | LLM 抽取/追问 | 否 |\n| Script | Brief → 口播脚本（TTS 友好） | LLM | 否 |\n| Storyboard | 脚本 → Scene/Shot JSON + 提示词 | LLM + schema | 否 |\n| Asset 生成 | Shot → 音频、图像、视频、动画片段、音乐 | 各生成模型/渲染器 | **是**（按 shot 并行） |\n| 合成 | Asset + 时间线 → 成片 | ffmpeg/Remotion | 部分 |\n| QA | 成片 → 通过/失败 + 原因 | 脚本检查 + VLM/ASR 回测 + 人审 | 是 |\n| 导出 | 成片 → 多比例/多码率 | ffmpeg | 是 |\n\n## 1.4 异步任务、幂等与缓存\n\n长任务不能放在请求线程里。基本模式：\n\n```\nPOST /projects/{id}/render  → 202 {job_id}\nGET  /jobs/{job_id}         → {state: queued|running|succeeded|failed, progress, outputs}\n可选：WebSocket/SSE 推送进度；完成时 webhook 回调\n```\n\n| 要点 | 做法 |\n|---|---|\n| 队列 | Celery/RQ（Python）、BullMQ（Node）、Temporal/Inngest（需要长流程、可恢复） |\n| 幂等 | 任务键 = `hash(模型版本 + 全部参数 + 输入内容哈希)`；同键直接返回已有 Asset |\n| 缓存 | 内容寻址存储：同样的 prompt + seed + 模型 → 复用，不重复花钱 |\n| 重试 | 对网络/限流/GPU OOM 做指数退避；对\"内容审核拒绝\"不重试 |\n| 部分重做 | 改一个镜头只重跑该镜头及下游（合成/导出），不重跑全部 |\n| GPU 调度 | 一个 GPU 一次只跑一个大模型任务；按显存预算排队；模型常驻池 + 空闲卸载 |\n| 超时/取消 | 每步有超时；用户取消时回收子进程与显存 |\n\n## 1.5 资产存储与溯源\n\n```\nbucket/\n└── projects/{project_id}/\n    ├── v{N}/project.json        # 该版本 IR\n    ├── assets/{kind}/{sha256}.{ext}   # 内容寻址\n    ├── renders/{render_id}/final.mp4\n    └── logs/{job_id}.jsonl\n```\n\n- 每个 Asset 记录：来源（哪个模型/版本/API）、全部参数、seed、父资产、创建者、许可证标记。\n- 合成成片时写入元数据（C2PA 内容凭证或至少 `ffmpeg -metadata comment=AI-generated`），便于披露与追溯（见第 13 章）。\n\n## 1.6 一致性管理（跨镜头）\n\n| 对象 | 手段 |\n|---|---|\n| 角色外观 | 角色卡文本 + 参考图（IP-Adapter / 参考式编辑模型）+ 角色 LoRA；固定 seed 只能保证\"同一 prompt 同一图\"，不保证跨 prompt 一致 |\n| 画面风格 | 全局 style 字符串拼入每个 prompt；风格 LoRA；统一后期调色 LUT |\n| 场景连续性 | 用上一镜头的尾帧作为下一镜头的首帧（I2V 的首帧/首尾帧控制） |\n| 声音 | 固定 `voice_id` 或固定参考音；同一角色同一声音 |\n| 术语/名字 | glossary（TTS 读音、字幕拼写、画面文字统一来源） |\n| 文字 | 画面文字交给**代码渲染**（Remotion/Pillow），不要让图像模型生成 |\n\n## 1.7 两套参考技术栈\n\n| 层 | 云优先（快速上线） | 本地/自托管优先（可控、隐私） |\n|---|---|---|\n| LLM | 云 LLM API | Ollama / vLLM / llama.cpp |\n| ASR | 云 ASR API | whisper.cpp / mlx-whisper / faster-whisper |\n| TTS | 云 TTS API | Kokoro / Qwen3-TTS / Chatterbox |\n| 图像 | 云图像 API | ComfyUI / diffusers + 开源权重 |\n| 视频 | 云视频 API | Wan / LTX / Hunyuan + ComfyUI（需较强 GPU） |\n| 动画 | Remotion / Manim（本地渲染，二者通用） | 同左 |\n| 编排 | Temporal Cloud / Inngest | Prefect / Celery + Redis |\n| 存储 | S3 兼容对象存储 | MinIO / 本地磁盘 |\n| 服务 | FastAPI / Next.js API | 同左 |\n\n## 1.8 代码骨架：Scene 模型 + 异步任务（FastAPI）\n\n```python\n# models.py\nfrom pydantic import BaseModel, Field\nfrom typing import Literal\n\nclass Shot(BaseModel):\n    id: str\n    duration_s: float = Field(gt=0, le=15)\n    kind: Literal[\"animation\", \"image\", \"video\"]\n    visual_prompt: str\n    negative_prompt: str = \"\"\n    camera: str = \"\"\n    on_screen_text: str = \"\"\n    assets: dict[str, str | None] = {}\n\nclass Scene(BaseModel):\n    id: str\n    narration: str\n    shots: list[Shot]\n\nclass Project(BaseModel):\n    project_id: str\n    brief: dict\n    style: dict\n    scenes: list[Scene]\n```\n\n```python\n# api.py\nimport hashlib, json\nfrom fastapi import FastAPI\nfrom models import Project\n\napp = FastAPI()\n\ndef job_key(model: str, params: dict, inputs: dict) -> str:\n    blob = json.dumps({\"m\": model, \"p\": params, \"i\": inputs}, sort_keys=True, ensure_ascii=False)\n    return hashlib.sha256(blob.encode()).hexdigest()\n\n@app.post(\"/projects/{pid}/render\", status_code=202)\nasync def render(pid: str, project: Project):\n    # 1) 校验 IR  2) 为每个 shot 入队 asset 任务（带 job_key，命中缓存则跳过）\n    # 3) 全部完成后触发合成任务  4) 返回 job_id\n    ...\n    return {\"job_id\": \"j_123\"}\n```\n\n---\n\n# 2. 文本层：脚本、分镜与提示词\n\n## 2.1 文本层承担的角色\n\n| 角色 | 输入 → 输出 | 说明 |\n|---|---|---|\n| 需求分析 | 用户一句话 → Brief JSON（受众、时长、语气、比例） | 缺字段时追问，不要猜 |\n| 编剧 | Brief → 大纲 → 口播脚本 | 口语化、短句、适配 TTS |\n| 分镜师 | 脚本 → Scene/Shot JSON | 每镜头的画面、时长、镜头语言、字幕 |\n| 提示词工程师 | Shot → 各模型专用提示词 | 图像/视频/音乐模型语法不同 |\n| 审校 | 全部产物 → 问题清单 | 事实、敏感内容、术语、一致性 |\n| 本地化 | 脚本 → 多语言版本 + 字幕 | 保持时长约束 |\n\n## 2.2 结构化输出（必须掌握）\n\n多媒体流水线的每一步都依赖**可解析的输出**。三种手段：\n\n| 手段 | 说明 | 取舍 |\n|---|---|---|\n| JSON Schema / 工具调用 | API 层强制符合 schema | 最稳，首选 |\n| 约束解码（grammar，如 llama.cpp GBNF、outlines） | 本地模型强制语法 | 本地模型可用，保证可解析不保证语义对 |\n| 提示 + 校验 + 重试 | 解析失败把错误回传让模型修 | 通用兜底，设最多 2–3 次 |\n\n```python\nfrom pydantic import ValidationError\ndef call_llm_json(prompt: str, schema_model, max_retry: int = 2):\n    err = \"\"\n    for _ in range(max_retry + 1):\n        raw = llm(prompt + (f\"\\n上次输出不合法：{err}\\n请只输出符合 schema 的 JSON。\" if err else \"\"))\n        try:\n            return schema_model.model_validate_json(raw)\n        except ValidationError as e:\n            err = str(e)[:500]\n    raise RuntimeError(\"LLM 输出未通过校验\")\n```\n\n## 2.3 脚本生成流程\n\n```\nBrief → 大纲(章节+每章目标+时长预算) → 逐章口播稿 → TTS 友好改写 → 时长估算 → 审批①\n```\n\n**TTS 友好改写规则**：\n- 句子 ≤ 25–40 字，一句一个意思；少用括号和长定语。\n- 数字、日期、缩写写成读法（\"2026 年 11 月 19 日\"→按 TTS 约定）；英文术语加 glossary。\n- 去掉 Markdown、表格、代码；\"如下图所示\"改成口播能听懂的说法。\n- 时长估算：中文约 4–5 字/秒（正常语速），英文约 2.5–3 词/秒；以实际 TTS 时长为准回填。\n\n## 2.4 分镜 Prompt 模板\n\n```\n你是分镜师。把下面的口播脚本拆成镜头，输出 JSON（符合给定 schema）。\n约束：\n1. 每个镜头 3–8 秒；每个镜头只表达一个视觉想法。\n2. visual_prompt 用英文，按「主体 + 动作 + 场景 + 风格 + 镜头 + 光线」顺序，不含画面文字。\n3. 需要出现文字/图表/公式的镜头，kind 设为 \"animation\"，把文字放在 on_screen_text。\n4. 角色出现时引用角色卡 id，不重新描述外观。\n5. 全片风格统一，遵循 style.visual。\n脚本：...\n角色卡：...\n风格：...\n```\n\n## 2.5 面向各模型的提示词结构\n\n| 目标模型 | 推荐结构 | 要点 |\n|---|---|---|\n| 图像（文生图） | 主体 + 细节 + 场景 + 风格/媒介 + 构图/镜头 + 光线 + 色彩 | 新一代模型更偏好自然语言长描述；需要文字时直接写出引号内的文字并检验 |\n| 负向提示 | 低质量、变形手、水印等 | 部分新模型（蒸馏/流匹配、guidance=0）不使用负向提示 |\n| 视频 | 主体 + **动作** + 场景 + 镜头运动 + 风格 + 节奏 | 动作要具体、单一；镜头运动用术语（push-in、pan left、orbit、static） |\n| 图生视频 | 只描述\"如何动\"，不重复描述画面内容 | 过度描述会和首帧冲突 |\n| 音乐 | 风格 + 乐器 + 情绪 + BPM + 结构（intro/loop） | 说明是否循环、是否无人声 |\n| TTS | 情绪/语速标签（模型支持时） | 以模型文档为准 |\n\n## 2.6 知识接入（RAG / 工具）\n\n- 讲解类内容的事实来源要**可追溯**：把资料放进 RAG 或 LLM-Wiki，脚本生成时带引用，审校阶段核对。\n- 用搜索/数据库工具取最新数据（价格、榜单、日期），不要让模型凭记忆写。\n- 在 Scene JSON 里保留 `sources`，成片描述里可输出参考来源。\n\n## 2.7 多语言与本地化\n\n| 项 | 做法 |\n|---|---|\n| 翻译 | LLM 翻译 + 术语表；保留数字、专有名词 |\n| 时长约束 | 目标语言语速不同，翻译后重新跑 TTS 并回填时长，必要时压缩文案 |\n| 字幕 | 每行 ≤ 2 行、每行 ≤ 约 16–20 个汉字或 42 个拉丁字符；阅读速度约 ≤ 17 字符/秒 |\n| 声音 | 每种语言选对应母语声音；克隆声音跨语言要单独评估 |\n| 画面文字 | 用模板渲染多语言版本，不要重新生图 |\n\n## 2.8 文本层评估与护栏\n\n| 维度 | 方法 |\n|---|---|\n| 结构合法 | schema 校验通过率 |\n| 事实性 | 引用核对；抽样人工；用检索结果做 faithfulness 检查 |\n| 时长合规 | 估算时长与目标偏差 ≤ 10% |\n| 口语化 | 抽样朗读测试（TTS 回听） |\n| 安全 | 输入/输出内容审核；敏感话题与人物规则（见第 13 章） |\n| 一致性 | 角色名、术语、数字前后一致（可脚本检查） |\n\n---\n\n# 3. ASR / STT 工作流\n\n> 命令以 macOS / Apple Silicon 为例（Metal/MLX 加速）。Linux + NVIDIA 环境可用 faster-whisper 等 CUDA 方案，流程与评估方法相同。\n\n\n## 3.1 目标与流程\n\n把语音转成**带时间戳、可检索、可校对**的文本。\n\n```\n原始音频/视频 → 抽音轨与标准化 → VAD 切分 → ASR 转写（带词/句时间戳）\n   → (可选) 说话人分离 → 后处理（标点、繁简、数字、专有名词纠错）\n   → LLM 清理/摘要/章节 → 输出（TXT/SRT/VTT/JSON）→ 入库（Wiki/向量库）\n```\n\n## 3.2 阶段 1：音频标准化\n\nASR 模型多数期望 **16 kHz、单声道、PCM**。先统一格式，后面所有工具都省心。\n\n```bash\n# 单文件\nffmpeg -i input.m4a -ar 16000 -ac 1 -c:a pcm_s16le out.wav\n\n# 批量（保留目录结构，输出到 wav/）\nfind raw -type f \\( -name \"*.m4a\" -o -name \"*.mp3\" -o -name \"*.mp4\" -o -name \"*.mov\" \\) -print0 |\nwhile IFS= read -r -d '' f; do\n  out=\"wav/$(basename \"${f%.*}\").wav\"; mkdir -p wav\n  ffmpeg -nostdin -y -i \"$f\" -vn -ar 16000 -ac 1 -c:a pcm_s16le \"$out\"\ndone\n\n# 响度归一化（EBU R128），录音音量忽大忽小时先做\nffmpeg -i in.wav -af loudnorm=I=-16:TP=-1.5:LRA=11 out.wav\n\n# 降噪（轻度）：ffmpeg afftdn；重度噪声用专用工具（见第 5 章）\nffmpeg -i in.wav -af afftdn=nf=-25 out.wav\n```\n\n质量检查：时长、峰值、是否静音/削波；统计表保存到 `manifest.csv`（文件、时长、采样率、LUFS）。\n\n## 3.3 阶段 2：VAD（语音活动检测）\n\n目的：切掉静音与噪声段，减少幻觉（Whisper 在长静音上会\"编\"文字）、提速、得到自然断句。\n\n| 工具 | 特点 |\n|---|---|\n| silero-vad | 轻量、准、CPU 即可；实时和离线都常用 |\n| WebRTC VAD | 极轻，精度较低 |\n| 模型内置 VAD（faster-whisper 的 `vad_filter`） | 省事 |\n\n参数起点：`threshold` 0.5；`min_silence_duration_ms` 500–700（会议）/ 300（对话）；`speech_pad_ms` 150–300；分段上限 30 s 内（Whisper 窗口）。\n\n## 3.4 阶段 3：模型选型\n\n| 模型 | 规模 | 语言 | 特点 | Mac 本地 |\n|---|---|---|---|---|\n| **Whisper large-v3-turbo** | 约 0.8B | 99+，含中文 | 通用默认；速度/精度平衡；MIT | whisper.cpp（Metal）、mlx-whisper，约 6 GB 内存 |\n| Whisper large-v3 | 约 1.55B | 99+ | 精度略高、更慢；长尾口音更稳 | 同上，内存更高 |\n| Distil-Whisper | 小 | 英文 | 英文长音频快 | 可用 |\n| **Parakeet TDT 0.6B v3** | 0.6B | 25 种欧洲语言（不含中文） | 极快、英文/欧语精度好、支持流式特性 | 需 MLX 移植或 NeMo；待核实各移植质量 |\n| Canary-Qwen 2.5B | 2.5B | 英文 | 榜单英文 WER 靠前；可接 LLM 做摘要 | 16 GB+，MLX/PyTorch |\n| **Qwen3-ASR** | 约 1.7B | 52 种，中文强 | 中文/多方言友好（待核实本地部署成熟度） | 多经 Transformers，Mac 速度需实测 |\n| Moonshine | 27M 起 | 英文 | 低延迟、小内存、适合流式/边缘 | 极轻 |\n\n选型决策：\n\n```\n中文/中英混合为主 ──► Whisper large-v3-turbo（最易部署）；追求更准再测 Qwen3-ASR\n纯英文、要最快或实时 ──► Parakeet / Moonshine\n纯英文、要最高精度 ──► Canary-Qwen\n内存只有 8–16 GB ──► Whisper turbo 量化\n```\n\n坑：Whisper 的\"中文\"输出可能是繁体或简体混杂；通过 `initial_prompt`（如\"以下是普通话的句子。\"）或后处理（OpenCC）统一。\n\n## 3.5 阶段 4：运行转写（Mac 命令）\n\n**方案 A：mlx-whisper（Python，Apple MLX 加速）**\n\n```bash\npip install mlx-whisper\nmlx_whisper wav/meeting.wav --model mlx-community/whisper-large-v3-turbo \\\n  --language zh --output-format srt --output-dir out/\n```\n\n```python\nimport mlx_whisper\nr = mlx_whisper.transcribe(\n    \"wav/meeting.wav\",\n    path_or_hf_repo=\"mlx-community/whisper-large-v3-turbo\",\n    language=\"zh\",\n    word_timestamps=True,\n    condition_on_previous_text=False,   # 降低长音频\"跑偏/重复\"风险\n    initial_prompt=\"以下是普通话的会议记录，包含 RAG、LoRA、向量数据库等术语。\",\n)\nfor seg in r[\"segments\"]:\n    print(f'{seg[\"start\"]:.1f}-{seg[\"end\"]:.1f} {seg[\"text\"]}')\n```\n\n**方案 B：whisper.cpp（C++，Metal，适合脚本/服务化）**\n\n```bash\nbrew install whisper-cpp\n# 下载模型（见 whisper.cpp 仓库 models/download-ggml-model.sh）\nwhisper-cli -m ggml-large-v3-turbo.bin -f wav/meeting.wav -l zh -osrt -otxt -of out/meeting\n```\n\n**方案 C：faster-whisper（CTranslate2，CPU/CUDA 为主）** 在 Mac 上通常不如 A/B 快，多用于跨平台一致性。\n\n## 3.6 阶段 5：说话人分离（Diarization）\n\n```python\n# pip install pyannote.audio ；需要 Hugging Face token 并接受模型使用条款\nfrom pyannote.audio import Pipeline\npipe = Pipeline.from_pretrained(\"pyannote/speaker-diarization-3.1\", use_auth_token=\"HF_TOKEN\")\ndiar = pipe(\"wav/meeting.wav\", min_speakers=2, max_speakers=6)\nturns = [(t.start, t.end, spk) for t, _, spk in diar.itertracks(yield_label=True)]\n```\n\n合并：按时间重叠把每个 ASR 句子分配给重叠最多的说话人；标注\"说话人 1/2\"，人工或 LLM 根据上下文命名。pyannote 在 Mac 上用 MPS/CPU，比实时慢；长音频先切段。\n\n## 3.7 阶段 6：后处理与 LLM 清理\n\n1. 繁简统一（OpenCC）、全半角、数字格式。\n2. **专有名词纠错表**（`glossary.yaml`）：把常见误识别（\"拉乌拉\"→\"LoRA\"）做替换，或把术语放进 `initial_prompt`。\n3. LLM 清理（本地 Ollama）：去口头禅、补标点、分段、生成章节标题与摘要。**约束：不得增删事实，保留时间戳**，输出 JSON：\n\n```json\n{\"chapters\":[{\"start\":0,\"end\":312,\"title\":\"...\",\"summary\":\"...\"}],\n \"action_items\":[\"...\"], \"entities\":[\"RAG\",\"LoRA\"], \"uncertain\":[{\"t\":125.4,\"text\":\"...\"}]}\n```\n\n4. 不确定片段（低置信度、声学重叠）标 `uncertain`，不要让 LLM\"脑补\"。\n\n## 3.8 流式（实时）ASR\n\n| 方式 | 说明 |\n|---|---|\n| VAD 分段 + 整句转写 | 最简单，延迟 = 一句话时长 + 推理时间 |\n| 滑窗 + 局部重写 | 体验好，需处理文本回退 |\n| 真流式模型（Parakeet 流式 / Moonshine / 云端流式） | 延迟最低，英文/欧语为主 |\n\n起点：每 200–500 ms 推送 PCM 块；服务端 VAD 判句尾后提交；展示\"临时结果（灰）→ 最终结果（黑）\"。\n\n## 3.9 评估\n\n| 指标 | 说明 |\n|---|---|\n| WER（词错误率） | 英文用；`jiwer` 计算 |\n| **CER（字错误率）** | **中文用**（无空格分词），同样 `jiwer` 对字符计算 |\n| 术语召回率 | 关键术语是否被正确转写（自建词表统计） |\n| RTF（实时因子） | 处理时长 / 音频时长，< 1 即快于实时 |\n| 说话人分离 DER | 有标注时用 |\n\n```python\nimport jiwer\nref = \"我们使用混合检索和重排序\"\nhyp = \"我们使用混合检索和重排\"\nprint(jiwer.cer(ref, hyp))   # 字错误率\n```\n\n做法：从自己的录音里抽 20–50 条（不同噪声、口音、语速），人工校对作 golden set；**每次换模型/参数都在同一集上回归**。\n\n## 3.10 排障\n\n| 症状 | 原因 | 对策 |\n|---|---|---|\n| 静音处出现幻觉文字/重复 | 无 VAD、`condition_on_previous_text` | 先 VAD；关闭条件前文；设置 `no_speech_threshold` |\n| 中文夹杂英文术语错 | 无上下文 | `initial_prompt` 放术语；glossary 纠错 |\n| 简繁混杂 | 模型输出不稳 | prompt 指定\"简体\"；OpenCC |\n| 长音频时间戳漂移 | 单次处理过长 | 分块（≤ 30 min）并加偏移量 |\n| 多人重叠说话漏字 | 模型限制 | 分离后分别转写；标注 uncertain |\n| 速度慢 | 模型大/未用 Metal | 换 turbo；确认用 MLX/Metal；批处理 |\n| 内存不足 | 与 LLM 同驻 | 转写完卸载模型再调 LLM |\n\n## 3.11 ASR 检查清单\n\n- [ ] 音频统一 16 kHz 单声道，`manifest.csv` 记录\n- [ ] VAD 切分；分块偏移量正确\n- [ ] 术语表 + initial_prompt；简繁统一\n- [ ] 输出含时间戳（SRT/VTT/JSON）\n- [ ] golden set 与 CER/WER 回归\n- [ ] 不确定片段标注，LLM 清理不改事实\n- [ ] 敏感录音本地处理，原始文件不可变存档\n\n---\n\n# 4. TTS 工作流\n\n## 4.1 目标与流程\n\n把文本变成**自然、可控、可商用（若需要）**的语音。\n\n```\n文本 → 规范化(数字/缩写/多音字) → 分句/分段 → 选声音与风格 → TTS 推理(流式或批量)\n   → 拼接(淡入淡出/停顿) → 后处理(降噪/响度/EQ) → 导出(wav/mp3) → 质量评估\n```\n\n## 4.2 阶段 1：文本规范化（决定 50% 的自然度）\n\n| 项 | 做法 |\n|---|---|\n| 数字/日期/单位 | \"2026-11-19\"→\"二零二六年十一月十九日\"；\"3.5\"→\"三点五\"；规则 + 库（中文可用 cn2an） |\n| 缩写/术语 | `glossary`：`RAG`→\"拉格\"或逐字母读；`LoRA`→\"洛拉\"；按你的听众约定 |\n| 多音字 | 用拼音标注或模型支持的发音标记；先小样本试听 |\n| 标点与停顿 | 逗号约 200–300 ms，句号约 500–700 ms；长句拆成 ≤ 40 字的短句 |\n| 中英混读 | 选真正支持混读的模型；否则按语言切段分别合成再拼接 |\n| 去 Markdown | 去掉 `#`、`*`、代码块、链接；代码块改为\"此处有一段代码，略\" |\n\n## 4.3 阶段 2：模型选型\n\n| 模型 | 规模 | 声音克隆 | 语言（中文） | 许可证（以模型卡为准） | Mac 备注 |\n|---|---|---|---|---|---|\n| **Kokoro-82M** | 82M | 否（预设声音） | 多语，含中文；英文最强 | Apache 2.0 | 极快，mlx-audio 支持；入门首选 |\n| **Qwen3-TTS** 0.6B / 1.7B | 0.6–1.7B | 是（约 3 秒参考音）；有\"文字描述造声\" | 10 种，含中文 | Apache 2.0 | 中文好；质量高但在 Mac 上较慢（有来源测得 RTF 约 0.2×，待核实） |\n| **Chatterbox** Turbo/Multilingual | 350M–500M | 是 | Turbo 仅英文；多语 23 种（中文需核实） | MIT | 支持 MPS；有水印（PerTh） |\n| Fish Audio S2 | 约 4–5B | 是 | 80+ 种 | 研究/非商用，商用需授权 | 约 11 GB 内存，16 GB+ |\n| SparkTTS | 0.5B | 是 | 中英 | 代码 Apache，权重 CC BY-NC-SA（非商用） | 学习可用 |\n| F5-TTS | 中等 | 是（参考音 + 文本） | 中英 | 代码 MIT，权重 CC BY-NC | 学习可用，商用不行 |\n| Piper | 小 | 否 | 44 个区域 | 引擎 GPL-3.0，各声音有自己的许可 | CPU 即可，音质一般 |\n| XTTS-v2 | — | 是 | 17 种 | 非商用，且 Coqui 已关闭 | 不建议新项目 |\n\n选型决策：\n\n```\n要中文、可商用、够快 ──► Kokoro（先试）→ 不够自然再上 Qwen3-TTS\n要克隆自己的声音 ──► Qwen3-TTS Base 或 Chatterbox（仅限你本人或有书面授权的声音）\n英文旁白、情感/笑声标签 ──► Chatterbox Turbo\n只做学习/研究、追求质量 ──► Fish S2 / F5-TTS（注意不可商用）\n```\n\n## 4.4 阶段 3：本地运行\n\n**mlx-audio（Apple MLX，一个包跑多个 TTS 模型）**\n\n```bash\npip install mlx-audio\n# 具体参数以 `python -m mlx_audio.tts.generate --help` 为准，版本间会有变化\npython -m mlx_audio.tts.generate \\\n  --model mlx-community/Kokoro-82M-bf16 \\\n  --text \"你好，这是一段本地合成的语音。\" \\\n  --voice zf_xiaobei --lang_code z \\\n  --file_prefix out/hello\n```\n\n> Kokoro 中文声音名与 `lang_code` 以模型卡/库文档为准；如果中文不理想，先试 Qwen3-TTS。\n\n**批量合成脚本骨架（分句 + 拼接 + 响度）**\n\n```python\nimport re, subprocess, pathlib\ndef split_sentences(text, max_len=60):\n    parts = re.split(r'(?<=[。！？；.!?])\\s*', text)\n    out, buf = [], \"\"\n    for p in parts:\n        if len(buf) + len(p) <= max_len: buf += p\n        else:\n            if buf: out.append(buf)\n            buf = p\n    if buf: out.append(buf)\n    return [s for s in out if s.strip()]\n\ndef synth(sentence, path):            # 替换为你选定模型的调用\n    raise NotImplementedError\n\ndef build(text, outdir=\"tts_out\"):\n    pathlib.Path(outdir).mkdir(exist_ok=True)\n    files = []\n    for i, s in enumerate(split_sentences(text)):\n        p = f\"{outdir}/{i:04d}.wav\"; synth(s, p); files.append(p)\n    pathlib.Path(f\"{outdir}/list.txt\").write_text(\"\".join(f\"file '{pathlib.Path(f).name}'\\n\" for f in files))\n    subprocess.run([\"ffmpeg\",\"-y\",\"-f\",\"concat\",\"-safe\",\"0\",\"-i\",f\"{outdir}/list.txt\",\n                    \"-af\",\"loudnorm=I=-16:TP=-1.5:LRA=11\", f\"{outdir}/final.wav\"], check=True)\n```\n\n## 4.5 声音克隆（安全第一）\n\n1. 只克隆**自己的声音**，或有**书面授权**的声音；不得冒充他人。\n2. 参考音要求：3–30 秒，安静、单人、无背景音乐、语速自然；多段混合效果更稳。\n3. 保存授权记录（谁、何时、用途、范围）到 `voice_consent/`。\n4. 生成内容标注\"AI 合成\"；保留水印（如 Chatterbox 的 PerTh）不要去除。\n5. 不用于诈骗、冒充、虚假新闻；平台条款与当地法律优先。\n\n## 4.6 流式 TTS（给语音 Agent 用）\n\n- 按句子/短语分块：LLM 一边生成文本，一边把\"完整的短句\"送入 TTS，不要等整段。\n- 首句尽量短（≤ 12 字）以压低首音延迟。\n- 播放端用环形缓冲，避免卡顿；收到\"用户打断\"信号时立即清空缓冲并取消合成。\n- 关注指标：**TTFA（首音频延迟）**、RTF、卡顿率。\n\n## 4.7 评估\n\n| 指标 | 做法 |\n|---|---|\n| 可懂度 | 用 ASR 回转写，算 CER（合成语音经 ASR 的字错率，越低越清晰） |\n| 自然度 MOS | 10 人以内小测，1–5 分，盲听、顺序随机 |\n| 说话人相似度 | 克隆时用声纹嵌入余弦相似度 + 人耳 |\n| 稳定性 | 100 句批量，统计跳字/重复/截断比例 |\n| 速度 | RTF、TTFA |\n\n## 4.8 排障\n\n| 症状 | 对策 |\n|---|---|\n| 数字/英文读错 | 文本规范化与 glossary |\n| 句尾突然截断 | 句子过长或模型最大长度；拆短 |\n| 机械感/无停顿 | 加标点、拆句、拼接时插入静音 |\n| 克隆不像 | 换更干净的参考音；延长到 10–20 秒；换模型 |\n| 速度慢 | 换小模型/量化；批处理；预热 |\n| 拼接处爆音 | 片段两端 10–20 ms 淡入淡出；统一采样率 |\n\n## 4.9 TTS 检查清单\n\n- [ ] 文本规范化 + 术语表；Markdown 清理\n- [ ] 模型许可证与用途匹配（商用/非商用）\n- [ ] 分句合成、拼接、响度归一化（约 -16 LUFS）\n- [ ] 克隆有授权记录，成品标注 AI 合成\n- [ ] 用 ASR 回测可懂度；小规模 MOS\n- [ ] 流式场景：TTFA、打断取消\n\n---\n\n# 5. 其他音频：降噪、分离、音乐、音效、混音\n\n## 5.1 音频处理全景\n\n```\n录音/素材 → 降噪 → 人声/伴奏分离 → (ASR/TTS 在第 3、4 章) → 音乐/音效生成 → 混音(ducking) → 响度标准化 → 导出\n```\n\n## 5.2 降噪与修复\n\n| 工具 | 类型 | 适合 |\n|---|---|---|\n| ffmpeg `afftdn` / `highpass` / `lowpass` | 传统滤波 | 稳态底噪（风扇、电流声）轻处理 |\n| RNNoise | 轻量神经网络降噪 | 实时、低开销 |\n| DeepFilterNet | 神经网络降噪（语音增强） | 离线/实时的语音降噪，效果好于传统滤波 |\n| 商用/云降噪 | 语音增强服务 | 质量要求高、不想自己维护时 |\n\n做法：先用高通（80–100 Hz）去低频噪声；稳态噪声用 `afftdn`；非稳态（键盘、人声背景）用神经网络降噪。**降噪过度会产生\"水声/金属声\"**，先在小样本上调强度，ASR 前的降噪不一定提升识别率，需实测。\n\n```bash\nffmpeg -i in.wav -af \"highpass=f=90,afftdn=nf=-25\" out.wav\n```\n\n## 5.3 人声/伴奏分离（stem separation）\n\n| 工具 | 说明 |\n|---|---|\n| Demucs（htdemucs 系列） | 开源分离人声/鼓/贝斯/其他，质量高 |\n| Spleeter | 较旧，速度快，质量一般 |\n| UVR 系列模型 | 社区常用的分离模型集合 |\n\n```bash\npip install demucs\ndemucs --two-stems=vocals -n htdemucs song.mp3     # 输出 vocals 与 no_vocals\n```\n\n用途：提取人声给 ASR；去人声做背景音乐；对生成音乐做后期；教学用分轨。注意版权：分离他人作品只用于个人学习，发布需有权利。\n\n## 5.4 音乐与音效生成\n\n| 类型 | 代表（以许可证与模型卡为准） | 备注 |\n|---|---|---|\n| 文生音乐（开源） | MusicGen（Meta，权重 CC-BY-NC，非商用）、Stable Audio Open（Stability 社区许可）、ACE-Step（宣称 Apache 2.0，待核实） | 开源模型时长/质量有限；商用先查许可证 |\n| 文生音乐（云服务） | Suno、Udio、ElevenLabs Music 等 | 质量高，含人声；注意各平台商用与版权条款 |\n| 音效 SFX | AudioGen/AudioLDM 类（开源）、ElevenLabs SFX 等（云） | 常用 Foley 音效更适合用授权音效库 |\n| 授权素材库 | Freesound（按许可证）、YouTube Audio Library、付费库 | 稳定、可商用、无生成不确定性 |\n\n选用原则：\n- **背景音乐**：时长长、需循环 → 生成 30–60 s 无人声音乐，裁剪循环；或直接用授权库。\n- **音效**：短、需精确同步 → 先找库，找不到再生成。\n- 所有生成音乐记录 `prompt、模型版本、seed、许可证`。\n\n## 5.5 混音：ducking（旁白时自动压低音乐）\n\n```bash\n# 音乐被旁白\"侧链压缩\"：旁白出现时音乐自动降低\nffmpeg -i voice.wav -i music.wav -filter_complex \\\n\"[1:a]volume=0.5[m];[m][0:a]sidechaincompress=threshold=0.03:ratio=8:attack=20:release=400[bg];\\\n[0:a][bg]amix=inputs=2:duration=first:dropout_transition=2,loudnorm=I=-16:TP=-1.5:LRA=11[out]\" \\\n-map \"[out]\" mix.wav\n```\n\n经验值：旁白 -16 LUFS 附近；音乐相对旁白低 14–20 dB；音效点缀不盖过旁白；结尾音乐淡出 1–2 s。\n\n## 5.6 响度标准\n\n| 场景 | 目标响度（集成） | 真峰值 |\n|---|---|---|\n| 播客/网络视频通用 | 约 -16 LUFS（立体声） | ≤ -1.5 dBTP |\n| 流媒体音乐平台（多数） | 约 -14 LUFS | ≤ -1 dBTP |\n| 广播（EBU R128） | -23 LUFS | ≤ -1 dBTP |\n\n各平台标准会调整，以平台最新规范为准；用 `ffmpeg loudnorm` 两遍法更精确（先测量再应用）。\n\n## 5.7 音频评估与排障\n\n| 项 | 方法 |\n|---|---|\n| 响度/峰值 | `ffmpeg -i f.wav -af ebur128=peak=true -f null -` |\n| 底噪/失真 | 频谱图检查（`sox in.wav -n spectrogram`）+ 耳测 |\n| 音乐-旁白遮蔽 | 用 ASR 转写混音后的音频，CER 明显升高说明音乐过响 |\n| 拼接爆音 | 片段首尾 10–20 ms 淡入淡出，统一采样率与声道 |\n| 口型/音画不同步 | 以音频时长为主轴排时间线（§9.3）|\n\n## 5.8 音频检查清单\n\n- [ ] 采样率统一（处理 16 kHz，成片 48 kHz）\n- [ ] 降噪强度经小样本验证\n- [ ] 音乐/音效有授权或生成记录\n- [ ] ducking 后旁白可懂度用 ASR 回测\n- [ ] 响度达标，真峰值不过载\n\n---\n\n# 6. 图像生成与编辑\n\n## 6.1 流程\n\n```\n需求 → 提示词/参考图 → 生成(草稿: 小分辨率/少步) → 选图 → 精修(img2img/inpaint/ControlNet)\n   → 放大/修复 → 抠图/合成 → 一致性检查 → 存档(记录 seed/参数)\n```\n\n## 6.2 模型家族\n\n| 类别 | 原理（简述） | 特点 |\n|---|---|---|\n| 扩散模型（SD 1.5/SDXL 等） | 从噪声逐步去噪，U-Net | 生态最大（LoRA、ControlNet、插件极多），对显存友好 |\n| 流匹配/DiT 类（FLUX、Qwen-Image、Z-Image、HunyuanImage 等） | Transformer 预测向量场 | 画质、文字渲染、指令遵循更强；显存需求更高，常配量化 |\n| 蒸馏/Turbo 版 | 4–8 步出图 | 草稿阶段极快；通常不用 negative prompt、guidance≈0–1 |\n| 闭源云服务 | 以 API/产品形式提供 | 综合质量与易用性好；受内容策略与条款约束 |\n\n## 6.3 开源模型速览（2026-11 检索，待核实）\n\n| 模型 | 规模（约） | 量化后显存（约） | 许可证 | 强项 |\n|---|---|---|---|---|\n| FLUX.2 [klein] 4B | 4B | 约 13 GB | Apache 2.0 | 极快，适合草稿与迭代 |\n| FLUX.2 [dev] | 32B | 约 32 GB（fp8） | 非商用 | 最高质量、多参考编辑 |\n| Qwen-Image 系列 | 约 7B+ | 约 8–12 GB（fp8） | Apache 2.0 | 中英文**文字渲染**好、可编辑 |\n| Z-Image Turbo | 约 6B | < 16 GB | Apache 2.0 | 8 步、速度快、省显存 |\n| HunyuanImage 3.0 | 80B MoE | 约 80 GB | 腾讯社区许可 | 复杂长提示 |\n| SDXL 1.0 | 3.5B | 约 6–8 GB | OpenRAIL++ | LoRA/ControlNet 生态最丰富 |\n\n不同来源对显存数据不一致（量化方式、分辨率不同），以自己机器实测为准。入门建议：**SDXL（生态）+ 一个新一代快速模型（Z-Image/FLUX.2 klein）**，对比提示遵循与速度。\n\n## 6.4 关键参数\n\n| 参数 | 含义 | 常用范围 | 调整方向 |\n|---|---|---|---|\n| steps | 去噪步数 | SDXL 20–35；Turbo 类 4–8 | 太少糊，太多收益递减 |\n| guidance / CFG | 提示词遵循强度 | SDXL 5–8；FLUX dev 约 3.5；Turbo 类 0–2 | 过高过饱和、伪影 |\n| sampler/scheduler | 采样算法 | DPM++ 2M Karras、Euler 等 | 影响细节与收敛，按模型推荐 |\n| seed | 随机种子 | 记录并可复用 | 固定 seed 复现；批量时 seed 递增 |\n| 分辨率 | 输出尺寸 | 按模型训练分辨率（SDXL 约 1024²） | 偏离训练尺寸易构图崩坏；高清走放大 |\n| denoise strength（img2img） | 保留原图的程度 | 0.3–0.7 | 越高变化越大 |\n\n## 6.5 控制与编辑\n\n| 能力 | 技术 | 用途 |\n|---|---|---|\n| 图生图 | img2img | 改风格/细节 |\n| 局部重绘 | inpainting/outpainting | 改局部、扩图 |\n| 结构控制 | ControlNet（姿态、边缘、深度、线稿） | 精确构图、角色姿势 |\n| 参考风格/人物 | IP-Adapter、参考式编辑模型 | 保持角色/风格一致 |\n| 指令式编辑 | 编辑模型（\"把背景改成夜晚\"） | 不写完整 prompt 的修改 |\n| 去背景/抠图 | rembg、BiRefNet 类 | 贴纸、分层合成 |\n| 放大 | Real-ESRGAN、模型自带放大 | 出图后 2×–4× |\n| 修脸/细节 | 局部重绘 + 面部修复 | 小脸崩坏 |\n\n## 6.6 LoRA：角色与风格（与《LLM 工作流手册》LoRA 章同原理）\n\n| 项 | 建议 |\n|---|---|\n| 数据 | 角色 15–40 张、风格 30–100 张；多角度、多光线、背景多样；统一裁剪 |\n| 标注 | 自动 caption（VLM）+ 人工修正；加触发词（如 `ohwx_char`） |\n| 参数起点 | rank 16–32，学习率约 1e-4（文本编码器可更低），步数按数据量 1000–3000 并看样图 |\n| 工具 | kohya-ss、ai-toolkit、diffusers 训练脚本、OneTrainer |\n| 验证 | 固定 seed 的验证提示集，每 N 步出图对比，过拟合表现为\"所有图长一样\" |\n| 风险 | 版权/肖像：只训练有权使用的图像和本人/授权人物 |\n\n## 6.7 运行方式\n\n**diffusers（Python）示例**（模型 ID 示意，使用前核对模型卡与许可证）：\n\n```python\nimport torch\nfrom diffusers import AutoPipelineForText2Image\n\ndevice = \"cuda\" if torch.cuda.is_available() else (\"mps\" if torch.backends.mps.is_available() else \"cpu\")\npipe = AutoPipelineForText2Image.from_pretrained(\n    \"black-forest-labs/FLUX.1-schnell\", torch_dtype=torch.bfloat16\n).to(device)\ng = torch.Generator(device=\"cpu\").manual_seed(42)\nimg = pipe(\"a flat-vector illustration of a robot reading a book, blue palette\",\n           num_inference_steps=4, guidance_scale=0.0, height=1024, width=1024, generator=g).images[0]\nimg.save(\"out.png\")\n```\n\n**ComfyUI**：节点图工作流，保存为 JSON，可通过 API 调用（`/prompt` 提交工作流，轮询 `/history`）。适合把\"生成→放大→抠图\"固化成可复用管线，并可作为服务的后端。\n\n**桌面/应用**：Draw Things（macOS/iOS）、InvokeAI 等，适合交互探索。\n\n## 6.8 角色一致性的实用方案（由易到难）\n\n1. 固定 style 字符串 + 固定角色描述模板（文本层统一）。\n2. 参考图 + IP-Adapter/参考式编辑模型。\n3. 先生成\"角色设定图\"（多视角），后续镜头以其为参考。\n4. 训练角色 LoRA。\n5. 用 I2V（图生视频）从同一张首帧出发，降低跨帧漂移。\n\n## 6.9 评估\n\n| 维度 | 方法 |\n|---|---|\n| 提示遵循 | 人评 + VLM 判分（\"图中是否包含 X\"清单化） |\n| 美学/质量 | 人评打分；美学预测模型作粗筛 |\n| 文字正确率 | OCR 比对期望文字 |\n| 一致性 | 角色特征清单人评；人脸/特征嵌入相似度 |\n| 速度/成本 | 秒/张、显存峰值 |\n\n## 6.10 排障\n\n| 症状 | 对策 |\n|---|---|\n| 手/多肢体畸形 | 换更强模型；inpaint 局部重绘；ControlNet 约束姿势 |\n| 画面文字乱码 | 换文字渲染强的模型；或用代码叠加文字 |\n| 构图崩坏 | 用训练分辨率生成再放大；调整宽高比到模型支持范围 |\n| 过饱和/油腻 | 降 CFG；换采样器 |\n| 风格不一致 | 统一 style、用风格 LoRA、统一后期调色 |\n| 显存不足 | 量化版（fp8/GGUF）、模型 CPU offload、降分辨率、分块放大 |\n\n## 6.11 图像检查清单\n\n- [ ] 草稿（小分辨率/少步）→ 精修（高质量参数）两阶段\n- [ ] 每张图记录模型、版本、prompt、seed、步数、CFG\n- [ ] 一致性方案已选定（参考图/LoRA/首帧链）\n- [ ] 画面文字由代码渲染或 OCR 校验\n- [ ] 许可证与内容审核通过\n\n---\n\n# 7. 视频生成\n\n## 7.1 原理速览\n\n主流开源视频模型是**视频扩散 Transformer（DiT）**：在压缩的时空潜空间里对一小段（几秒、几十到上百帧）视频整体去噪。关键约束：\n- **时长短**：单次通常 3–10 秒；更长靠拼接、延长（extend）、首尾帧链式生成。\n- **算力重**：显存与时间随分辨率×帧数快速增长。\n- **一致性有限**：跨镜头角色/场景要靠首帧、参考图、LoRA 控制。\n\n## 7.2 任务类型\n\n| 任务 | 输入 | 说明 |\n|---|---|---|\n| 文生视频 T2V | 文本 | 创意探索；一致性最难控 |\n| **图生视频 I2V** | 首帧图 + 文本（描述怎么动） | **最常用**：先用图像阶段锁定画面，再让它动 |\n| 首尾帧 | 首帧 + 尾帧 | 控制镜头起止，便于镜头衔接 |\n| 参考生视频 | 角色/物体参考图 | 保持主体一致（模型支持时） |\n| 视频生视频 V2V | 视频 + 文本 | 风格化、编辑 |\n| 视频延长 | 末尾几帧 | 做长镜头 |\n| 口型驱动 | 人像 + 音频 | 见第 8 章 |\n| 带声音的视频 | 文本/图 | 部分新模型同步生成音频（待核实各版本） |\n\n## 7.3 模型速览（2026-11 检索，待核实）\n\n| 模型 | 版本/规模 | 显存（约） | 分辨率/时长 | 许可证 | 备注 |\n|---|---|---|---|---|---|\n| Wan 2.2 TI2V-5B（阿里） | 5B | 约 8 GB（量化+卸载更低） | 720p/24fps/约 5 s | Apache 2.0 | 本地入门首选；T2V+I2V |\n| Wan 2.2 14B（MoE） | 14B | GGUF Q4/Q5 约 6–16 GB；FP16 50 GB+ | 480p/720p/约 5 s | Apache 2.0 | 质量更好，更慢 |\n| LTX-2.x（Lightricks） | 视版本 | FP8 720p 约 16 GB；Q4 约 10 GB | 可到 4K，几秒到更长 | Lightricks 社区许可（有收入门槛，待核实） | 速度快，适合迭代；部分版本带同步音频 |\n| HunyuanVideo 1.5（腾讯） | 8.3B | 约 24 GB；卸载后约 14 GB | 720p/5–10 s | 腾讯社区许可（待核实） | 画质好 |\n| CogVideoX 2B/5B | 2–5B | 约 12–18 GB | 480p 起/约 6 s | 以模型卡为准 | 较老，生态成熟 |\n| Mochi 1 | — | 约 17–20 GB | 480p/约 5 s | Apache 2.0 | 较老 |\n| 闭源云服务（Veo、Sora、Kling、Runway、Luma、海螺、Seedance 等） | — | — | 通常更高画质/更长/带音频 | 各平台条款 | 质量上限与易用性最好；按秒/按次计费 |\n\n提示：某些较新版本（如 Wan 2.5/2.6）只提供云 API 而无开源权重，需区分\"可本地跑的版本\"和\"仅 API 的版本\"。**在 Apple Silicon 上，这些模型的可用性和速度需要实测**，通常显著慢于同级 NVIDIA 显卡，适合短实验或离线批处理；正式产出常用云 API 或租用 GPU。\n\n参考速度（RTX 4090、约 5 秒片段，来自单一来源，仅作数量级）：LTX 秒级；Hunyuan 蒸馏版约 75 s；Wan 5B 约 2–4 分钟；Wan 14B 约 4–8 分钟；CogVideoX 5B 约 15 分钟。\n\n## 7.4 标准工作流（推荐：先图后视频）\n\n```\n分镜 → 每镜头先生成\"首帧图\"（第 6 章，可挑选/重绘）→ 审批 → I2V（只写动作+镜头运动）\n   → 选片 → 后处理(放大/插帧/去闪烁/调色) → 按配音时长裁剪 → 合成\n```\n\n优点：画面在便宜的图像阶段就确定，视频阶段只做\"动\"；一致性和成本都更可控。\n\n镜头时长规划：每镜头 3–6 秒；成片节奏 = 旁白句子切分；长镜头用\"首尾帧链\"：上一镜尾帧作下一镜首帧。\n\n## 7.5 视频提示词要点\n\n```\n[主体] 一个穿蓝色外套的机器人\n[动作] 缓慢抬起头，看向镜头，然后微笑\n[场景] 安静的图书馆，窗边有光\n[镜头] 缓慢推近 (slow push-in)，浅景深，稳定器拍摄\n[风格] 柔和电影感，暖色调，24fps\n[约束] 动作自然，主体不变形，背景稳定\n```\n\n- **一镜一动作**：多个动作容易崩。\n- 镜头运动词：static、push-in、pull-out、pan left/right、tilt up/down、orbit、tracking。\n- I2V 中不要重复描述首帧里已有的内容，只写变化。\n- 速度词（slowly、gently）能减少抖动和形变。\n- 负向提示：模型支持时用，如\"模糊、变形、闪烁、文字、水印\"。\n\n## 7.6 后处理\n\n| 步骤 | 工具 | 说明 |\n|---|---|---|\n| 放大 | Real-ESRGAN/视频放大模型、模型自带 upscaler | 480p→1080p，先放大再插帧通常更稳 |\n| 插帧 | RIFE、GIMM-VFI | 16→24/30 fps，更流畅；快速运动会有伪影 |\n| 去闪烁 | 时序滤波（如 ffmpeg `deflicker`）、专用模型 | 生成视频常见亮度抖动 |\n| 调色统一 | LUT、`colorbalance`、`eq` | 多镜头色调匹配 |\n| 稳定 | `vidstab` | 抖动镜头 |\n| 变速/裁剪 | ffmpeg `setpts`、`-t` | 对齐旁白时长 |\n\n```bash\n# 变速到目标时长（示例：把 5.0 s 片段拉成 4.2 s，即加速 1.19 倍）\nffmpeg -i clip.mp4 -filter:v \"setpts=PTS/1.19\" -an clip_fit.mp4\n```\n\n## 7.7 迭代与成本策略\n\n1. **低成本探索**：小分辨率、少步数、快模型（如 LTX 类）测提示词和镜头。\n2. 选定后再用高质量参数/大模型生成终稿。\n3. 固定 seed 复现；记录全部参数。\n4. 每镜头生成 2–4 个候选，自动/人工挑选；自动挑选可用 VLM 评分（是否按提示动作、是否变形）。\n5. 云 API 按秒计费：先用最短时长、最低分辨率验证。\n\n## 7.8 评估\n\n| 维度 | 方法 |\n|---|---|\n| 动作遵循 | 人评或 VLM 抽帧判断 |\n| 主体一致性 | 首/中/尾帧特征相似度；人评 |\n| 时序稳定 | 光流/帧间差异；闪烁统计；人评 |\n| 物理合理性 | 人评（穿模、肢体、物体消失） |\n| 画质 | 人评；放大后细节 |\n| 成本 | 每可用秒成本 = 总花费 / 通过 QA 的秒数 |\n\n## 7.9 排障\n\n| 症状 | 对策 |\n|---|---|\n| 主体变形/融化 | 缩短时长、简化动作、降低运动幅度；换更强模型；用首尾帧约束 |\n| 镜头乱动 | 明确\"static camera\"或指定一种运动 |\n| 首帧与结果脱节 | I2V 提示不要冲突描述；降低 CFG/运动强度 |\n| 闪烁/色偏 | 去闪烁 + 统一调色；固定 seed |\n| 显存不足 | 量化 GGUF/FP8、降分辨率、减帧数、模型卸载、分段生成 |\n| 太慢 | 草稿用快模型；分布式到云 GPU；缓存复用 |\n| 文字/Logo 崩坏 | 视频里不要生成文字，后期叠加 |\n\n## 7.10 视频检查清单\n\n- [ ] 先图后视频；首帧审批通过\n- [ ] 每镜头只一个动作和一种镜头运动\n- [ ] 草稿→终稿两阶段；候选数与挑选规则明确\n- [ ] 后处理链（放大/插帧/去闪/调色）固定并版本化\n- [ ] 镜头时长按配音回填\n- [ ] 许可证、肖像、内容审核通过\n\n---\n\n\n# 8. 动画与仿真\n\n## 8.1 \"动画\"的四种含义（先分清，再选技术）\n\n| 类型 | 例子 | 推荐技术 | 特点 |\n|---|---|---|---|\n| A. 讲解/信息动画 | 概念图解、流程动画、数据图表、公式推导、字幕动效 | **Manim**、**Remotion**、Motion Canvas、Lottie | 代码生成、精确、可复现、文字清晰 |\n| B. 仿真/可视化动画 | 物理仿真、算法执行、梯度下降、粒子、天体、数据随时间变化 | matplotlib.animation、Manim、p5.js、three.js、Matter.js/Rapier、Blender 物理、Taichi | 由**模型/规则驱动**，画面是计算结果，不是\"生成\"的 |\n| C. 角色动画 | 会说话的头像、虚拟主播、2D/3D 角色动作 | 口型驱动模型（Wav2Lip、MuseTalk、LivePortrait 等）、Live2D/Spine、Blender+动作库、云端数字人服务 | 口型/表情/动作与音频同步 |\n| D. 模型生成的动画/动态画面 | 风格化短片、动漫风镜头、微动 | I2V/T2V（第 7 章）、AnimateDiff 类 | 创意性强，可控性和一致性较弱 |\n\n选择规则：**需要精确、含文字/公式/数据的 → A/B（代码）；需要人物和表演 → C；需要创意画面 → D。** 多数商业讲解类视频以 A + 少量 D 组合最稳。\n\n## 8.2 代码即动画（Code-as-Animation）：最适合 Skills 的路线\n\nLLM 生成**动画代码**（Manim/Remotion/p5/three.js），再由渲染器确定性地输出视频：\n\n```\n脚本/分镜 → LLM 生成场景代码 → 渲染(沙箱) → 自动检查(能否运行/时长/截图) → 失败则把错误回传 LLM 修复 → 通过 → 入时间线\n```\n\n优点：可复现、可编辑（改代码即可）、没有乱码文字、版本可 diff、成本低。\n风险：LLM 代码可能不能运行或画面重叠；必须**沙箱执行**、限时、限资源，并做渲染后的截图检查（VLM 或规则检查元素是否出界/重叠）。\n\n修复循环骨架：\n\n```python\ndef render_with_repair(spec, max_try=3):\n    code = llm_generate_code(spec)\n    for i in range(max_try):\n        ok, log, video = run_in_sandbox(code, timeout=180)     # 容器/资源限制/禁网\n        if ok and check_frames(video, spec):                   # 抽帧检查：非空、无越界、时长≈目标\n            return video\n        code = llm_fix_code(code, error_log=log, issues=check_report)\n    raise RuntimeError(\"动画渲染失败，转人工\")\n```\n\n## 8.3 Manim：数学/概念讲解动画\n\nManim Community Edition（MIT 许可）。适合公式、图形变换、函数图像、算法图解。\n\n```bash\npip install manim              # 需要系统装 ffmpeg 与 LaTeX（公式渲染，可选）\nmanim -pql scene.py Intro      # -pql 低质量预览；-pqh 高质量\n```\n\n```python\nfrom manim import *\n\nclass Intro(Scene):\n    def construct(self):\n        title = Text(\"RAG = Retrieval + Generation\", font_size=40)\n        self.play(Write(title)); self.wait(0.5)\n        self.play(title.animate.to_edge(UP))\n        box_q = RoundedRectangle(width=2.5, height=1, corner_radius=0.2).shift(LEFT*4)\n        box_r = RoundedRectangle(width=2.5, height=1, corner_radius=0.2)\n        box_g = RoundedRectangle(width=2.5, height=1, corner_radius=0.2).shift(RIGHT*4)\n        labels = VGroup(Text(\"Query\").move_to(box_q), Text(\"Retrieve\").move_to(box_r), Text(\"Generate\").move_to(box_g))\n        self.play(Create(box_q), Create(box_r), Create(box_g), FadeIn(labels))\n        self.play(GrowArrow(Arrow(box_q.get_right(), box_r.get_left())), GrowArrow(Arrow(box_r.get_right(), box_g.get_left())))\n        self.wait(1)\n```\n\n与旁白同步：先算出每句旁白时长（TTS 回填），在代码里用 `self.wait(t)` 或给 `play(..., run_time=t)`，使动画节拍匹配音频。\n\n## 8.4 Remotion：用 React 做视频\n\n适合\"产品演示/信息图/字幕动效/多比例模板化\"。视频是 React 组件，随帧号变化。\n\n```bash\nnpx create-video@latest          # 初始化项目\nnpx remotion studio              # 预览\nnpx remotion render src/index.ts MyComp out/video.mp4\n```\n\n```tsx\nimport {AbsoluteFill, interpolate, useCurrentFrame, useVideoConfig, Audio, staticFile} from \"remotion\";\n\nexport const MyComp: React.FC<{title: string}> = ({title}) => {\n  const frame = useCurrentFrame();\n  const {fps} = useVideoConfig();\n  const opacity = interpolate(frame, [0, fps * 0.5], [0, 1], {extrapolateRight: \"clamp\"});\n  const y = interpolate(frame, [0, fps * 0.5], [30, 0], {extrapolateRight: \"clamp\"});\n  return (\n    <AbsoluteFill style={{background: \"#0b1220\", justifyContent: \"center\", alignItems: \"center\"}}>\n      <h1 style={{color: \"white\", fontSize: 72, opacity, transform: `translateY(${y}px)`}}>{title}<\/h1>\n      <Audio src={staticFile(\"narration.wav\")} />\n    <\/AbsoluteFill>\n  );\n};\n```\n\n要点：\n- 输入是 **props（JSON）**，所以天然适合从 Scene JSON 渲染：同一模板换数据即可出多语言/多比例版本。\n- 字幕可用 ASR 的词级时间戳驱动逐字高亮。\n- 许可：Remotion 对一定规模的商业使用有公司许可条款（以官方许可页为准，待核实）。同类开源替代：Motion Canvas。\n\n## 8.5 仿真与可视化动画\n\n仿真动画的画面**由计算产生**，不是生成式模型，可以严格正确。常见做法：\n\n| 技术 | 场景 | 输出方式 |\n|---|---|---|\n| matplotlib.animation | 数据随时间变化、梯度下降、简单物理 | `FuncAnimation.save(\"x.mp4\", writer=\"ffmpeg\")` |\n| Manim | 数学/算法可视化 | 直接出视频 |\n| p5.js / Canvas / three.js | 交互式网页动画、3D 场景 | 网页实时展示；用无头浏览器逐帧截图再合成视频 |\n| Matter.js / Rapier | 2D/3D 刚体物理 | 同上 |\n| Blender（bpy，Python 脚本） | 3D 物理/相机动画、渲染 | 命令行 `blender -b scene.blend -P render.py` |\n| Taichi/NumPy | 流体、粒子、元胞自动机 | 逐帧数组→图片→ffmpeg |\n\n示例：matplotlib 画梯度下降并导出视频：\n\n```python\nimport numpy as np, matplotlib.pyplot as plt\nfrom matplotlib.animation import FuncAnimation, FFMpegWriter\n\nf  = lambda x, y: x**2 + 3*y**2\ngx = lambda x, y: 2*x\ngy = lambda x, y: 6*y\npts, (x, y), lr = [], (3.0, 2.0), 0.15\nfor _ in range(60):\n    pts.append((x, y)); x, y = x - lr*gx(x, y), y - lr*gy(x, y)\npts = np.array(pts)\n\nfig, ax = plt.subplots(figsize=(6, 6))\nX, Y = np.meshgrid(np.linspace(-4, 4, 200), np.linspace(-3, 3, 200))\nax.contour(X, Y, f(X, Y), levels=20)\n(dot,) = ax.plot([], [], \"ro\"); (trail,) = ax.plot([], [], \"r-\", lw=1)\ndef update(i):\n    dot.set_data([pts[i, 0]], [pts[i, 1]]); trail.set_data(pts[:i+1, 0], pts[:i+1, 1]); return dot, trail\nanim = FuncAnimation(fig, update, frames=len(pts), interval=60)\nanim.save(\"gd.mp4\", writer=FFMpegWriter(fps=24))\n```\n\n**让 LLM 参与仿真动画**：LLM 负责\"把想法写成仿真代码和参数\"，物理/数学结果由代码保证正确；渲染后用抽帧检查元素是否越界、是否静止（常见 bug：忘了更新状态）。\n\n## 8.6 角色动画：说话人像与口型驱动\n\n| 方案 | 说明 | 注意 |\n|---|---|---|\n| 口型驱动（音频 + 人像 → 说话视频） | Wav2Lip、MuseTalk、SadTalker、LivePortrait 等（开源，权重许可各异）；云端数字人服务（HeyGen、D-ID、Synthesia 等） | 开源方案画质/稳定性差异大；商用查许可证 |\n| 视频模型的音频驱动/口型 | 部分视频模型支持音频条件 | 以版本说明为准 |\n| 2D 骨骼/Live2D/Spine | 把角色拆成部件做骨骼动画，音频驱动嘴型参数（viseme） | 制作成本高但可控、稳定、风格统一 |\n| 3D 角色（Blender/Unity/Three.js + Mixamo/动作库） | 文本→动作模型（text-to-motion）可作辅助 | 管线长，适合游戏/长期角色 |\n\n口型数据流：`TTS 音频 →（强制对齐/viseme 提取）→ 嘴型曲线 → 驱动 2D/3D 角色`。若 TTS 引擎输出音素时间戳，直接用；否则用强制对齐工具（如 Montreal Forced Aligner、WhisperX）。\n\n**合规**：数字人/换脸/声音克隆必须有肖像与声音授权，成片披露 AI 生成（见第 13 章）。\n\n## 8.7 网页端/产品内的微动画\n\n| 技术 | 用途 |\n|---|---|\n| CSS/WAAPI、GSAP | 界面动效 |\n| Lottie（JSON 矢量动画，由 After Effects 导出） | 轻量图标/插画动画 |\n| Rive | 带状态机的交互动画 |\n| Canvas/WebGL/three.js | 交互式 3D/粒子 |\n\nLLM 生成 Lottie JSON 的可靠性较低；更稳妥的是让 LLM 生成 CSS/GSAP/SVG 代码，或使用现成 Lottie 资源再参数化。\n\n## 8.8 音频驱动动画（与时间线对齐）\n\n```\n旁白音频 → ASR/强制对齐得到词级时间戳 → 生成关键帧时间点 → 动画在这些时间点触发\n```\n\n- 关键词出现时弹出图标/文字；章节切换对应场景切换。\n- 字幕逐字高亮：用词级时间戳生成 ASS 字幕（`\\k` 卡拉 OK 标签）或 Remotion 组件。\n- 音乐节拍驱动：节拍检测（librosa `beat_track`）→ 镜头切换点。\n\n## 8.9 排障\n\n| 症状 | 对策 |\n|---|---|\n| LLM 生成的动画代码报错 | 把完整 traceback 回传修复；限制可用 API 范围；提供可运行的模板/示例 |\n| 元素重叠/出界 | 用布局原语（`arrange`、`next_to`、网格），渲染后检测包围盒 |\n| 文字太小/太快 | 规定最小字号与最短显示时长（≥ 阅读时间） |\n| 动画与旁白错位 | 以 TTS 实际时长回填，再生成/调整动画 `run_time` |\n| 渲染慢 | 低质量预览 → 终稿；并行渲染分段；缓存未变化的场景 |\n| 仿真数值发散 | 减小步长；换稳定积分器；加边界条件 |\n| 口型不同步 | 检查音视频偏移；统一帧率；用强制对齐数据 |\n\n## 8.10 动画检查清单\n\n- [ ] 先判断属于 A/B/C/D 哪类，选对技术\n- [ ] 代码动画在沙箱渲染，有超时与资源限制\n- [ ] 渲染后自动检查（非空、越界、时长）\n- [ ] 动画节拍由旁白时长/时间戳驱动\n- [ ] 角色/肖像/声音有授权，成片披露 AI 生成\n\n---\n\n# 9. 合成与后期\n\n## 9.1 时间线模型\n\n最小时间线 = 若干**轨道**，每个轨道有若干**条目**（素材 + 入点/出点 + 位置 + 效果）。\n\n```json\n{\"fps\": 30, \"size\": [1920, 1080],\n \"tracks\": [\n  {\"type\": \"video\", \"items\": [{\"src\": \"clip_s1_1.mp4\", \"start\": 0.0, \"dur\": 4.2, \"trim_in\": 0.0}]},\n  {\"type\": \"voice\", \"items\": [{\"src\": \"tts_s1.wav\", \"start\": 0.0}]},\n  {\"type\": \"music\", \"items\": [{\"src\": \"bgm.wav\", \"start\": 0.0, \"gain_db\": -18, \"ducking\": true}]},\n  {\"type\": \"subtitle\", \"items\": [{\"src\": \"s1.srt\"}]}\n ]}\n```\n\n实现选择：**ffmpeg 命令**（轻量、最稳）、**MoviePy**（Python 编程式剪辑）、**Remotion**（React 模板，复杂动效）、桌面剪辑软件导入（EDL/XML，供人工精修）。\n\n## 9.2 以音频为主轴的时长规则\n\n1. 先合成全部旁白 → 得到每句**真实时长** d。\n2. 每个镜头时长 = d + 前后留白（如 0.2–0.4 s）。\n3. 视频/动画素材按目标时长处理：略长则裁剪，略短则慢放（≤ 15%）、定格最后一帧或循环；差距大则重新生成该镜头。\n4. 回填 `shot.duration_s`，再做合成。\n\n## 9.3 ffmpeg 常用配方\n\n```bash\n# 1) 拼接同规格片段（先统一编码参数，再 concat）\nprintf \"file '%s'\\n\" clip1.mp4 clip2.mp4 clip3.mp4 > list.txt\nffmpeg -f concat -safe 0 -i list.txt -c copy joined.mp4\n\n# 2) 交叉淡化转场（xfade，示例 0.5s，offset 为第一段时长减去转场）\nffmpeg -i a.mp4 -i b.mp4 -filter_complex \"xfade=transition=fade:duration=0.5:offset=3.5\" out.mp4\n\n# 3) 静态图 + 音频 → 视频（带轻微缩放 Ken Burns）\nffmpeg -loop 1 -i img.png -i voice.wav -vf \"zoompan=z='min(zoom+0.0008,1.1)':d=125:s=1920x1080,format=yuv420p\" \\\n  -shortest -c:v libx264 -c:a aac out.mp4\n\n# 4) 视频换音轨/混音轨\nffmpeg -i video.mp4 -i mix.wav -map 0:v -map 1:a -c:v copy -c:a aac -shortest out.mp4\n\n# 5) 烧录字幕（SRT）\nffmpeg -i in.mp4 -vf \"subtitles=sub.srt:force_style='FontName=Noto Sans CJK SC,FontSize=22,Outline=2'\" out.mp4\n\n# 6) 统一画幅（等比缩放 + 补边）\nffmpeg -i in.mp4 -vf \"scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1\" out.mp4\n\n# 7) 竖屏 9:16 裁切（居中）\nffmpeg -i in.mp4 -vf \"crop=ih*9/16:ih,scale=1080:1920\" out_vertical.mp4\n\n# 8) 查看媒体信息 / 质检\nffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of json in.mp4\n```\n\n## 9.4 字幕\n\n| 步骤 | 说明 |\n|---|---|\n| 来源 | 直接用脚本（最准）+ 强制对齐得到时间；或对成片音频做 ASR |\n| 断句 | 每条 ≤ 2 行；中文每行 ≤ 约 16–20 字；每条显示 ≥ 1 s，≤ 约 7 s；阅读速度 ≤ 约 17 字符/秒 |\n| 格式 | SRT/VTT（通用）；ASS（样式、逐字高亮） |\n| 多语言 | 每种语言单独字幕文件；CJK 需指定含字形的字体 |\n| 校对 | 术语表比对；与旁白逐句核对 |\n\n## 9.5 导出规格\n\n| 用途 | 画幅 | 分辨率 | 编码建议 |\n|---|---|---|---|\n| 横屏视频网站 | 16:9 | 1920×1080 | H.264（libx264）`-pix_fmt yuv420p -crf 18~23`，AAC 48 kHz 128–192 kbps |\n| 竖屏短视频 | 9:16 | 1080×1920 | 同上 |\n| 方形 | 1:1 | 1080×1080 | 同上 |\n| 网页播放 | — | — | 加 `-movflags +faststart`（边下边播） |\n| 母带/存档 | — | 原分辨率 | ProRes 或高码率 H.264/H.265 |\n\n各平台具体码率、时长、封面规范会更新，以平台最新文档为准。\n\n## 9.6 合成阶段的自动 QA\n\n| 检查 | 方法 |\n|---|---|\n| 时长与旁白一致 | `ffprobe` 对比音视频流时长，偏差 < 0.1 s |\n| 响度 | `ebur128` 测量是否在目标范围 |\n| 黑帧/冻结帧/静音 | `blackdetect`、`freezedetect`、`silencedetect` |\n| 字幕越界/遮挡 | 抽帧 + 规则/VLM 检查 |\n| 音画同步 | 抽样检查关键词出现时刻与画面事件 |\n| 文件规范 | 编码、分辨率、帧率、像素格式 |\n\n```bash\nffmpeg -i final.mp4 -vf \"blackdetect=d=0.3:pix_th=0.05,freezedetect=n=-60dB:d=1\" -af \"silencedetect=n=-50dB:d=1\" -f null - 2>&1 | grep -E \"black_|freeze_|silence_\"\n```\n\n## 9.7 合成检查清单\n\n- [ ] 以旁白时长为主轴回填镜头时长\n- [ ] 所有片段统一分辨率/帧率/像素格式再拼接\n- [ ] 字幕断句与样式符合规范，CJK 字体可用\n- [ ] 混音 ducking + 响度达标\n- [ ] 自动 QA（黑帧/冻结/静音/时长）通过\n- [ ] 导出多比例、`faststart`、写入 AI 生成元数据\n\n---\n\n# 10. 编排：工作流、Agent、Skills 与 MCP\n\n## 10.1 三种编排方式\n\n| 方式 | 说明 | 适合 | 风险 |\n|---|---|---|---|\n| **固定工作流（DAG）** | 步骤、依赖、重试都预先定义 | **生产环境主干**：可预测、可审计、可恢复 | 灵活性低 |\n| **Agent（LLM 动态决策）** | LLM 决定下一步调用哪个工具 | 探索、开放任务、人机协作创作 | 成本和行为不确定；需预算与护栏 |\n| **混合** | 工作流负责主干，节点内部可用 Agent 做局部决策（如\"修复动画代码\"\"挑选候选\"） | 多数多媒体应用的最佳形态 | 需要清晰边界 |\n\n经验法则：**能写成固定流程的就写成固定流程；只在\"需要判断/修复/创意\"的节点放 Agent。**\n\n## 10.2 工作流引擎选择\n\n| 引擎 | 特点 | 适合 |\n|---|---|---|\n| Temporal | 持久化执行、重试、长流程、可恢复 | 生产级长任务（视频渲染） |\n| Prefect / Dagster / Airflow | 数据/批处理编排，UI 友好 | 批量内容生产、定时任务 |\n| Celery/RQ/BullMQ + Redis | 简单任务队列 | 小团队、MVP |\n| Inngest / Trigger.dev | 事件驱动 serverless 工作流 | Node/TS 技术栈 |\n| ComfyUI 节点图 | 生成工作流可视化，API 可调用 | 图像/视频生成子流程 |\n| n8n 等低代码 | 连接外部服务 | 轻量自动化、原型 |\n| LangGraph 等 | LLM Agent 状态机 | Agent 节点内部 |\n\n## 10.3 Agent 工具设计原则（多媒体场景）\n\n1. **工具返回资产 ID 和摘要，不返回二进制/大文本**（避免撑爆上下文）：`{\"asset_id\": \"img_0011\", \"preview\": \"...\", \"meta\": {...}}`。\n2. **长任务异步**：工具提交任务返回 `job_id`，另一个工具查询状态；或工具内部阻塞等待并设超时。\n3. **幂等与缓存**：相同参数返回同一资产，避免 Agent 重复生成烧钱。\n4. **预算护栏**：每次任务设最大调用数、最大花费、最大时长；超限需人工批准。\n5. **审批点**：脚本、分镜、首帧三个节点暂停等人确认。\n6. **参数小而明确**：给枚举与默认值，避免让模型填几十个自由参数。\n7. **错误可行动**：错误信息说明原因与修复建议（\"分辨率不被支持，可选 1024x1024/…\"）。\n\n## 10.4 Skills：把\"可复用做法\"封装成能力\n\n**Skill** = 一个文件夹，包含说明文件（`SKILL.md`，带 YAML 头部：`name`、`description`）以及可选的脚本、模板、参考资料。Agent 先只看到每个 Skill 的名称与描述，**需要时才加载正文和附带文件**（渐进披露），因此可以放很多 Skill 而不占满上下文。\n\n目录示例：\n\n```\nskills/\n└── storyboard/\n    ├── SKILL.md              # 何时用、步骤、约束、输出格式\n    ├── schema/scene.json     # 输出 schema\n    ├── templates/prompt.md   # 提示词模板\n    ├── scripts/validate.py   # 校验脚本（确定性）\n    └── examples/             # 好/坏样例\n```\n\n`SKILL.md` 示例：\n\n```markdown\n---\nname: storyboard\ndescription: 把口播脚本拆成可生成的分镜（Scene/Shot JSON）。当用户要把文章或脚本变成视频、需要镜头划分、画面提示词或时长规划时使用。\n---\n# Storyboard\n\n## 输入\n- 口播脚本（文本）、风格指南、角色卡（可选）\n\n## 步骤\n1. 先估算总时长；按语义把脚本切成场景，每场景 1–4 个镜头，每镜头 3–8 秒。\n2. 为每个镜头填写 schema/scene.json 中的字段。visual_prompt 用英文，按「主体+动作+场景+风格+镜头+光线」。\n3. 含文字/图表/公式的镜头 kind 设为 animation，文字放在 on_screen_text。\n4. 运行 `python scripts/validate.py out.json`，修复所有报错后再输出。\n\n## 约束\n- 角色只引用角色卡 id，不重复描述外观。\n- 不在 visual_prompt 中要求画面文字。\n\n## 输出\n- 符合 schema 的 JSON，保存为 storyboard.json。\n```\n\n编写好 Skill 的要点：\n- **description 写\"何时触发\"**，包含用户可能的说法与场景，是被选中的唯一依据。\n- 一个 Skill 只做一件事；步骤具体到可执行；把**确定性工作放进脚本**（校验、渲染、转码），让模型做判断和生成。\n- 给出输入/输出契约（schema）和失败时的处理。\n- 带 1–2 个好样例和常见坑。\n- 对 Skill 本身做评测：准备 10–20 个触发/不触发的提示词，检查是否被正确选中；准备端到端样例检查产出质量；版本化并记录变更。\n\n## 10.5 Skill、MCP、函数调用怎么选\n\n| 机制 | 本质 | 适合 | 举例 |\n|---|---|---|---|\n| 函数/工具调用 | 单个可执行函数，模型按 schema 调用 | 简单原子操作 | `tts(text, voice)`、`probe(file)` |\n| **MCP（Model Context Protocol）服务器** | 标准协议暴露一组工具/资源，跨应用复用，可跑在独立进程/远端 | 对接外部系统与能力：ComfyUI、ffmpeg、对象存储、数据库 | ffmpeg MCP、图像生成 MCP |\n| **Skill** | 一套\"怎么做\"的指令 + 脚本 + 模板，按需加载 | 多步骤方法论、领域最佳实践、输出规范 | 分镜、讲解视频制作、质检流程 |\n| 子 Agent | 独立上下文的执行者 | 并行/隔离的大块任务 | 并行生成各镜头素材 |\n| 工作流引擎 | 外部持久化编排 | 生产主干 | Temporal DAG |\n\n一句话：**MCP 提供\"手\"（能做什么），Skill 提供\"手艺\"（怎么做好），工作流提供\"流程\"（按什么顺序、失败怎么办）。**\n\n## 10.6 多媒体应用的推荐 Skill 清单\n\n| Skill | 职责 | 绑定的脚本/工具 |\n|---|---|---|\n| `brief-intake` | 把需求变成 Brief，缺字段时追问 | schema 校验 |\n| `script-writer` | 大纲→口播稿→TTS 友好改写 | 时长估算脚本 |\n| `storyboard` | 脚本→Scene/Shot JSON | validate.py |\n| `image-prompt` | Shot→图像提示词（含一致性规则） | 图像 API/ComfyUI |\n| `video-shot` | 首帧→I2V→挑选 | 视频 API/ComfyUI、VLM 评分 |\n| `narrate` | 规范化→TTS→拼接→响度 | TTS、ffmpeg |\n| `transcribe` | 音频→带时间戳转写→清理 | ASR、VAD、pyannote |\n| `manim-scene` / `remotion-scene` | 场景描述→动画代码→渲染→检查 | 沙箱渲染器 |\n| `bgm-mix` | 选/生成音乐，ducking，响度 | ffmpeg |\n| `assemble-video` | 时间线→成片→多比例导出 | ffmpeg、ffprobe |\n| `qa-check` | 自动 QA + 报告 | blackdetect 等、VLM |\n| `compliance-check` | 许可证、授权、披露、审核 | 清单脚本 |\n| `wiki-ingest` | 语音/文档资料→LLM-Wiki | 见《LLM 工作流手册》第 4 章 |\n\n## 10.7 Agent 主循环骨架（带预算与审批）\n\n```python\ndef run_agent(goal, tools, budget):\n    state = {\"spent\": 0.0, \"calls\": 0, \"assets\": {}}\n    messages = [system_prompt(tools), {\"role\": \"user\", \"content\": goal}]\n    while True:\n        step = llm(messages)                          # 返回：文本 或 工具调用\n        if step.type == \"final\":\n            return step.content\n        if state[\"calls\"] >= budget.max_calls or state[\"spent\"] >= budget.max_cost:\n            return request_human_approval(\"预算已达上限，是否继续？\", state)\n        tool = tools[step.name]\n        if tool.requires_approval and not human_approve(step):    # 脚本/分镜/首帧\n            messages.append({\"role\": \"tool\", \"content\": \"用户拒绝，请调整方案\"}); continue\n        result = tool.run(**step.args)                # 返回资产 ID + 摘要\n        state[\"calls\"] += 1; state[\"spent\"] += result.cost\n        messages.append({\"role\": \"tool\", \"content\": result.summary})\n```\n\n## 10.8 编排检查清单\n\n- [ ] 主干是固定工作流；Agent 只放在需要判断/修复的节点\n- [ ] 工具返回资产 ID，不返回大对象；长任务异步\n- [ ] 幂等键 + 缓存；预算与超时护栏\n- [ ] 审批点（脚本/分镜/首帧）已设置\n- [ ] 每个 Skill：description 明确触发条件、有脚本校验、有评测样例、有版本\n\n---\n\n\n# 11. 端到端应用蓝图\n\n> 每个蓝图给出：输入/输出、流水线、关键技术选择、难点、MVP 范围、成本项。先做 MVP，再逐步加质量。\n\n## 11.1 蓝图 A：技术讲解视频（文章/主题 → 动画讲解视频）\n\n```\n主题/文章 → [RAG/检索取事实] → 脚本 → 分镜(以 animation 镜头为主)\n  → 并行: TTS 旁白 ∥ Manim/Remotion 场景代码→渲染 ∥ (少量)配图\n  → 以旁白时长回填 → 混音 → 字幕 → 合成 → QA → 导出(16:9 + 9:16)\n```\n\n| 项 | 内容 |\n|---|---|\n| 关键技术 | 代码即动画（§8.2）；旁白时长驱动动画节拍；术语 glossary；逐字高亮字幕 |\n| 难点 | LLM 生成动画代码的成功率；画面布局重叠；事实准确 |\n| MVP | 1 个模板（标题+要点+图示）、Kokoro 旁白、Remotion 渲染、SRT 字幕，60 秒内 |\n| 加分 | 多模板、公式/图表镜头、中英双语版本、自动挑选封面 |\n| 成本项 | LLM tokens、TTS 时长、渲染 CPU 时间；几乎无 GPU 依赖 |\n\n## 11.2 蓝图 B：AI 播客 / 音频杂志（文章 → 多声部音频节目）\n\n```\n文章/资料 → 摘要与要点 → 对话脚本(主持人+嘉宾) → 逐句多声 TTS → 拼接(停顿/呼吸)\n  → 片头片尾音乐 + ducking → 响度标准化 → 章节标记 + 文字稿 + 摘要 → RSS/发布\n```\n\n| 项 | 内容 |\n|---|---|\n| 关键技术 | 对话式脚本（口语化、打断、反问）；两个固定 voice_id；句间停顿 200–400 ms；章节时间戳 |\n| 难点 | 自然度（对话节奏、语气变化）；长音频一致性；事实准确 |\n| MVP | 5 分钟、2 个声音、无音乐，输出 MP3 + 文字稿 |\n| 加分 | 背景音乐与 ducking、情感标签、自动生成封面（第 6 章）、多语言 |\n| 成本项 | LLM、TTS 时长（主要成本）、存储 |\n\n## 11.3 蓝图 C：绘本 / 故事视频（故事 → 配图 + 微动 + 配音）\n\n```\n故事文本 → 角色卡+风格指南 → 分页分镜 → 角色设定图(多视角)\n  → 每页生图(参考设定图/LoRA) → 选图审批 → I2V 微动(3–5s) 或 Ken Burns 推拉\n  → 旁白 TTS(旁白声+角色声) → 配乐/音效 → 合成 → 字幕 → 导出\n```\n\n| 项 | 内容 |\n|---|---|\n| 关键技术 | 角色一致性（§6.8）；首帧审批；微动（轻微镜头+局部运动）比大动作稳定 |\n| 难点 | 跨页角色一致；手部/多人场景；风格统一 |\n| MVP | 8 页，静图 + Ken Burns + 旁白，无 I2V |\n| 加分 | 角色 LoRA；I2V 微动；多角色声音；多语言 |\n| 成本项 | 图像生成（含重抽）、I2V、TTS |\n\n## 11.4 蓝图 D：营销短视频（产品信息 → 多版本短视频）\n\n```\n产品资料 → 卖点提炼 → 文案(多个角度) → 分镜(3–5 镜头，9:16)\n  → 素材: 产品图(用户提供) + I2V 动效 + 文字动画(代码渲染) → 配音/音乐 → 字幕(大字号)\n  → 多版本(不同钩子/文案/声音) → 多比例导出 → 数据反馈\n```\n\n| 项 | 内容 |\n|---|---|\n| 关键技术 | 产品图必须来自用户真实素材（避免虚假宣传）；画面文字/价格由代码渲染；A/B 版本批量生成 |\n| 难点 | 真实性与广告合规；产品细节保真（不让模型重画产品） |\n| MVP | 1 个产品图 + 3 条文案 + 模板化文字动画 + TTS |\n| 成本项 | I2V 秒数、批量版本数 |\n| 合规 | 不虚构功效/评价/认证；披露 AI 生成；不使用未授权人物 |\n\n## 11.5 蓝图 E：录音/语音资料 → 知识库（与 LLM-Wiki 结合）\n\n```\n录音/视频 → 标准化 → VAD → ASR(带时间戳) → 说话人分离 → LLM 清理(章节/摘要/行动项/实体)\n  → 质量标注(uncertain) → raw/transcripts/ 存档 → wiki-ingest(来源页+概念页+index+log) → \n  → (可选) 摘要转音频（TTS）回听 / 搜索问答\n```\n\n| 项 | 内容 |\n|---|---|\n| 关键技术 | 词表纠错；时间戳可回跳；转写不可变存 raw；Wiki 页面记录来源与时间戳 |\n| 难点 | 转写错误传播进知识库 → 保留来源、低置信度标注、抽样校对 |\n| MVP | 10 段录音 → 清理后的 Markdown → 手动 ingest 3 篇进 Wiki |\n| 加分 | 自动 ingest、定期 lint、语音问答 |\n| 成本项 | ASR 时长、LLM tokens；可完全本地 |\n\n## 11.6 蓝图 F：实时语音助手（Voice Agent）\n\n```\n麦克风 → 前端采集(PCM 16k) → WebSocket → VAD(端点检测) → 流式 ASR → LLM(流式) →\n 按短句切分 → 流式 TTS → 音频回放缓冲 → 扬声器\n        ↑ 打断(barge-in): 用户开口 → 立即停止播放、取消 LLM/TTS 任务 → 重新听\n```\n\n延迟预算（目标：用户说完到听到第一个字 ≤ 约 1.5 s）：\n\n| 环节 | 目标 | 手段 |\n|---|---|---|\n| 端点检测 | 200–500 ms | VAD 静音阈值调优；语义端点（可选） |\n| ASR 收尾 | 100–300 ms | 流式识别、提前转写 |\n| LLM 首 token | 300–600 ms | 小模型/流式/提示缓存；工具调用尽量少 |\n| TTS 首音频 | 100–300 ms | 首句要短、流式合成 |\n| 网络/播放缓冲 | 50–150 ms | 就近部署、WebSocket/WebRTC |\n\n关键设计：\n- **按句流水线**：LLM 每产出一个完整短句就送 TTS，不等整段。\n- **打断处理**：客户端检测到用户语音时立即清空播放缓冲；服务端取消正在进行的 LLM/TTS；已播放的内容要写入历史（标注被打断）。\n- **回声消除**：外放时 TTS 会被麦克风录回去→ 用浏览器 AEC（`echoCancellation: true`）或耳机。\n- **状态机**：IDLE → LISTENING → THINKING → SPEAKING → (INTERRUPTED)。\n- **协议**：简单用 WebSocket 传 PCM；追求低延迟和抗丢包用 WebRTC。\n\n最小服务骨架（FastAPI WebSocket，核心逻辑示意）：\n\n```python\nfrom fastapi import FastAPI, WebSocket\napp = FastAPI()\n\n@app.websocket(\"/voice\")\nasync def voice(ws: WebSocket):\n    await ws.accept()\n    vad, asr_stream, state = make_vad(), make_asr_stream(), \"LISTENING\"\n    speaking_task = None\n    async for chunk in ws.iter_bytes():                    # 16 kHz PCM16 块\n        event = vad.feed(chunk)\n        if event == \"speech_start\" and speaking_task:      # 打断\n            speaking_task.cancel(); await ws.send_json({\"type\": \"stop_playback\"})\n            state = \"LISTENING\"\n        asr_stream.feed(chunk)\n        if event == \"speech_end\":\n            text = await asr_stream.finalize()\n            speaking_task = asyncio.create_task(respond(ws, text))   # LLM→TTS 流式回传音频帧\n```\n\n| 项 | 内容 |\n|---|---|\n| MVP | 按键说话（push-to-talk）+ 整句 ASR + 流式 LLM + 整句 TTS，先跑通再优化延迟 |\n| 加分 | 自动端点、打断、流式 TTS、工具调用、记忆、情感语气 |\n| 成本项 | 全本地几乎无变动成本；云端按 ASR/LLM/TTS 用量 |\n\n## 11.7 蓝图选择建议\n\n| 目标 | 先做 |\n|---|---|\n| 学习多模态基础，成本最低 | E（知识库）→ B（播客）→ A（讲解动画） |\n| 做产品/作品集 | A 或 D（商业价值明确） |\n| 学习生成式图像/视频 | C（绘本/故事） |\n| 实时交互 | F（语音助手） |\n\n---\n\n# 12. 部署、成本与可观测\n\n## 12.1 部署形态\n\n| 形态 | 适合 | 要点 |\n|---|---|---|\n| 单机本地 | 个人/学习/隐私 | 模型按需加载，避免多个大模型同驻；队列串行化 GPU 任务 |\n| 容器化（Docker）+ GPU 服务器 | 团队自托管 | NVIDIA Container Toolkit；模型权重挂载卷；健康检查 |\n| 云 GPU 按需（Modal/RunPod/Replicate/云厂商） | 峰值弹性、不想买卡 | 冷启动与权重加载时间；按秒计费；缓存权重 |\n| 全托管 API | 最快上线 | 成本按量；注意数据条款与限流 |\n| 前端 | Web（Next.js/React）+ 对象存储直传 + CDN 分发 | 上传用预签名 URL；播放用分片 |\n\n模型服务化：LLM 用 vLLM/Ollama/llama.cpp server；图像/视频用 ComfyUI API 或 diffusers 包装成服务；ASR/TTS 包成 FastAPI 微服务（统一 `/transcribe`、`/synthesize` 接口，后端可切换实现）。\n\n## 12.2 成本模型\n\n```\n单个视频成本 ≈ LLM tokens×单价 + TTS 字符/秒×单价 + 图像张数×(含重抽率)×单价\n              + 视频秒数×(含候选数)×单价 + 渲染/转码 CPU·GPU 时间 + 存储与流量\n```\n\n| 控制手段 | 效果 |\n|---|---|\n| 草稿-终稿两阶段 | 避免高质量参数下反复试错 |\n| 内容寻址缓存 | 重复请求零成本 |\n| 候选数上限与自动挑选 | 控制重抽成本 |\n| 模型分级（小模型做路由/改写/校验） | 降低 LLM 成本 |\n| 镜头复用与模板化 | 同模板换数据，不重生成 |\n| 批处理与排队 | 提升 GPU 利用率 |\n| 预算护栏 | 每项目/每用户上限 |\n\n关键指标：**每可用秒成本、每分钟成片成本、一次通过率（QA 一次通过的比例）、人工介入率**。\n\n## 12.3 可观测性\n\n- 每个请求/任务带 `project_id、job_id、trace_id`，贯穿所有步骤。\n- 记录：每步耗时、模型/版本、参数、输入输出资产 ID、花费、失败原因。\n- 指标看板：队列长度、GPU 利用率/显存、各阶段 P50/P95 耗时、失败率、缓存命中率、成本。\n- 日志不记录敏感原始内容；PII 脱敏。\n- 告警：失败率、队列积压、单任务成本异常。\n\n## 12.4 可复现与版本管理\n\n| 对象 | 做法 |\n|---|---|\n| 模型 | 记录模型名 + 版本/commit hash + 量化方式 |\n| 提示词 | 放 git，带版本号 |\n| 工作流（ComfyUI JSON、Remotion 模板、ffmpeg 命令） | 放 git，带版本号 |\n| 参数与种子 | 写入 Asset 元数据 |\n| 依赖环境 | 锁定版本（`uv.lock`/`requirements.txt`/镜像 digest） |\n| 回归集 | 固定一组 Brief 与期望，升级任何组件后跑回归 |\n\n## 12.5 安全与稳定性\n\n- 动画/代码类步骤必须**沙箱**（容器、只读文件系统、禁网、CPU/内存/时间限制）。\n- 上传文件校验类型与大小，转码前先 `ffprobe`，防畸形媒体。\n- 速率限制、并发上限、取消与回收。\n- 密钥放密钥管理，不写进代码与 Asset 元数据。\n\n## 12.6 部署检查清单\n\n- [ ] 任务异步 + 幂等 + 缓存；失败可重试且可从中间恢复\n- [ ] GPU 串行/限并发；模型加载与卸载策略\n- [ ] 预算与超时护栏；成本指标上报\n- [ ] 追踪 ID 贯穿；资产溯源元数据完整\n- [ ] 沙箱执行不可信代码；媒体文件校验\n- [ ] 版本锁定与回归集\n\n---\n\n# 13. 评估、安全与合规\n\n## 13.1 分模态评估矩阵\n\n| 模态 | 自动指标 | 人评/其他 |\n|---|---|---|\n| 文本/脚本 | schema 通过率、时长偏差、引用核对、术语一致性 | 可读性、口语化 |\n| ASR | WER/CER、术语召回、RTF | 抽样校对 |\n| TTS | 回转写 CER、RTF、TTFA、稳定性（跳字/重复率） | MOS、相似度（克隆） |\n| 音频混音 | LUFS/峰值、ASR 回测可懂度 | 听感 |\n| 图像 | OCR 正确率、VLM 清单判分、特征相似度 | 美学、提示遵循 |\n| 视频 | 闪烁/冻结/黑帧检测、VLM 抽帧判断、帧间一致性 | 动作遵循、物理合理 |\n| 动画 | 渲染成功率、越界/重叠检测、时长偏差 | 清晰度、节奏 |\n| 成片 | ffprobe 规范、音画同步、字幕规范 | 整体观感、完播反馈 |\n\n## 13.2 评估方法\n\n1. **Golden Brief 集**：20–50 条覆盖不同主题、长度、语言的 Brief，每次改动全量跑。\n2. **LLM/VLM 评审**：用固定 rubric + 低温；与人工对齐度检查；注意位置偏差、长度偏差。\n3. **A/B 与成对比较**：新旧版本盲比，统计胜率与置信区间。\n4. **失败案例回流**：失败样本加入回归集。\n5. **成本-质量曲线**：每个优化都标注对质量和成本的影响。\n\n## 13.3 内容安全\n\n| 项 | 做法 |\n|---|---|\n| 输入审核 | 对用户 Brief 做敏感内容与滥用检测 |\n| 输出审核 | 对图像/视频/音频/文本做审核（云审核 API 或本地分类器）；对生成素材抽帧审核 |\n| 未成年人 | 不生成涉及未成年人的不当内容；设置严格策略与拦截 |\n| 真实人物 | 不生成他人肖像/声音的欺骗性内容；名人、政治人物相关内容设严格规则 |\n| 虚假信息 | 事实核查；不制造伪造新闻/证据/录音/截图 |\n| 危险内容 | 不提供危害性操作指导 |\n| 提示注入 | 用户上传的文档/网页/字幕可能含指令，当作数据处理，不当作命令执行 |\n\n## 13.4 授权、版权与许可证\n\n| 项 | 做法 |\n|---|---|\n| 模型许可证 | 维护 `MODEL_LICENSES.md`（模型、版本、许可证、商用/署名/用户规模限制、检索日期）；代码与权重分开看 |\n| 输入素材 | 只用自己拥有或有授权的图片/音频/视频/文本；记录来源 |\n| 声音克隆/换脸/数字人 | 书面授权（谁、范围、期限）；不得冒充；保留授权记录 |\n| 音乐/音效 | 使用授权库或明确商用条款的生成服务；记录 prompt 与版本 |\n| 输出权利 | 各平台对生成内容的归属与商用条款不同；以条款为准 |\n| 第三方 IP | 不生成受保护角色/品牌/作品的复刻；提示词中避免指向具体受保护角色或艺术家风格复刻 |\n\n## 13.5 透明度与披露\n\n- 成片中披露\"AI 生成/合成\"：画面角标、描述文字、元数据。\n- 写入内容凭证：C2PA（Content Credentials）或至少文件元数据中标记生成工具与时间。\n- 保留水印机制，不去除模型自带水印（如 Chatterbox 的 PerTh）。\n- 各平台（视频网站、社交媒体）有各自的 AI 内容标注规则；各地区对合成媒体有披露要求（如欧盟 AI Act 对深度合成的透明义务等），**具体义务以当地法律和平台最新政策为准，必要时咨询法律意见**。\n\n## 13.6 隐私\n\n- 语音、人脸、位置等属于敏感数据：最小化收集，明确告知与同意，设保留期限与删除流程（按 `project_id` 级联删除原始素材、衍生资产、缓存与日志）。\n- 私人录音优先本地处理；使用云服务前核对数据保留与训练条款。\n- 日志脱敏；访问控制按项目/租户隔离。\n\n## 13.7 红队与上线前清单\n\n- [ ] 滥用场景测试：冒充、虚假新闻、侵权复刻、越狱提示\n- [ ] 输入/输出审核在流水线内强制执行，不可绕过\n- [ ] 许可证表已核对且在有效期内\n- [ ] 声音/肖像授权记录齐全\n- [ ] 成片披露与元数据已写入\n- [ ] 隐私：保留期限、删除流程、访问控制\n- [ ] 回归集通过；成本与稳定性指标达标\n\n---\n\n# 附录 A：命令速查\n\n```bash\n# 媒体信息\nffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of json f.mp4\n\n# 抽音轨并标准化给 ASR\nffmpeg -i in.mp4 -vn -ar 16000 -ac 1 -c:a pcm_s16le out.wav\n\n# 响度归一化\nffmpeg -i in.wav -af loudnorm=I=-16:TP=-1.5:LRA=11 out.wav\n\n# 抽帧（每秒 1 帧）用于 VLM 检查\nffmpeg -i in.mp4 -vf fps=1 frames/%04d.jpg\n\n# 截取片段\nffmpeg -ss 00:00:10 -to 00:00:15 -i in.mp4 -c copy cut.mp4        # 关键帧对齐，不重编码\nffmpeg -ss 00:00:10 -to 00:00:15 -i in.mp4 -c:v libx264 -c:a aac cut.mp4  # 精确，重编码\n\n# GIF 预览\nffmpeg -i in.mp4 -vf \"fps=12,scale=480:-1:flags=lanczos\" preview.gif\n\n# 转 H.264 网页友好\nffmpeg -i in.mov -c:v libx264 -crf 20 -pix_fmt yuv420p -c:a aac -movflags +faststart out.mp4\n\n# 变速（视频 1.2× 快，音频同步）\nffmpeg -i in.mp4 -filter_complex \"[0:v]setpts=PTS/1.2[v];[0:a]atempo=1.2[a]\" -map \"[v]\" -map \"[a]\" out.mp4\n\n# 分离人声\ndemucs --two-stems=vocals -n htdemucs song.mp3\n\n# 转写（whisper.cpp / mlx-whisper）\nwhisper-cli -m ggml-large-v3-turbo.bin -f a.wav -l zh -osrt -of out\nmlx_whisper a.wav --model mlx-community/whisper-large-v3-turbo --language zh --output-format srt\n\n# Manim / Remotion\nmanim -pql scene.py MyScene\nnpx remotion render src/index.ts MyComp out/video.mp4\n```\n\n# 附录 B：模型与工具目录（按模态，需自行核对最新状态）\n\n| 模态 | 开源/自托管 | 云服务/闭源 |\n|---|---|---|\n| LLM | Qwen、GLM、Llama、Mistral、DeepSeek 等；运行：Ollama、vLLM、llama.cpp | 各大模型厂商 API |\n| ASR | Whisper 系、Parakeet/Canary、Qwen3-ASR、Moonshine、SenseVoice | 各云 ASR、实时转写服务 |\n| TTS | Kokoro、Qwen3-TTS、Chatterbox、Piper、F5-TTS（非商用权重）、Fish（非商用） | ElevenLabs、各云 TTS、OpenAI TTS 等 |\n| 音乐/音效 | MusicGen、Stable Audio Open、AudioLDM、ACE-Step | Suno、Udio、ElevenLabs |\n| 图像 | SDXL、FLUX 系、Qwen-Image、Z-Image、HunyuanImage；工具：ComfyUI、diffusers、kohya-ss | 各厂商图像 API、Midjourney、Ideogram 等 |\n| 视频 | Wan 2.x、LTX、HunyuanVideo、CogVideoX、Mochi；工具：ComfyUI、Wan2GP | Veo、Sora、Kling、Runway、Luma、海螺、Seedance 等 |\n| 动画/渲染 | Manim、Remotion（有许可条款）、Motion Canvas、Blender、three.js、Matter.js、Lottie、Rive | After Effects、云端数字人（HeyGen、D-ID、Synthesia） |\n| 口型/数字人 | Wav2Lip、MuseTalk、SadTalker、LivePortrait | 云端数字人服务 |\n| 后期 | ffmpeg、MoviePy、RIFE、Real-ESRGAN、DaVinci Resolve（免费版） | 云视频编辑 API |\n| 编排 | Temporal、Prefect、Celery、LangGraph、ComfyUI、n8n | 托管工作流服务 |\n| 评估 | jiwer、promptfoo、RAGAS（文本）、自建 VLM 评审 | 各评估平台 |\n\n# 附录 C：术语\n\n| 术语 | 含义 |\n|---|---|\n| ASR/STT | 语音转文字 |\n| TTS | 文字转语音 |\n| VAD | 语音活动检测 |\n| Diarization | 说话人分离 |\n| WER/CER | 词/字错误率 |\n| RTF | 实时因子 = 处理时长/音频时长 |\n| TTFA | 首音频延迟 |\n| MOS | 平均意见分（主观听感 1–5） |\n| LUFS/dBTP | 响度单位/真峰值 |\n| Ducking | 旁白出现时自动压低背景音乐 |\n| Diffusion / DiT / 流匹配 | 扩散模型 / 扩散 Transformer / 流匹配生成范式 |\n| CFG | 无分类器引导强度 |\n| ControlNet / IP-Adapter | 结构控制 / 参考图风格人物控制 |\n| LoRA | 低秩适配，轻量微调 |\n| T2V / I2V | 文生视频 / 图生视频 |\n| 首尾帧 | 给定起止帧生成中间视频 |\n| Viseme | 嘴型单元，用于口型动画 |\n| Scene JSON / IR | 贯穿流水线的结构化中间表示 |\n| Skill | 带说明、脚本、模板的可复用能力包，按需加载 |\n| MCP | 模型上下文协议，标准化暴露工具与资源 |\n| Barge-in | 用户打断正在播放的语音 |\n| C2PA | 内容凭证标准，记录媒体来源与编辑历史 |\n\n# 附录 D：学习资源方向（按名称检索官方文档）\n\n- 音频/语音：whisper.cpp、mlx-whisper / mlx-audio、silero-vad、pyannote.audio、WhisperX、各 TTS 模型卡。\n- 图像：Hugging Face Diffusers 文档与课程、ComfyUI 文档与示例工作流、kohya-ss / ai-toolkit。\n- 视频：各视频模型的官方仓库与 ComfyUI 示例工作流、Wan2GP。\n- 动画：Manim Community 文档、Remotion 文档、Motion Canvas、Blender Python API、three.js 示例。\n- 后期：ffmpeg 官方文档与 filter 手册。\n- 编排与 Skills：Temporal / Prefect 文档、MCP 官方规范、各 Agent 平台的 Skills 文档。\n- 合规：C2PA 规范、各模型许可证原文、各平台 AI 内容政策、当地法规。\n\n# 附录 E：本手册的检索来源（2026-11）\n\n- 本地 TTS 对比：murmurtts.com 的 Mac 本地 TTS 指南；yaps.ai 的本地 TTS 模型列表\n- 开源 STT 对比：northflank.com 的 2026 STT 基准；typilot.com 的本地 STT 指南\n- 本地视频生成：insiderllm.com 的本地视频生成指南\n- 本地图像生成：earngenix.com 的本地图像模型测试\n- 这些是第三方博客，数据可能有误或过期；以官方模型卡、许可证原文和你自己的实测为准。\n";
