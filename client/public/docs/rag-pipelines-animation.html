<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG · 离线与在线 Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    :root{--paper:#f5f5f5;--paper2:#ececec;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--rule:rgba(45,49,66,.16);--accent:#bf4520;--accent-tint:rgba(191,69,32,.08);--link:#2e5aa8;--sans:'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;--serif:'Instrument Serif','Noto Serif SC',serif;--mono:'Geist Mono',ui-monospace,monospace;--motion-fast:160ms;--motion-step:480ms;--motion-hold:720ms;--motion-total:5760ms;--motion-ease:cubic-bezier(.2,.8,.2,1)}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
    main[data-motion-root]{width:min(100%,1440px);margin:0 auto;padding:34px 32px 28px;min-width:0}
    .eyebrow{margin:0 0 7px;color:var(--muted);font:500 12px/1.4 var(--mono);letter-spacing:.15em;text-transform:uppercase}
    h1{margin:0;font:400 40px/1.08 var(--serif)}
    .dek{margin:10px 0 24px;color:var(--muted);font-size:14px;line-height:1.55}
    .diagram-container{width:100%;overflow-x:auto}
    .flow{display:block;width:100%;min-width:1280px;height:auto}
    .feedback{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin:16px 0 0;padding:16px 20px;border:1px solid var(--rule);border-top:2px dashed var(--muted);background:rgba(236,236,236,.55)}
    .feedback-title{margin:0 0 5px;font:600 14px/1.3 var(--sans)}
    .feedback-copy{margin:0;color:var(--muted);font:400 12px/1.45 var(--mono)}
    .feedback-arrow{color:var(--muted);font:500 18px/1 var(--mono)}
    .instruction{margin:14px 0 0;color:var(--muted);font-size:12px}
    .motion-ready [data-motion-item]{opacity:.12;transform:translateY(8px);transform-box:fill-box;transform-origin:center;transition:opacity var(--motion-step) var(--motion-ease),transform var(--motion-step) var(--motion-ease)}
    .motion-ready [data-motion-item].is-visible,.motion-ready[data-frame="end"] [data-motion-item],.motion-ready[data-frame="static"] [data-motion-item]{opacity:1;transform:none}
    [data-motion-controls]{display:none;align-items:center;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
    .motion-ready [data-motion-controls]{display:flex}
    [data-motion-controls][hidden]{display:none!important}
    [data-motion-controls] button{min-width:44px;min-height:44px;padding:8px 12px;border:1px solid var(--muted);border-radius:4px;color:var(--ink);background:var(--paper);font:600 12px/1 var(--sans);cursor:pointer}
    [data-motion-controls] button:hover{border-color:var(--accent)}
    [data-motion-controls] button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    [data-motion-controls] button:disabled{cursor:not-allowed;opacity:.45}
    [data-motion-status-visible]{margin-left:auto;color:var(--muted);font:500 12px/1.4 var(--mono)}
    .keyboard-help{color:var(--soft);font:400 11px/1.4 var(--mono)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    noscript p{color:var(--muted);font-size:12px}
    html[data-motion="static"] [data-motion-controls],html[data-motion="static"] [data-motion-decorative],html[data-motion="step"] [data-motion-controls],html[data-motion="step"] [data-motion-decorative]{display:none!important}
    html[data-motion="static"] [data-motion-item]{opacity:1!important;transform:none!important;animation:none!important;transition:none!important}
    html[data-motion="step"] [data-motion-item]{animation:none!important;transition:none!important}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}[data-motion-item]{opacity:1!important;transform:none!important}[data-motion-decorative],[data-motion-controls]{display:none!important}}
    @media print{main[data-motion-root]{padding:0}.diagram-container{overflow:visible}.flow{min-width:0}[data-motion-controls],[data-motion-decorative]{display:none!important}[data-motion-item]{opacity:1!important;transform:none!important;animation:none!important;transition:none!important}}
    @media(max-width:700px){main[data-motion-root]{padding:24px 18px}.dek{max-width:52ch}.feedback{grid-template-columns:1fr;gap:9px}.feedback-arrow{transform:rotate(90deg);justify-self:center}.keyboard-help{order:2}[data-motion-status-visible]{margin-left:0}}
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="8" data-step-current="8" data-frame="static" data-static-frame="complete" tabindex="0">
    <p class="eyebrow">Retrieval-Augmented Generation · 系统流程</p>
    <h1>离线建库，在线检索</h1>
    <p class="dek">索引由离线 ingestion 持续构建；在线请求从同一索引取回证据，再生成并校验答案。底部反馈回路用于调优。</p>

    <div class="diagram-container">
      <svg class="flow" viewBox="0 0 1280 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rag-flow-title rag-flow-desc">
        <title id="rag-flow-title">RAG 离线 Ingestion 与在线 Query Pipeline</title>
        <desc id="rag-flow-desc">上方展示离线资料经过同步、分拣、解析清洗、元数据分块、上下文增强与 dense 和 sparse embedding，写入 Vector DB 与 BM25 索引。下方展示用户问题经过安全意图识别、查询改写、混合检索、RRF 融合、重排、上下文组装、LLM 生成及后处理后返回。评估集、在线反馈与追踪信号回流调优。</desc>
        <defs>
          <pattern id="rag-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r=".8" fill="rgba(45,49,66,.10)"/></pattern>
          <marker id="rag-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker>
          <marker id="rag-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#bf4520"/></marker>
          <marker id="rag-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="1280" height="632" fill="#f5f5f5"/>
        <rect width="1280" height="632" fill="url(#rag-dots)" opacity=".42"/>

        <!-- Connectors are deliberately behind nodes. -->
        <path d="M234 162H246M418 162H430M602 162H614M786 162H798M970 162H982M1154 162H1166" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#rag-arrow)"/>
        <path d="M234 438H246M418 438H430M602 438H614M786 438H798M970 438H982M1154 438H1166" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#rag-arrow)"/>
        <!-- Shared index hand-off: index sits above the hybrid retrieval stage. -->
        <path d="M1208 218V242Q1208 250 1200 250H524Q516 250 516 258V354" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#rag-arrow-link)"/>
        <rect x="792" y="260" width="146" height="20" rx="3" fill="#f5f5f5"/>
        <text x="865" y="274" text-anchor="middle" fill="#2e5aa8" font-family="Geist Mono,monospace" font-size="10" letter-spacing=".5">SHARED INDEX</text>

        <!-- Ingestion process: seven nodes, with coupled steps grouped for the reveal. -->
        <text x="48" y="42" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="18" font-weight="600">离线 Ingestion Pipeline</text>
        <text x="1232" y="42" text-anchor="end" fill="#5a6580" font-family="Geist Mono,monospace" font-size="10" letter-spacing="1">BUILD · ENRICH · INDEX</text>
        <g data-motion-item data-step="1" aria-label="Step 1: Data sources and collection or sync">
          <rect x="50" y="102" width="184" height="116" rx="6" fill="#ececec" stroke="#4f5d75"/>
          <rect x="62" y="114" width="28" height="16" rx="2" fill="rgba(45,49,66,.12)"/><text x="76" y="125" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="8" font-weight="600">01</text>
          <text x="142" y="156" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="16" font-weight="600">数据源</text>
          <text x="142" y="183" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="11">Collect / Sync</text>
          <text x="142" y="202" text-anchor="middle" fill="#5a6580" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="11">文件 · API · DB · CDC</text>
        </g>
        <g data-step="1" aria-label="Step 1: Triage">
          <rect x="246" y="102" width="172" height="116" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
          <rect x="258" y="114" width="28" height="16" rx="2" fill="rgba(45,49,66,.12)"/><text x="272" y="125" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="8" font-weight="600">02</text>
          <text x="332" y="158" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="16" font-weight="600">分拣</text>
          <text x="332" y="184" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="11">Triage</text>
          <text x="332" y="202" text-anchor="middle" fill="#5a6580" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="11">路由 · 类型识别</text>
        </g>
        <g data-motion-item data-step="2" aria-label="Step 2: Parse, clean, and deduplicate">
          <rect x="430" y="102" width="172" height="116" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
          <rect x="442" y="114" width="28" height="16" rx="2" fill="rgba(45,49,66,.12)"/><text x="456" y="125" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="8" font-weight="600">03</text>
          <text x="516" y="157" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="15" font-weight="600">解析 + 清洗</text>
          <text x="516" y="183" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="10.5">Parse · Normalize</text>
          <text x="516" y="202" text-anchor="middle" fill="#5a6580" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="11">去重 · 质量检查</text>
        </g>
        <g data-step="2" aria-label="Step 2: Metadata and chunking">
          <rect x="614" y="102" width="172" height="116" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
          <rect x="626" y="114" width="28" height="16" rx="2" fill="rgba(45,49,66,.12)"/><text x="640" y="125" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="8" font-weight="600">04</text>
          <text x="700" y="157" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="15" font-weight="600">Metadata + Chunk</text>
          <text x="700" y="183" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="10.5">IDs · source · ACL</text>
          <text x="700" y="202" text-anchor="middle" fill="#5a6580" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="11">按结构分块</text>
        </g>
        <g data-motion-item data-step="3" aria-label="Step 3: Contextual enrichment, summaries, and questions">
          <rect x="798" y="102" width="172" height="116" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
          <rect x="810" y="114" width="28" height="16" rx="2" fill="rgba(45,49,66,.12)"/><text x="824" y="125" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="8" font-weight="600">05</text>
          <text x="884" y="157" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="15" font-weight="600">上下文增强</text>
          <text x="884" y="183" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="10.5">Context · Summary</text>
          <text x="884" y="202" text-anchor="middle" fill="#5a6580" font-family="Geist Mono,monospace" font-size="10.5">Questions</text>
        </g>
        <g data-motion-item data-step="3" aria-label="Step 3: Dense and sparse embeddings">
          <rect x="982" y="102" width="172" height="116" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
          <rect x="994" y="114" width="28" height="16" rx="2" fill="rgba(45,49,66,.12)"/><text x="1008" y="125" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="8" font-weight="600">06</text>
          <text x="1068" y="157" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="15" font-weight="600">Embedding</text>
          <text x="1068" y="183" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="11">Dense + Sparse</text>
          <text x="1068" y="202" text-anchor="middle" fill="#5a6580" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="11">向量 + 词项权重</text>
        </g>
        <g data-motion-item data-step="4" aria-label="Step 4: Vector DB and BM25 index">
          <rect x="1166" y="102" width="84" height="116" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.5"/>
          <rect x="1176" y="114" width="28" height="16" rx="2" fill="rgba(191,69,32,.16)"/><text x="1190" y="125" text-anchor="middle" fill="#bf4520" font-family="Geist Mono,monospace" font-size="8" font-weight="600">07</text>
          <text x="1208" y="158" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="14" font-weight="600">索引</text>
          <text x="1208" y="183" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="10">Vector DB</text>
          <text x="1208" y="202" text-anchor="middle" fill="#5a6580" font-family="Geist Mono,monospace" font-size="10">+ BM25</text>
        </g>

        <!-- Online query process: eight nodes, folded once to preserve a readable type ramp. -->
        <text x="48" y="304" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="18" font-weight="600">在线 Query Pipeline</text>
        <text x="1232" y="304" text-anchor="end" fill="#5a6580" font-family="Geist Mono,monospace" font-size="10" letter-spacing="1">RETRIEVE · RANK · GENERATE</text>
        <g data-motion-item data-step="5" aria-label="Step 5: User question and safety or intent recognition">
          <rect x="50" y="354" width="184" height="168" rx="6" fill="#ececec" stroke="#4f5d75"/>
          <rect x="62" y="366" width="28" height="16" rx="2" fill="rgba(45,49,66,.12)"/><text x="76" y="377" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="8" font-weight="600">01</text>
          <text x="142" y="411" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="15" font-weight="600">用户问题</text>
          <text x="142" y="439" text-anchor="middle" fill="#4f5d75" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="12">安全检查</text>
          <text x="142" y="462" text-anchor="middle" fill="#5a6580" font-family="Geist Mono,monospace" font-size="10.5">Safety · Policy</text>
          <text x="142" y="487" text-anchor="middle" fill="#5a6580" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="12">意图识别</text>
        </g>
        <g data-motion-item data-step="6" aria-label="Step 6: Rewrite, decompose, or HyDE">
          <rect x="246" y="354" width="172" height="168" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
          <rect x="258" y="366" width="28" height="16" rx="2" fill="rgba(45,49,66,.12)"/><text x="272" y="377" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="8" font-weight="600">02</text>
          <text x="332" y="412" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="15" font-weight="600">查询改写</text>
          <text x="332" y="440" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="11">Rewrite</text>
          <text x="332" y="464" text-anchor="middle" fill="#5a6580" font-family="Geist Mono,monospace" font-size="10.5">Decompose · HyDE</text>
          <text x="332" y="489" text-anchor="middle" fill="#5a6580" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="11">拆解 · 假设文档</text>
        </g>
        <g data-motion-item data-step="6" aria-label="Step 6: Hybrid dense and BM25 retrieval with metadata filters">
          <rect x="430" y="354" width="172" height="168" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
          <rect x="442" y="366" width="28" height="16" rx="2" fill="rgba(45,49,66,.12)"/><text x="456" y="377" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="8" font-weight="600">03</text>
          <text x="516" y="412" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="15" font-weight="600">混合检索</text>
          <text x="516" y="440" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="10.5">Dense + BM25</text>
          <text x="516" y="464" text-anchor="middle" fill="#5a6580" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="11">元数据过滤</text>
          <text x="516" y="489" text-anchor="middle" fill="#5a6580" font-family="Geist Mono,monospace" font-size="10.5">top-k candidates</text>
        </g>
        <g data-motion-item data-step="7" aria-label="Step 7: RRF fusion and reranking">
          <rect x="614" y="354" width="172" height="168" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
          <rect x="626" y="366" width="28" height="16" rx="2" fill="rgba(45,49,66,.12)"/><text x="640" y="377" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="8" font-weight="600">04</text>
          <text x="700" y="412" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="15" font-weight="600">RRF 融合</text>
          <text x="700" y="440" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="11">Reciprocal Rank</text>
          <text x="700" y="464" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="14" font-weight="600">重排</text>
          <text x="700" y="489" text-anchor="middle" fill="#5a6580" font-family="Geist Mono,monospace" font-size="10.5">Rerank · top-n</text>
        </g>
        <g data-motion-item data-step="7" aria-label="Step 7: Context deduplication, ordering, compression, and citations">
          <rect x="798" y="354" width="172" height="168" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
          <rect x="810" y="366" width="28" height="16" rx="2" fill="rgba(45,49,66,.12)"/><text x="824" y="377" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="8" font-weight="600">05</text>
          <text x="884" y="412" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="15" font-weight="600">上下文组装</text>
          <text x="884" y="440" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="10.5">去重 · 排序 · 压缩</text>
          <text x="884" y="464" text-anchor="middle" fill="#5a6580" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="11">相关片段拼装</text>
          <text x="884" y="489" text-anchor="middle" fill="#5a6580" font-family="Geist Mono,monospace" font-size="10.5">source citations</text>
        </g>
        <g data-motion-item data-step="8" aria-label="Step 8: LLM generation with KV or Prefix Cache">
          <rect x="982" y="354" width="172" height="168" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
          <rect x="994" y="366" width="28" height="16" rx="2" fill="rgba(45,49,66,.12)"/><text x="1008" y="377" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="8" font-weight="600">06</text>
          <text x="1068" y="412" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="15" font-weight="600">生成</text>
          <text x="1068" y="440" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="11">LLM</text>
          <text x="1068" y="464" text-anchor="middle" fill="#5a6580" font-family="Geist Mono,monospace" font-size="10.5">KV / Prefix Cache</text>
          <text x="1068" y="489" text-anchor="middle" fill="#5a6580" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="11">结合检索上下文</text>
        </g>
        <g data-motion-item data-step="8" aria-label="Step 8: Citation validation, refusal and formatting; return answer and logs">
          <rect x="1166" y="354" width="84" height="168" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.5"/>
          <rect x="1176" y="366" width="28" height="16" rx="2" fill="rgba(191,69,32,.16)"/><text x="1190" y="377" text-anchor="middle" fill="#bf4520" font-family="Geist Mono,monospace" font-size="8" font-weight="600">07</text>
          <text x="1208" y="412" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="14" font-weight="600">后处理</text>
          <text x="1208" y="439" text-anchor="middle" fill="#4f5d75" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="10.5">引文校验</text>
          <text x="1208" y="461" text-anchor="middle" fill="#5a6580" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="10.5">拒答 · 格式</text>
          <text x="1208" y="489" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', sans-serif" font-size="11" font-weight="600">返回 + 日志</text>
        </g>

        <!-- A looped, dashed route conveys continuous tuning. It stays in the inter-panel corridor. -->
        <path d="M1224 522V540Q1224 548 1232 548H1256Q1264 548 1264 540V80Q1264 72 1256 72H708Q700 72 700 80V102" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#rag-arrow)"/>
        <path d="M1238 522V588Q1238 596 1230 596H340Q332 596 332 588V522" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#rag-arrow)"/>
        <rect x="807" y="559" width="178" height="22" rx="3" fill="#f5f5f5"/>
        <text x="896" y="574" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="10" letter-spacing=".3">EVAL / OPS · TUNE LOOP</text>
      </svg>
    </div>

    <section class="feedback" aria-label="Evaluation and operations feedback loop">
      <div><p class="feedback-title">评估 / 运维信号</p><p class="feedback-copy">离线评估集 · 在线反馈 · Trace / 追踪</p></div>
      <div class="feedback-arrow" aria-hidden="true">→</div>
      <div><p class="feedback-title">回流调优</p><p class="feedback-copy">Ingestion · Chunking · Prompt</p></div>
    </section>
    <p class="instruction">按步骤播放；静态首帧已展示全部流程。窄屏可横向滚动图表。</p>
    <div data-motion-controls role="group" aria-label="动画播放控制">
      <button type="button" data-motion-action="prev">上一步</button><button type="button" data-motion-action="play" aria-pressed="false">播放</button><button type="button" data-motion-action="pause" aria-pressed="true">暂停</button><button type="button" data-motion-action="next">下一步</button><button type="button" data-motion-action="replay">重播</button>
      <span class="keyboard-help">←/→ 步进 · Space 播放/暂停 · R 重播 · Home/End 跳转</span><span data-motion-status-visible aria-hidden="true">Step <span data-motion-step-label>8</span> of 8</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>动画控制需要 JavaScript；完整流程图已直接呈现在上方。</p></noscript>
  </main>
  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
