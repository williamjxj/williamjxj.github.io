<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>混合检索流程</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580;
      --rule: rgba(45,49,66,.12); --accent: #bf4520; --accent-tint: rgba(191,69,32,.08);
      --link: #2e5aa8; --sans: 'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif', serif; --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; padding: 44px 24px; display: flex; justify-content: center; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1120px; }
    .eyebrow { margin-bottom: 8px; color: var(--muted); font: 500 11px var(--mono); letter-spacing: .16em; }
    h1 { margin-bottom: 8px; font: 400 32px/1.15 var(--serif); }
    .dek { margin-bottom: 24px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">RETRIEVAL ARCHITECTURE · 混合检索</p>
    <h1>双路召回，融合后重排</h1>
    <p class="dek">稠密向量与词法检索并行召回，共用 metadata / ACL 过滤，再融合并精排。</p>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hybrid-retrieval-flow-title hybrid-retrieval-flow-desc">
        <title id="hybrid-retrieval-flow-title">混合检索流程</title>
        <desc id="hybrid-retrieval-flow-desc">查询并行进入稠密向量和 BM25 或 SPLADE 检索，两路共用 metadata 与 ACL 过滤，结果融合后重排并输出前五至十项。</desc>
        <defs>
          <marker id="hybrid-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker>
          <marker id="hybrid-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#bf4520"/></marker>
          <marker id="hybrid-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="960" height="600" fill="#f5f5f5"/>

        <!-- Connectors are drawn first so node masks keep their endpoints crisp. -->
        <!-- Query to dense embedding -->
        <path d="M144 260 H164 Q172 260 172 252 V164 Q172 156 180 156" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#hybrid-arrow)"/>
        <!-- Query to lexical retrieval -->
        <path d="M144 292 H324 Q332 292 332 300 V388 Q332 396 340 396" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#hybrid-arrow)"/>
        <!-- Dense branch -->
        <line x1="312" y1="156" x2="356" y2="156" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#hybrid-arrow)"/>
        <!-- Shared metadata / ACL filter controls both retrieval paths -->
        <path d="M428 252 V188" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#hybrid-arrow)"/>
        <path d="M428 300 V364" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#hybrid-arrow)"/>
        <!-- Both retrieval branches converge at fusion -->
        <path d="M496 156 H520 Q528 156 528 164 V252 Q528 260 536 260" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#hybrid-arrow)"/>
        <path d="M496 396 H520 Q528 396 528 388 V292 Q528 284 536 284" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#hybrid-arrow)"/>
        <!-- Fused candidates to rerank to final results -->
        <line x1="672" y1="272" x2="716" y2="272" stroke="#bf4520" stroke-width="1.8" marker-end="url(#hybrid-arrow-accent)"/>
        <line x1="828" y1="272" x2="864" y2="272" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#hybrid-arrow-link)"/>

        <!-- Query -->
        <rect x="36" y="240" width="108" height="72" rx="6" fill="#edf0f4" stroke="#5a6580" stroke-width="1.1"/>
        <text x="90" y="268" text-anchor="middle" fill="#2d3142" font-family="'Geist','Noto Sans SC',sans-serif" font-size="15" font-weight="600">查询</text>
        <text x="90" y="290" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="10">query</text>

        <!-- Dense branch -->
        <rect x="180" y="124" width="132" height="64" rx="6" fill="#fff" stroke="rgba(45,49,66,.42)" stroke-width="1.1"/>
        <text x="246" y="151" text-anchor="middle" fill="#2d3142" font-family="'Geist','Noto Sans SC',sans-serif" font-size="13" font-weight="600">稠密向量</text>
        <text x="246" y="172" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="10">dense embedding</text>
        <rect x="356" y="124" width="140" height="64" rx="6" fill="#fff" stroke="rgba(45,49,66,.42)" stroke-width="1.1"/>
        <text x="426" y="151" text-anchor="middle" fill="#2d3142" font-family="'Geist','Noto Sans SC',sans-serif" font-size="13" font-weight="600">ANN 召回</text>
        <text x="426" y="172" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="10">top 50–200</text>

        <!-- Shared filter -->
        <rect x="356" y="252" width="140" height="48" rx="6" fill="rgba(45,49,66,.04)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5 4"/>
        <text x="426" y="272" text-anchor="middle" fill="#2d3142" font-family="'Geist','Noto Sans SC',sans-serif" font-size="12" font-weight="600">共享过滤</text>
        <text x="426" y="289" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">metadata / ACL</text>

        <!-- Lexical branch -->
        <rect x="340" y="364" width="156" height="64" rx="6" fill="#fff" stroke="rgba(45,49,66,.42)" stroke-width="1.1"/>
        <text x="418" y="391" text-anchor="middle" fill="#2d3142" font-family="'Geist','Noto Sans SC',sans-serif" font-size="13" font-weight="600">BM25 / SPLADE</text>
        <text x="418" y="412" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="10">top 50–200</text>

        <!-- Fusion focal node -->
        <rect x="536" y="236" width="136" height="72" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.5"/>
        <rect x="548" y="244" width="48" height="16" rx="2" fill="rgba(191,69,32,.13)"/>
        <text x="572" y="255" text-anchor="middle" fill="#bf4520" font-family="'Geist Mono',monospace" font-size="8" font-weight="600" letter-spacing=".04em">FUSION</text>
        <text x="604" y="278" text-anchor="middle" fill="#2d3142" font-family="'Geist','Noto Sans SC',sans-serif" font-size="13" font-weight="600">融合候选</text>
        <text x="604" y="294" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">RRF / weighted</text>
        <text x="604" y="305" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">top 50–100</text>

        <!-- Rerank and output -->
        <rect x="716" y="240" width="112" height="64" rx="6" fill="#fff" stroke="rgba(45,49,66,.42)" stroke-width="1.1"/>
        <text x="772" y="268" text-anchor="middle" fill="#2d3142" font-family="'Geist','Noto Sans SC',sans-serif" font-size="14" font-weight="600">重排</text>
        <text x="772" y="289" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="10">rerank</text>
        <rect x="864" y="240" width="72" height="64" rx="6" fill="#fff" stroke="rgba(45,49,66,.42)" stroke-width="1.1"/>
        <text x="900" y="268" text-anchor="middle" fill="#2d3142" font-family="'Geist','Noto Sans SC',sans-serif" font-size="13" font-weight="600">结果</text>
        <text x="900" y="289" text-anchor="middle" fill="#2e5aa8" font-family="'Geist Mono',monospace" font-size="10">top 5–10</text>

        <!-- Bottom legend strip -->
        <line x1="36" y1="480" x2="936" y2="480" stroke="rgba(45,49,66,.14)" stroke-width="1"/>
        <text x="36" y="506" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="500" letter-spacing=".14em">FLOW KEY</text>
        <line x1="142" y1="502" x2="184" y2="502" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#hybrid-arrow)"/>
        <text x="196" y="506" fill="#2d3142" font-family="'Geist','Noto Sans SC',sans-serif" font-size="11">检索结果流</text>
        <line x1="326" y1="502" x2="368" y2="502" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#hybrid-arrow)"/>
        <text x="380" y="506" fill="#2d3142" font-family="'Geist','Noto Sans SC',sans-serif" font-size="11">共享过滤条件</text>
        <line x1="530" y1="502" x2="572" y2="502" stroke="#bf4520" stroke-width="1.8" marker-end="url(#hybrid-arrow-accent)"/>
        <text x="584" y="506" fill="#2d3142" font-family="'Geist','Noto Sans SC',sans-serif" font-size="11">融合后精排</text>
        <text x="936" y="554" text-anchor="end" fill="#5a6580" font-family="'Geist Mono',monospace" font-size="9">HYBRID SEARCH · 01</text>
      </svg>
    </div>
  </main>
</body>
</html>
